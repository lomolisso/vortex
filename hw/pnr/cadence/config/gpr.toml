[design]
top               = "VX_gpr_top"
kind              = "leaf"
top_routing_layer = 6

[clock]
name            = "clk"
target_freq_mhz = 200
max_fanout      = 24

[floorplan]
# 4 R90 banks in 2 rows × 2 cols. Stdcell area ≈ 12k µm²; at u=0.85 →
# a_core ≈ 115.7k µm². AR=1 would land core ≈ 340 × 340 µm, but 2 cols need
# core_w ≥ 2·W_leaf = 366.80 µm. Minimum aspect that fits is 366.80²/115713
# ≈ 1.163 — holding aspect = 1.163 lands core ≈ 366.9 × 316.4 µm; macros sit
# top-aligned with a ~44 µm bottom stdcell strip.
target_utilization = 0.85
aspect_ratio       = 1.163
margin_um          = 5.0
recipe             = "cache_bank"

[floorplan.params]
num_ways   = 4
leaf_macro = "sram_64x128_1r1w"
store_path = "opc"
store_iter = "g_gpr_rams"
store_inst = "gpr_ram"

[pins]
layer_lr          = "M3"
layer_tb          = "M2"
side_distribution = { left = 0.0, right = 0.0, top = 0.0, bottom = 1.0 }

[[macros]]
name     = "sram_64x128_1r1w"
count    = 4
halo_um  = 5.0
role     = "gpr_bank_way"
lef_path = "sram/sram_64x128_1r1w/sram_64x128_1r1w.lef"

# [budget] is auto-generated by hw/scripts/gen_floorplan_config.py and
# re-written on every `make <cfg>` invocation. Hand edits below this
# line are discarded.
[budget]
generated_at        = "2026-05-27T14:42:51"
stdcell_area_um2    = 12071.080
macro_area_raw_um2  = 88926.992
macro_area_eff_um2  = 101511.792
core_area_um2       = 116083.996
floorplan_w_um         = 377.150
floorplan_h_um         = 327.600
floorplan_margin_lr_um = 5.130
floorplan_margin_tb_um = 5.600
utilization_overall    = 0.8700
warnings = [
    "u_overall=0.870 exceeds 0.85 — consider lowering target_utilization or growing halos before committing the floorplan.",
]
