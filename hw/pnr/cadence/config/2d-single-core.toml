# Generic PnR job configuration — see fpu.toml for schema doc.

[design]
top               = "VX_socket_top"
kind              = "socket"
top_routing_layer = 6

[clock]
name            = "clk"
target_freq_mhz = 200
max_fanout      = 24

[floorplan]
target_utilization = 0.85
aspect_ratio       = 0.667
# 10 µm: PG ring zone (8 µm) + M1 rail overhang. Margin < ring zone trips IMPPP-220.
margin_um          = 10.0
recipe             = "2d-single-core"

[floorplan.params]
row_gap_um          = 30.0
col_gap_um          = 30.0
pin_escape_gap_um   = 50.0
bot_pin_strip_um    = 80.0
top_margin_um       = 10.0

[pins]
layer_lr          = "M5"
layer_tb          = "M4"
side_distribution = { left = 0.0, right = 0.0, top = 0.0, bottom = 1.0 }

# All children are hard macros: FPU, TCU, LMem, GPR, L1 I/D banks.

[[macros]]
name     = "VX_local_mem_top"
count    = 1
halo_um  = 8.0
role     = "lmem"
lef_path = "core/lmem/VX_local_mem_top.lef"

[[macros]]
name     = "VX_gpr_top"
count    = 1
halo_um  = 8.0
role     = "gpr"
lef_path = "core/gpr/VX_gpr_top.lef"

[[macros]]
name     = "VX_fpu_top"
count    = 1
halo_um  = 8.0
role     = "fpu"
lef_path = "core/fpu/VX_fpu_top.lef"

[[macros]]
name     = "VX_tcu_top"
count    = 1
halo_um  = 8.0
role     = "tcu"
lef_path = "core/tcu/VX_tcu_top.lef"

[[macros]]
name     = "VX_l1_icache_bank_top"
count    = 1
halo_um  = 8.0
role     = "icache_bank"
lef_path = "core/l1_icache_bank/VX_l1_icache_bank_top.lef"

[[macros]]
name     = "VX_l1_dcache_bank_top"
count    = 1
halo_um  = 8.0
role     = "dcache_bank"
lef_path = "core/l1_dcache_bank/VX_l1_dcache_bank_top.lef"

