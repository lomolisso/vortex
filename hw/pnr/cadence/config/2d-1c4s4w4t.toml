# 4-core cluster. See fpu.toml for schema doc.

[design]
top               = "VX_cluster_top"
kind              = "cluster"
top_routing_layer = 10
# Top-of-stack — no parent build consumes a macro view.
extract_macro     = false

[clock]
name            = "clk"
target_freq_mhz = 200
max_fanout      = 32

[floorplan]
target_utilization = 0.72
aspect_ratio       = 1.0
# IMPPP-220: margin ≥ ring zone (8 µm on M9/M10).
margin_um          = 10.0
recipe             = "2d-1c4s4w4t"

[floorplan.params]
num_cores              = 4
l2_num_banks           = 4
l2_bank_grid_cols      = 2
l2_bank_grid_rows      = 2
macro_gap_um           = 120.0
l2_bank_gap_um         = 40.0
core_l2_gap_um         = 35.0
core_edge_offset_um    = 40.0

[pins]
layer_lr          = "M7"
layer_tb          = "M8"
side_distribution = { left = 0.35, right = 0.35, top = 0.15, bottom = 0.15 }

[[macros]]
name     = "VX_socket_top"
count    = 4
halo_um  = 15.0
role     = "core"
lef_path = "core/2d-single-core/VX_socket_top.lef"

[[macros]]
name     = "VX_l2_bank_top"
count    = 4
halo_um  = 10.0
role     = "l2_bank"
lef_path = "core/l2_bank/VX_l2_bank_top.lef"

# [budget] regenerated by gen_floorplan_config.py on every `make <cfg>`.
[budget]
generated_at        = "2026-05-14T15:03:59"
stdcell_area_um2    = 19312045.479
macro_area_raw_um2  = 38958141.378
macro_area_eff_um2  = 40685030.898
core_area_um2       = 67507316.286
floorplan_w_um      = 8216.284
floorplan_h_um      = 8216.284
floorplan_margin_um = 5.000
utilization_overall = 0.8632
warnings = [
    "u_overall=0.863 exceeds 0.85 — consider lowering target_utilization or growing halos before committing the floorplan.",
]
