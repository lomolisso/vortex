[design]
top               = "VX_l1_dcache_bank_top"
kind              = "leaf"
top_routing_layer = 6

[clock]
name            = "clk"
target_freq_mhz = 200
max_fanout      = 24

[floorplan]
# Data grid 2 cols × 2 rows (grid_rows=2) with an identically-shaped tag grid
# (sram_64x24_1r1w) to its right. The recipe sizes the die from the cluster
# geometry; target_utilization sets stdcell packing in the leftover; aspect_ratio
# is unused for cache_bank.
target_utilization = 0.85
aspect_ratio       = 1.0
margin_um          = 5.0
recipe             = "cache_bank"

[floorplan.params]
num_ways       = 4
grid_rows      = 2
leaf_macro     = "sram_64x512_1rw"
tag_macro      = "sram_64x24_1r1w"
tag_store_path = "bank/cache_tags"
tag_store_iter = "g_tag_store"
tag_store_inst = "tag_store"

[pins]
layer_lr          = "M3"
layer_tb          = "M2"
side_distribution = { left = 0.0, right = 0.0, top = 0.0, bottom = 1.0 }

[[macros]]
name     = "sram_64x512_1rw"
count    = 4
halo_um  = 5.0
role     = "dcache_bank_way"
lef_path = "sram/sram_64x512_1rw/sram_64x512_1rw.lef"

[[macros]]
name     = "sram_64x24_1r1w"
count    = 4
halo_um  = 4.0
role     = "dcache_bank_tag"
lef_path = "sram/sram_64x24_1r1w/sram_64x24_1r1w.lef"

# [budget] is auto-generated by hw/scripts/gen_floorplan_config.py and
# re-written on every `make <cfg>` invocation. Hand edits below this
# line are discarded.
[budget]
generated_at        = "2026-05-27T20:32:06"
stdcell_area_um2    = 51599.211
macro_area_raw_um2  = 229057.920
macro_area_eff_um2  = 253018.480
core_area_um2       = 314451.368
floorplan_w_um         = 570.380
floorplan_h_um         = 572.600
floorplan_margin_lr_um = 5.130
floorplan_margin_tb_um = 5.600
utilization_overall    = 0.8925
warnings = [
    "u_overall=0.893 exceeds 0.85 — consider lowering target_utilization or growing halos before committing the floorplan.",
]
