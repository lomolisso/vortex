# Generic PnR job schema (referenced by other TOMLs):
#   [design]              top, kind (leaf|socket|cluster), top_routing_layer
#   [clock]               name, target_freq_mhz, max_fanout
#   [floorplan]           target_utilization, aspect_ratio, margin_um, recipe
#   [floorplan.params]    opaque k/v bag for the recipe
#   [pins]                layer_lr, layer_tb, side_distribution
#   [[macros]]            one entry per macro type at this PnR level
#   [budget]              auto-generated by gen_floorplan_config.py

[design]
top               = "VX_fpu_top"
kind              = "leaf"
# Cap routing to M1..N. Frees M(N+1)..M_top for parent routing.
top_routing_layer = 4

[clock]
name            = "clk"
target_freq_mhz = 200
max_fanout      = 24

[floorplan]
target_utilization = 0.85
aspect_ratio       = 1.0
# IMPPP-220: margin ≥ ring zone (4 µm on M3/M4) + sroute via-stack slack.
margin_um          = 5.0
recipe             = "fpu"

[floorplan.params]

[pins]
layer_lr          = "M3"
layer_tb          = "M2"
side_distribution = { left = 1.0, right = 0.0, top = 0.0, bottom = 0.0 }

# [budget] regenerated by gen_floorplan_config.py on every `make <cfg>`.
[budget]
generated_at        = "2026-05-22T01:04:44"
stdcell_area_um2    = 106294.399
macro_area_raw_um2  = 0.000
macro_area_eff_um2  = 0.000
core_area_um2       = 125308.876
floorplan_w_um         = 364.040
floorplan_h_um         = 365.400
floorplan_margin_lr_um = 5.130
floorplan_margin_tb_um = 5.600
utilization_overall    = 0.8483
warnings = []
