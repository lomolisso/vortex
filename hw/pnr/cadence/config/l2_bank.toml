# Per-bank size = L2_CACHE_SIZE / L2_NUM_BANKS = 131072 B in both cluster configs.

[design]
top               = "VX_l2_bank_top"
kind              = "leaf"
top_routing_layer = 6

[clock]
name            = "clk"
target_freq_mhz = 200
max_fanout      = 32

[floorplan]
# Data grid 2 cols × 4 rows (grid_rows=4) with an identically-shaped tag grid
# (sram_256x24_1r1w) to its right. The recipe sizes the die from the cluster
# geometry; target_utilization sets stdcell packing in the leftover; aspect_ratio
# is unused for cache_bank.
target_utilization = 0.85
aspect_ratio       = 1.0
margin_um          = 5.0
recipe             = "cache_bank"

[floorplan.params]
num_ways       = 8
grid_rows      = 4
leaf_macro     = "sram_256x512_1rw"
tag_macro      = "sram_256x24_1r1w"
tag_store_path = "bank/cache_tags"
tag_store_iter = "g_tag_store"
tag_store_inst = "tag_store"

[pins]
layer_lr          = "M3"
layer_tb          = "M2"
side_distribution = { left = 0.0, right = 0.0, top = 0.0, bottom = 1.0 }

[[macros]]
name     = "sram_256x512_1rw"
count    = 8
halo_um  = 8.0
role     = "l2_bank_way"
lef_path = "sram/sram_256x512_1rw/sram_256x512_1rw.lef"

[[macros]]
name     = "sram_256x24_1r1w"
count    = 8
halo_um  = 4.0
role     = "l2_bank_tag"
lef_path = "sram/sram_256x24_1r1w/sram_256x24_1r1w.lef"

# [budget] is auto-generated by hw/scripts/gen_floorplan_config.py and
# re-written on every `make <cfg>` invocation. Hand edits below this
# line are discarded.
[budget]
generated_at        = "2026-05-29T09:57:53"
stdcell_area_um2    = 126179.226
macro_area_raw_um2  = 2007582.864
macro_area_eff_um2  = 2149214.864
core_area_um2       = 2298286.284
floorplan_w_um         = 1526.080
floorplan_h_um         = 1527.400
floorplan_margin_lr_um = 5.130
floorplan_margin_tb_um = 5.600
utilization_overall    = 0.9284
warnings = [
    "u_overall=0.928 exceeds 0.85 — consider lowering target_utilization or growing halos before committing the floorplan.",
]
