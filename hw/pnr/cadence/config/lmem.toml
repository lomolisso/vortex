[design]
top               = "VX_local_mem_top"
kind              = "leaf"
top_routing_layer = 6

[clock]
name            = "clk"
target_freq_mhz = 200
max_fanout      = 24

[floorplan]
# 4 R90 banks in 2 rows × 2 cols. Stdcell area ≈ 9k µm² (macro-dominated);
# at u=0.85 → a_core ≈ 160.5k µm². AR=1 would land core ≈ 401 × 401 µm, but
# 2 cols need core_w ≥ 2·W_leaf = 635.60 µm. Minimum aspect that fits is
# 635.60²/160507 ≈ 2.517 — holding aspect = 2.517 lands core ≈ 635.7 ×
# 253.4 µm. The bottom stdcell strip is only ~14 µm here (macros dominate
# the vertical extent); watch M3 pin escape from the lower row if u_cell is
# later raised or macros grow.
target_utilization = 0.85
aspect_ratio       = 2.517
margin_um          = 5.0
recipe             = "cache_bank"

[floorplan.params]
num_ways   = 4
grid_rows  = 2
leaf_macro = "sram_1024x32_1rw"
store_path = "local_mem"
store_iter = "g_data_store"
store_inst = "lmem_store"

[pins]
layer_lr          = "M3"
layer_tb          = "M2"
side_distribution = { left = 0.0, right = 0.0, top = 0.0, bottom = 1.0 }

[[macros]]
name     = "sram_1024x32_1rw"
count    = 4
halo_um  = 5.0
role     = "lmem_bank_way"
lef_path = "sram/sram_1024x32_1rw/sram_1024x32_1rw.lef"

# [budget] is auto-generated by hw/scripts/gen_floorplan_config.py and
# re-written on every `make <cfg>` invocation. Hand edits below this
# line are discarded.
[budget]
generated_at        = "2026-05-28T14:28:22"
stdcell_area_um2    = 6542.536
macro_area_raw_um2  = 132840.400
macro_area_eff_um2  = 150132.400
core_area_um2       = 157983.252
floorplan_w_um         = 640.680
floorplan_h_um         = 261.800
floorplan_margin_lr_um = 5.130
floorplan_margin_tb_um = 5.600
utilization_overall    = 0.8823
warnings = [
    "u_overall=0.882 exceeds 0.85 — consider lowering target_utilization or growing halos before committing the floorplan.",
]
