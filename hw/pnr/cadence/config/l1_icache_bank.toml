[design]
top               = "VX_l1_icache_bank_top"
kind              = "leaf"
top_routing_layer = 6

[clock]
name            = "clk"
target_freq_mhz = 200
max_fanout      = 24

[floorplan]
# Data grid 1 col × 2 rows (grid_rows=2) with an identically-shaped tag grid
# (sram_32x24_1r1w) to its right. The recipe sizes the die from the cluster
# geometry; target_utilization sets stdcell packing in the leftover; aspect_ratio
# is unused for cache_bank.
target_utilization = 0.85
aspect_ratio       = 1.0
margin_um          = 5.0
recipe             = "cache_bank"

[floorplan.params]
num_ways       = 2
grid_rows      = 2
leaf_macro     = "sram_32x512_1rw"
tag_macro      = "sram_32x24_1r1w"
tag_store_path = "bank/cache_tags"
tag_store_iter = "g_tag_store"
tag_store_inst = "tag_store"

[pins]
layer_lr          = "M3"
layer_tb          = "M2"
side_distribution = { left = 0.0, right = 0.0, top = 0.0, bottom = 1.0 }

[[macros]]
name     = "sram_32x512_1rw"
count    = 2
halo_um  = 5.0
role     = "icache_bank_data"
lef_path = "sram/sram_32x512_1rw/sram_32x512_1rw.lef"

[[macros]]
name     = "sram_32x24_1r1w"
count    = 2
halo_um  = 4.0
role     = "icache_bank_tag"
lef_path = "sram/sram_32x24_1r1w/sram_32x24_1r1w.lef"

# [budget] is auto-generated by hw/scripts/gen_floorplan_config.py and
# re-written on every `make <cfg>` invocation. Hand edits below this
# line are discarded.
[budget]
generated_at        = "2026-05-27T20:15:01"
stdcell_area_um2    = 13501.894
macro_area_raw_um2  = 90663.440
macro_area_eff_um2  = 101176.680
core_area_um2       = 117371.170
floorplan_w_um         = 352.450
floorplan_h_um         = 354.200
floorplan_margin_lr_um = 5.130
floorplan_margin_tb_um = 5.600
utilization_overall    = 0.8875
warnings = [
    "u_overall=0.887 exceeds 0.85 — consider lowering target_utilization or growing halos before committing the floorplan.",
]
