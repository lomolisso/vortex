# Distributed local memory (DLMEM): the blocks of a thread-block cluster
# address each other's local memory through one window. RV64 only, so the
# category runs in the xlen-64 tree; its one xlen-32 case checks the rejection.
# See docs/proposals/dlmem_proposal.md.
category: dlmem
defaults:
  xlen: [64]
  configs: "-DVX_CFG_EXT_DLMEM_ENABLE"
  tier: smoke
  touches: [hw/rtl/dlmem, hw/rtl/VX_kmu.sv, hw/rtl/VX_gpu_pkg.sv, hw/rtl/VX_define.vh,
            hw/rtl/Vortex.sv, hw/rtl/VX_cluster.sv, hw/rtl/interfaces/VX_kmu_bus_if.sv,
            hw/rtl/core/VX_cta_dispatch.sv, hw/rtl/core/VX_csr_data.sv,
            hw/rtl/core/VX_kmu_bus_arb.sv, hw/rtl/core/VX_bar_unit.sv,
            hw/rtl/core/VX_scheduler.sv, hw/rtl/mem/VX_gbar_unit.sv,
            hw/rtl/core/VX_mem_unit.sv, hw/rtl/cp/VX_cp_axil_regfile.sv,
            sim/simx/kmu, sim/simx/cta_dispatcher, sim/simx/scheduler, sim/simx/csr_unit.cpp,
            sim/simx/cluster, sim/simx/barrier_unit, sim/simx/processor.cpp,
            hw/rtl/core/VX_wctl_unit.sv, hw/rtl/core/VX_core.sv,
            hw/rtl/interfaces/VX_warp_ctl_if.sv,
            sim/common/cmd_processor.cpp, sw/common/dlmem_ref.h,
            sim/simx/wctl_unit.cpp, sim/simx/sfu_unit.cpp, sim/simx/lsu_unit,
            sim/simx/core, sim/simx/dlmem,
            sw/kernel/include/vx_dlmem.h, sw/kernel/include/vx_spawn2.h,
            sw/runtime/common/caps.h, sw/runtime/common/queue.cpp,
            sw/runtime/common/legacy_runtime.cpp, tests/regression/cluster_rank,
            tests/regression/cta_gang, tests/regression/cluster_sync,
            tests/regression/dlmem_local, VX_config.toml, VX_types.toml]
tests:
  # The cluster-rank CSR over three launches (K = 1, 2 as 1x2x1, 4 as 2x1x2),
  # each CTA's rank against its intra-cluster index, and the rank address map
  # against DLMEM_BASE + rank * local-memory size + offset.
  - id: cluster_rank-1c
    app: cluster_rank
    drivers: [simx, rtlsim]
    args: "-m"
  # Clusters round-robin across two cores behind an L2. The xrt leg wraps the
  # same RTL in the AFU shell and host stack, so it stands in for rtlsim here.
  - id: cluster_rank-mc
    app: cluster_rank
    drivers: [simx, xrt]
    shape: {cores: 2, l2cache: true}
    args: "-m"
  # K = NUM_WARPS = 8: the widest same-core cluster, every rank bit set.
  - id: cluster_rank-w8
    app: cluster_rank
    drivers: [simx, rtlsim]
    shape: {warps: 8}
    args: "-k 8 -m"
  # A 256 KB local memory, the largest DLMEM allows: one CTA per core fills and
  # checks it whole, right below the window, and the rank map strides by it.
  - id: cluster_rank-lmem18
    app: cluster_rank
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_LMEM_LOG_SIZE=18"
    args: "-l 262144"
  - id: cluster_rank-lmem17
    app: cluster_rank
    drivers: [rtlsim]
    configs+: "-DVX_CFG_LMEM_LOG_SIZE=17"
    args: "-m -l 131072"

  # SimX<->rtlsim parity at XLEN 64, which the entry's own xlen opts into. The
  # rank launches alone are all dispatch, so -l adds a fill of each core's whole
  # 16 KB local memory to let steady state dominate the gap. The 2-core and
  # 8-warp shapes are left out: their gaps predate DLMEM (see the proposal).
  - id: parity-cluster-rank
    check: model_parity
    app: cluster_rank
    xlen: [64]
    args: "-m -l 16384"

  # Distributed launch (VX_CLUSTER_POLICY_SPREAD): each cluster's blocks are
  # placed all at once on the cores of one hardware cluster, spread first. The
  # app checks every block ran once, ranks follow the walk, a cluster stays in
  # one hardware cluster, and the first cluster of each launch, placed on an
  # idle machine, puts rank r on core r. The A extension adds an atomic
  # rendezvous per cluster that only completes if its blocks are co-resident;
  # it needs one shared last-level cache, hence the L2 or L3 on these shapes.
  # One core: SPREAD of the largest K (1 here), SPREAD K=1, then DEFAULT
  # clusters of 2, in one process, so each launch restarts the placement.
  - id: cta_gang-1c
    app: cta_gang
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
  - id: cta_gang-2c
    app: cta_gang
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {cores: 2, l2cache: true}
    args: "-k 2 -n 8"
  # Four sockets of one core.
  - id: cta_gang-4c
    app: cta_gang
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {cores: 4, l2cache: true}
    args: "-k 4 -n 6"
  # Two sockets of two cores: the pinned beats cross both distributor levels.
  # The xrt leg wraps the same RTL in the AFU shell and host stack.
  - id: cta_gang-4c-s2
    app: cta_gang
    drivers: [simx, xrt]
    configs+: "-DVX_CFG_EXT_A_ENABLE -DVX_CFG_SOCKET_SIZE=2"
    shape: {cores: 4, l2cache: true}
    args: "-k 4 -n 6"
  # One socket of four cores, whose shared dcache is the last level.
  - id: cta_gang-4c-s4
    app: cta_gang
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE -DVX_CFG_SOCKET_SIZE=4"
    shape: {cores: 4}
    args: "-k 2 -n 12"
  # Two hardware clusters, each with its own gang unit and mirror.
  - id: cta_gang-2cl
    app: cta_gang
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {clusters: 2, cores: 2, l3cache: true}
    args: "-k 2 -n 8"
  # Multi-warp blocks: a core holds several blocks, of one or more clusters.
  - id: cta_gang-w2
    app: cta_gang
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {cores: 4, warps: 8, l2cache: true}
    args: "-k 4 -w 2"
  - id: cta_gang-w4
    app: cta_gang
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {cores: 4, warps: 8, l2cache: true}
    args: "-k 4 -w 4"
  # A block takes a core's whole 16 KB local memory, so each core has one usable
  # slot and the clusters run one after another.
  - id: cta_gang-lfull
    app: cta_gang
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {cores: 4, l2cache: true}
    args: "-k 4 -l 16384"
  # The runtime refuses SPREAD past VX_CAPS_DLMEM_MAX_CLUSTER, a cluster past
  # what the rank counter holds, policy 2 and a struct_size below version 1, on
  # both the single-launch and the batch path; it runs a version-1-sized
  # descriptor as DEFAULT, and a SPREAD batch launch spreads.
  - id: cta_gang-reject
    app: cta_gang
    drivers: [simx]
    shape: {cores: 2}
    args: "-r"
  # Without DLMEM, SPREAD is VX_ERR_NOT_SUPPORTED and no policy register is written.
  - id: cta_gang-reject-nodlmem
    app: cta_gang
    drivers: [simx]
    configs: ""
    shape: {cores: 2}
    args: "-r"

  # SimX<->rtlsim parity of the gang unit's placement and done-event timing, at
  # XLEN 64. Fixed ALU work and no rendezvous keep the instruction count exact.
  # Most of the ~4.6% cycle gap is not the gang: on this shape the RTL's socket
  # 1 finishes each wave's record stores ~500 cycles after socket 0 (SimX has no
  # such skew; DEFAULT already shows 4.2%), so later gangs share cores in rtlsim.
  # The done events reach the gang in the same order, one per cycle, in both.
  - id: parity-cta-gang
    check: model_parity
    app: cta_gang
    xlen: [64]
    configs+: "-DVX_CFG_SOCKET_SIZE=2"
    shape: {cores: 4}
    args: "-p -k 4 -n 16"

  # --- cluster barrier ---
  # cluster.sync() and the split barrier_arrive()/barrier_wait(). Each phase,
  # every warp adds itself to an atomic counter of its cluster before arriving
  # and must read the whole cluster back after the release; the arrive tokens
  # must follow the phase. A late rank per phase makes an early release show.
  # One core: same-core clusters of 4 two-warp blocks, then SPREAD K=1 and the
  # largest K, in one process, so each launch's slot admissions reset the
  # barrier state.
  - id: cluster_sync-1c
    app: cluster_sync
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {warps: 8}
  - id: cluster_sync-2c
    app: cluster_sync
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {cores: 2, l2cache: true}
    args: "-s -k 2 -n 8 -i 8"
  # Split arrive and wait: some waits come before the release, some after.
  - id: cluster_sync-4c
    app: cluster_sync
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {cores: 4, l2cache: true}
    args: "-s -k 4 -n 6 -m split"
  # Two sockets of two cores: the arrivals and releases cross both fork levels,
  # and rank r arrives r units late. The xrt leg wraps the same RTL in the AFU
  # shell and host stack, so it stands in for rtlsim here.
  - id: cluster_sync-4c-s2
    app: cluster_sync
    drivers: [simx, xrt]
    configs+: "-DVX_CFG_EXT_A_ENABLE -DVX_CFG_SOCKET_SIZE=2"
    shape: {cores: 4, l2cache: true}
    args: "-s -k 4 -n 6 -m skew"
  # Two hardware clusters, each with its own gang unit.
  - id: cluster_sync-2cl
    app: cluster_sync
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {clusters: 2, cores: 2, l3cache: true}
    args: "-s -k 2 -n 8"
  # Eight one-warp blocks per core and 64 clusters, so the gang ids recycle many
  # times; the last phase only arrives before the blocks exit, so releases find
  # their slots exited or admitted again.
  - id: cluster_sync-many
    app: cluster_sync
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {cores: 4, warps: 8, l2cache: true}
    args: "-s -k 2 -w 1 -n 64 -m exit"
  # Same-core clusters complete inside the core; a __syncthreads() and a block
  # barrier sit between each arrive and its wait.
  - id: cluster_sync-legacy
    app: cluster_sync
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {cores: 2, warps: 8, l2cache: true}
    args: "-d -k 4 -w 2 -m mixed"

  # SimX<->rtlsim parity of the cluster barrier at XLEN 64: 64 phases with fixed
  # work and no atomics. Sixteen one-warp blocks fill the four cores at once, so
  # the placement does not depend on the done-event timing. It runs the fence-free
  # arrive/wait (-r): on several sockets without an L2 the two models still cost
  # a fence differently (see the proposal's open items).
  - id: parity-cluster-sync
    check: model_parity
    app: cluster_sync
    xlen: [64]
    configs+: "-DVX_CFG_SOCKET_SIZE=2"
    shape: {cores: 4}
    args: "-p -r -s -k 4 -w 1 -n 4"
  # The same-core barrier, which never leaves the core: one cluster of four
  # blocks fills the core. It runs at 4 warps because 8-warp cores already
  # differ by ~16% without any cluster barrier (see the proposal's open items).
  - id: parity-cluster-sync-1c
    check: model_parity
    app: cluster_sync
    xlen: [64]
    args: "-p -d -k 4 -w 1"

  # --- aperture translation, co-located peers ---


  # Illegal knob combinations must stop the build, in SimX (the processor
  # object) and in the RTL (a Verilator lint of the processor), each with the
  # exact message. Tagged simx only for cell placement: a driverless case would
  # open a host cell, whose `-m dlmem` selects every case of the category.
  - id: reject-rv32
    via: script
    driver: simx
    xlen: [32]
    env: {EXPECT: "DLMEM requires XLEN 64"}
    run: &reject_run |
      set -u
      read -r vh vl xl <<< "$(printf 'include config.mk\nall:\n\t@echo $(VORTEX_HOME) $(VERILATOR_PATH) $(XLEN)\n' | make -s -f -)"
      tmp=$(mktemp -d)
      make -C sim/simx DESTDIR="$tmp" "$tmp/obj/processor.o" > "$tmp/simx.log" 2>&1; simx_rc=$?
      r=$vh/hw/rtl
      "$vl/bin/verilator" --lint-only -Wno-lint -Wno-style -Wno-REDEFMACRO \
        -DVX_CFG_XLEN="$xl" -DVX_CFG_XLEN_"$xl" -DSIMULATION ${CONFIGS:-} \
        -Isw -Ihw -I"$r" -I"$r/libs" -I"$r/interfaces" -I"$r/core" -I"$r/mem" \
        -I"$r/vm" -I"$r/cache" -I"$r/fpu" -I"$r/dlmem" \
        "$r/VX_gpu_pkg.sv" "$r/fpu/VX_fpu_pkg.sv" "$r/dlmem/VX_dlmem_pkg.sv" \
        "$r/VX_trace_pkg.sv" "$r/Vortex.sv" \
        --top-module Vortex > "$tmp/rtl.log" 2>&1; rtl_rc=$?
      fail=0
      for side in simx rtl; do
        rc=simx_rc; [ $side = rtl ] && rc=rtl_rc
        if [ "${!rc}" -eq 0 ]; then
          echo "FAIL: the $side build accepted CONFIGS=${CONFIGS:-}"; fail=1
        elif ! grep -qF "$EXPECT" "$tmp/$side.log"; then
          echo "FAIL: the $side build failed without '$EXPECT':"; tail -n 20 "$tmp/$side.log"; fail=1
        else
          echo "OK: the $side build rejects it: $(grep -F -m1 "$EXPECT" "$tmp/$side.log")"
        fi
      done
      rm -rf "$tmp"
      exit $fail
  - id: reject-maxcluster
    via: script
    driver: simx
    configs+: "-DVX_CFG_NUM_CORES=2 -DVX_CFG_DLMEM_MAX_CLUSTER=4"
    env: {EXPECT: "DLMEM_MAX_CLUSTER must be between 1 and the cores of a cluster"}
    run: *reject_run
  - id: reject-lmem19
    via: script
    driver: simx
    configs+: "-DVX_CFG_LMEM_LOG_SIZE=19"
    env: {EXPECT: "DLMEM requires a local memory of at most 256 KB"}
    run: *reject_run
  - id: reject-socketmult
    via: script
    driver: simx
    configs+: "-DVX_CFG_NUM_CORES=3 -DVX_CFG_SOCKET_SIZE=2"
    env: {EXPECT: "DLMEM requires NUM_CORES to be a multiple of SOCKET_SIZE"}
    run: *reject_run
