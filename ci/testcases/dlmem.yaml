# Distributed local memory (DLMEM): the blocks of a thread-block cluster
# address each other's local memory through one window. RV64 only, so the
# category runs in the xlen-64 tree; its one xlen-32 case checks the rejection.
# See docs/proposals/dlmem_proposal.md.
category: dlmem
defaults:
  xlen: [64]
  configs: "-DVX_CFG_EXT_DLMEM_ENABLE"
  tier: smoke
  touches: [hw/rtl/dlmem, hw/rtl/VX_kmu.sv, hw/rtl/VX_gpu_pkg.sv, hw/rtl/VX_define.vh,
            hw/rtl/Vortex.sv, hw/rtl/VX_cluster.sv, hw/rtl/interfaces/VX_kmu_bus_if.sv,
            hw/rtl/core/VX_cta_dispatch.sv, hw/rtl/core/VX_csr_data.sv,
            hw/rtl/core/VX_kmu_bus_arb.sv, hw/rtl/core/VX_bar_unit.sv,
            hw/rtl/core/VX_scheduler.sv, hw/rtl/mem/VX_gbar_unit.sv,
            hw/rtl/core/VX_mem_unit.sv, hw/rtl/cp/VX_cp_axil_regfile.sv,
            hw/rtl/mem/VX_lmem_switch.sv, hw/rtl/mem/VX_local_mem.sv, hw/rtl/VX_socket.sv,
            sim/simx/kmu, sim/simx/cta_dispatcher, sim/simx/scheduler, sim/simx/csr_unit.cpp,
            sim/simx/cluster, sim/simx/barrier_unit, sim/simx/processor.cpp,
            hw/rtl/core/VX_wctl_unit.sv, hw/rtl/core/VX_core.sv,
            hw/rtl/interfaces/VX_warp_ctl_if.sv,
            sim/common/cmd_processor.cpp, sw/common/dlmem_ref.h,
            sim/simx/wctl_unit.cpp, sim/simx/sfu_unit.cpp, sim/simx/lsu_unit,
            sim/simx/core, sim/simx/dlmem, sim/simx/socket, sim/simx/mem/local_mem,
            sw/kernel/include/vx_dlmem.h, sw/kernel/include/vx_spawn2.h,
            sw/runtime/common/caps.h, sw/runtime/common/queue.cpp,
            sw/runtime/common/legacy_runtime.cpp, tests/regression/cluster_rank,
            tests/regression/cta_gang, tests/regression/cluster_sync,
            tests/regression/dlmem_local, tests/regression/dlmem_store,
            tests/regression/dlmem_load, tests/regression/dlmem_atomic,
            tests/regression/dlmem_stress, VX_config.toml, VX_types.toml]
tests:
  # The cluster-rank CSR over three launches (K = 1, 2 as 1x2x1, 4 as 2x1x2),
  # each CTA's rank against its intra-cluster index, and the rank address map
  # against DLMEM_BASE + rank * local-memory size + offset.
  - id: cluster_rank-1c
    app: cluster_rank
    drivers: [simx, rtlsim]
    args: "-m"
  # Clusters round-robin across two cores behind an L2. The xrt leg wraps the
  # same RTL in the AFU shell and host stack, so it stands in for rtlsim here.
  - id: cluster_rank-mc
    app: cluster_rank
    drivers: [simx, xrt]
    shape: {cores: 2, l2cache: true}
    args: "-m"
  # K = NUM_WARPS = 8: the widest same-core cluster, every rank bit set.
  - id: cluster_rank-w8
    app: cluster_rank
    drivers: [simx, rtlsim]
    shape: {warps: 8}
    args: "-k 8 -m"
  # A 256 KB local memory, the largest DLMEM allows: one CTA per core fills and
  # checks it whole, right below the window, and the rank map strides by it.
  - id: cluster_rank-lmem18
    app: cluster_rank
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_LMEM_LOG_SIZE=18"
    args: "-l 262144"
  - id: cluster_rank-lmem17
    app: cluster_rank
    drivers: [rtlsim]
    configs+: "-DVX_CFG_LMEM_LOG_SIZE=17"
    args: "-m -l 131072"

  # SimX<->rtlsim parity at XLEN 64, which the entry's own xlen opts into. The
  # rank launches alone are all dispatch, so -l adds a fill of each core's whole
  # 16 KB local memory to let steady state dominate the gap. The 2-core and
  # 8-warp shapes are left out: their gaps predate DLMEM (see the proposal).
  - id: parity-cluster-rank
    check: model_parity
    app: cluster_rank
    xlen: [64]
    args: "-m -l 16384"

  # Distributed launch (VX_CLUSTER_POLICY_SPREAD): each cluster's blocks are
  # placed all at once on the cores of one hardware cluster, spread first. The
  # app checks every block ran once, ranks follow the walk, a cluster stays in
  # one hardware cluster, and the first cluster of each launch, placed on an
  # idle machine, puts rank r on core r. The A extension adds an atomic
  # rendezvous per cluster that only completes if its blocks are co-resident;
  # it needs one shared last-level cache, hence the L2 or L3 on these shapes.
  # One core: SPREAD of the largest K (1 here), SPREAD K=1, then DEFAULT
  # clusters of 2, in one process, so each launch restarts the placement.
  - id: cta_gang-1c
    app: cta_gang
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
  - id: cta_gang-2c
    app: cta_gang
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {cores: 2, l2cache: true}
    args: "-k 2 -n 8"
  # Four sockets of one core.
  - id: cta_gang-4c
    app: cta_gang
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {cores: 4, l2cache: true}
    args: "-k 4 -n 6"
  # Two sockets of two cores: the pinned beats cross both distributor levels.
  # The xrt leg wraps the same RTL in the AFU shell and host stack.
  - id: cta_gang-4c-s2
    app: cta_gang
    drivers: [simx, xrt]
    configs+: "-DVX_CFG_EXT_A_ENABLE -DVX_CFG_SOCKET_SIZE=2"
    shape: {cores: 4, l2cache: true}
    args: "-k 4 -n 6"
  # One socket of four cores, whose shared dcache is the last level.
  - id: cta_gang-4c-s4
    app: cta_gang
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE -DVX_CFG_SOCKET_SIZE=4"
    shape: {cores: 4}
    args: "-k 2 -n 12"
  # Two hardware clusters, each with its own gang unit and mirror.
  - id: cta_gang-2cl
    app: cta_gang
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {clusters: 2, cores: 2, l3cache: true}
    args: "-k 2 -n 8"
  # Multi-warp blocks: a core holds several blocks, of one or more clusters.
  - id: cta_gang-w2
    app: cta_gang
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {cores: 4, warps: 8, l2cache: true}
    args: "-k 4 -w 2"
  - id: cta_gang-w4
    app: cta_gang
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {cores: 4, warps: 8, l2cache: true}
    args: "-k 4 -w 4"
  # A block takes a core's whole 16 KB local memory, so each core has one usable
  # slot and the clusters run one after another.
  - id: cta_gang-lfull
    app: cta_gang
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {cores: 4, l2cache: true}
    args: "-k 4 -l 16384"
  # The runtime refuses SPREAD past VX_CAPS_DLMEM_MAX_CLUSTER, a cluster past
  # what the rank counter holds, policy 2 and a struct_size below version 1, on
  # both the single-launch and the batch path; it runs a version-1-sized
  # descriptor as DEFAULT, and a SPREAD batch launch spreads.
  - id: cta_gang-reject
    app: cta_gang
    drivers: [simx]
    shape: {cores: 2}
    args: "-r"
  # Without DLMEM, SPREAD is VX_ERR_NOT_SUPPORTED and no policy register is written.
  - id: cta_gang-reject-nodlmem
    app: cta_gang
    drivers: [simx]
    configs: ""
    shape: {cores: 2}
    args: "-r"

  # SimX<->rtlsim parity of the gang unit's placement and done-event timing, at
  # XLEN 64. Fixed ALU work and no rendezvous keep the instruction count exact.
  # Most of the ~4.6% cycle gap is not the gang: on this shape the RTL's socket
  # 1 finishes each wave's record stores ~500 cycles after socket 0 (SimX has no
  # such skew; DEFAULT already shows 4.2%), so later gangs share cores in rtlsim.
  # The done events reach the gang in the same order, one per cycle, in both.
  - id: parity-cta-gang
    check: model_parity
    app: cta_gang
    xlen: [64]
    configs+: "-DVX_CFG_SOCKET_SIZE=2"
    shape: {cores: 4}
    args: "-p -k 4 -n 16"

  # --- cluster barrier ---
  # cluster.sync() and the split barrier_arrive()/barrier_wait(). Each phase,
  # every warp adds itself to an atomic counter of its cluster before arriving
  # and must read the whole cluster back after the release; the arrive tokens
  # must follow the phase. A late rank per phase makes an early release show.
  # One core: same-core clusters of 4 two-warp blocks, then SPREAD K=1 and the
  # largest K, in one process, so each launch's slot admissions reset the
  # barrier state.
  - id: cluster_sync-1c
    app: cluster_sync
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {warps: 8}
  - id: cluster_sync-2c
    app: cluster_sync
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {cores: 2, l2cache: true}
    args: "-s -k 2 -n 8 -i 8"
  # Split arrive and wait: some waits come before the release, some after.
  - id: cluster_sync-4c
    app: cluster_sync
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {cores: 4, l2cache: true}
    args: "-s -k 4 -n 6 -m split"
  # Two sockets of two cores: the arrivals and releases cross both fork levels,
  # and rank r arrives r units late. The xrt leg wraps the same RTL in the AFU
  # shell and host stack, so it stands in for rtlsim here.
  - id: cluster_sync-4c-s2
    app: cluster_sync
    drivers: [simx, xrt]
    configs+: "-DVX_CFG_EXT_A_ENABLE -DVX_CFG_SOCKET_SIZE=2"
    shape: {cores: 4, l2cache: true}
    args: "-s -k 4 -n 6 -m skew"
  # Two hardware clusters, each with its own gang unit.
  - id: cluster_sync-2cl
    app: cluster_sync
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {clusters: 2, cores: 2, l3cache: true}
    args: "-s -k 2 -n 8"
  # Eight one-warp blocks per core and 64 clusters, so the gang ids recycle many
  # times; the last phase only arrives before the blocks exit, so releases find
  # their slots exited or admitted again.
  - id: cluster_sync-many
    app: cluster_sync
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {cores: 4, warps: 8, l2cache: true}
    args: "-s -k 2 -w 1 -n 64 -m exit"
  # Same-core clusters complete inside the core; a __syncthreads() and a block
  # barrier sit between each arrive and its wait.
  - id: cluster_sync-legacy
    app: cluster_sync
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {cores: 2, warps: 8, l2cache: true}
    args: "-d -k 4 -w 2 -m mixed"

  # SimX<->rtlsim parity of the cluster barrier at XLEN 64: 64 phases with fixed
  # work and no atomics. Sixteen one-warp blocks fill the four cores at once, so
  # the placement does not depend on the done-event timing. It runs the fence-free
  # arrive/wait (-r): on several sockets without an L2 the two models still cost
  # a fence differently (see the proposal's open items).
  - id: parity-cluster-sync
    check: model_parity
    app: cluster_sync
    xlen: [64]
    configs+: "-DVX_CFG_SOCKET_SIZE=2"
    shape: {cores: 4}
    args: "-p -r -s -k 4 -w 1 -n 4"
  # The same-core barrier, which never leaves the core: one cluster of four
  # blocks fills the core. It runs at 4 warps because 8-warp cores already
  # differ by ~16% without any cluster barrier (see the proposal's open items).
  - id: parity-cluster-sync-1c
    check: model_parity
    app: cluster_sync
    xlen: [64]
    args: "-p -d -k 4 -w 1"

  # --- aperture translation ---
  # A block reaches the local memory of every block of its cluster through the
  # window (the A extension needs one shared last-level cache, hence the L2 on
  # several cores): its own writes read back by every peer, stores
  # into every peer, an amoadd into rank 0, global, own and window lanes in one
  # instruction, sub-word stores at the slice and line edges, and the self
  # window against the plain pointer, each test its own launch. A same-core
  # cluster syncs on a local barrier of its base slot.
  # One core: SPREAD K=1 with 1 KB per block, then DEFAULT K=1 (the largest
  # cluster is 1) with 64 B and with the whole local memory.
  - id: dlmem_local-1c
    app: dlmem_local
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
  # SPREAD K=1 with 1 KB, then DEFAULT clusters of 2 with 64 B and of 4 with a
  # quarter of the local memory, each cluster on one core. The xrt leg
  # wraps the same RTL in the AFU shell and host stack, so it stands in for
  # rtlsim here.
  - id: dlmem_local-4c
    app: dlmem_local
    drivers: [simx, xrt]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {cores: 4, l2cache: true}
  - id: dlmem_local-k2
    app: dlmem_local
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {cores: 2, l2cache: true}
    args: "-d -k 2 -n 8"
  # The local memory split exactly K ways, at 16, 64 and 256 KB: the peers'
  # slices tile the whole memory and the last word of the last one is its end.
  - id: dlmem_local-lmem14
    app: dlmem_local
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {cores: 4, l2cache: true}
    args: "-d -k 4 -l 4096"
  - id: dlmem_local-lmem16
    app: dlmem_local
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE -DVX_CFG_LMEM_LOG_SIZE=16"
    shape: {cores: 4, l2cache: true}
    args: "-d -k 4 -l 16384"
  - id: dlmem_local-lmem18
    app: dlmem_local
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE -DVX_CFG_LMEM_LOG_SIZE=18"
    shape: {cores: 4, l2cache: true}
    args: "-d -k 4 -l 65536"
  # One-line and 1 KB slices: the edges of every peer sit a line apart.
  - id: dlmem_local-small
    app: dlmem_local
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {cores: 4, l2cache: true}
    args: "-d -k 4 -l 64 -l 1024"
  - id: dlmem_local-w4
    app: dlmem_local
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {cores: 4, warps: 8, l2cache: true}
    args: "-d -k 2 -w 4"
  # Two packets per warp: each carries its own lanes and hart ids.
  - id: dlmem_local-simd2
    app: dlmem_local
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE -DVX_CFG_SIMD_WIDTH=2"
    shape: {cores: 4, l2cache: true}
    args: "-d -k 4"
  # One-thread blocks, each keeping eight one-lane loads in flight: more
  # single-packet reads than the LSU can tag, so the translation stage must count
  # against its outstanding-read pool.
  - id: dlmem_local-burst
    app: dlmem_local
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE -DVX_CFG_SIMD_WIDTH=2"
    shape: {cores: 4, l2cache: true}
    args: "-b"
  # Two LSU blocks, each with its own translation stage and peer-table port.
  - id: dlmem_local-blocks2
    app: dlmem_local
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE -DVX_CFG_ISSUE_WIDTH=2"
    shape: {cores: 4, warps: 8, l2cache: true}
    args: "-d -k 4 -w 2 -l 1024"
  # Many more clusters than slots, each block ending with window stores to its
  # own rank right before it exits; the slot's next block must find them whole.
  - id: dlmem_local-exit
    app: dlmem_local
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {cores: 4, l2cache: true}
    args: "-d -k 2 -e -n 256"

  # SPREAD clusters, whose peers sit on other cores: the same six tests over
  # the network, the cluster syncing on cluster_group::sync().
  - id: dlmem_local-spread-2c
    app: dlmem_local
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {cores: 2, l2cache: true}
    args: "-s -k 2 -l 64 -l 1024 -n 3"
  - id: dlmem_local-spread-4c-s2
    app: dlmem_local
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE -DVX_CFG_SOCKET_SIZE=2"
    shape: {cores: 4, l2cache: true}
    args: "-s -k 4 -l 4096 -n 3"
  # The parity loops on the next rank's slice, which is on another core.
  - id: dlmem_local-spread-p
    app: dlmem_local
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {cores: 4, l2cache: true}
    args: "-p -s -k 4"
  # One store credit and one pending entry: the egress holds the LSU back, and
  # a fence waits at the translation stage for acks its warp's stores still owe.
  - id: dlmem_local-spread-p-credit1
    app: dlmem_local
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE -DVX_CFG_DLMEM_STORE_CREDITS=1 -DVX_CFG_DLMEM_PENDING_SIZE=1"
    shape: {cores: 4, l2cache: true}
    args: "-p -s -k 4"

  # A window access the core must refuse, stopping the simulation with the
  # exact message: a rank past the cluster inside the window. The shape goes in
  # CONFIGS, so the run reuses the prebuilt driver.
  - id: dlmem_local-oob
    via: script
    driver: simx
    configs+: "-DVX_CFG_NUM_CORES=4"
    env: {DRIVER: simx, APP: dlmem_local, ARGS: "-x oob", EXPECT: "DLMEM access out of bounds"}
    run: &expect_fail_run |
      set -u
      tmp=$(mktemp -d)
      if ! make -C sw/runtime/"$DRIVER" > "$tmp/build.log" 2>&1 \
         || ! make -C tests/regression/"$APP" >> "$tmp/build.log" 2>&1; then
        echo "FAIL: the build failed with CONFIGS=${CONFIGS:-}"; tail -n 20 "$tmp/build.log"
        rm -rf "$tmp"; exit 1
      fi
      timeout 120 ./ci/blackbox.sh --driver="$DRIVER" --app="$APP" --args="$ARGS" > "$tmp/run.log" 2>&1
      rc=$?
      fail=0
      if [ $rc -eq 0 ]; then
        echo "FAIL: '$ARGS' ran to completion on $DRIVER"; fail=1
      elif [ $rc -eq 124 ]; then
        echo "FAIL: '$ARGS' timed out on $DRIVER"; fail=1
      elif ! grep -qF "$EXPECT" "$tmp/run.log"; then
        echo "FAIL: '$ARGS' failed on $DRIVER (exit $rc) without '$EXPECT'"; fail=1
      else
        echo "OK: '$ARGS' stops $DRIVER (exit $rc): $(grep -F -m1 "$EXPECT" "$tmp/run.log")"
      fi
      [ $fail -eq 0 ] || tail -n 20 "$tmp/run.log"
      rm -rf "$tmp"
      exit $fail
  - id: dlmem_local-oob
    via: script
    driver: rtlsim
    configs+: "-DVX_CFG_NUM_CORES=4"
    env: {DRIVER: rtlsim, APP: dlmem_local, ARGS: "-x oob", EXPECT: "DLMEM access out of bounds"}
    run: *expect_fail_run

  # SimX<->rtlsim parity of the translation stage at XLEN 64: fixed loops of
  # window loads, stores and atomics, at one core on each block's own slice,
  # and at four cores on the next rank's slice of a same-core cluster of 4.
  - id: parity-dlmem-local
    check: model_parity
    app: dlmem_local
    xlen: [64]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    args: "-p"
  - id: parity-dlmem-local-4c
    check: model_parity
    app: dlmem_local
    xlen: [64]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {cores: 4, l2cache: true}
    args: "-p -k 4"

  # --- remote stores ---
  # SPREAD clusters store into the local memory of blocks on other cores. Every
  # block stores sampled doublewords of every slice as one doubleword, two words,
  # four halves or eight bytes, cluster.sync(), and checks its own slice (the
  # rest still holds its fill); then a ring of producers and consumers, each
  # storing data into the next rank, vx_fence(), and a flag store, the consumer
  # polling its own flag (bounded) and acking back. 64 B, 1 KB and SRAM / K per
  # block unless -l says otherwise. Each app fails a launch in which no cluster
  # spans two cores.
  - id: dlmem_store-2c
    app: dlmem_store
    drivers: [simx, rtlsim]
    shape: {cores: 2, l2cache: true}
    args: "-k 2 -l 64 -l 1024 -n 3"
  # Every default launch: K = 2 and 4 at 64 B, 1 KB and SRAM / K, too long for the RTL.
  - id: dlmem_store-4c-full
    app: dlmem_store
    drivers: [simx]
    shape: {cores: 4, l2cache: true}
  - id: dlmem_store-4c
    app: dlmem_store
    drivers: [simx, rtlsim]
    shape: {cores: 4, l2cache: true}
    args: "-k 4 -l 4096 -n 2"
  # Two sockets of two cores: the requests and acks cross the socket crossbar.
  # The xrt leg wraps the same RTL in the AFU shell and host stack, so it stands
  # in for rtlsim here.
  - id: dlmem_store-4c-s2
    app: dlmem_store
    drivers: [simx, xrt]
    configs+: "-DVX_CFG_SOCKET_SIZE=2"
    shape: {cores: 4, l2cache: true}
    args: "-k 4 -l 1024 -n 2"
  # One socket of four cores: only the socket switch, no crossbar.
  - id: dlmem_store-4c-s4
    app: dlmem_store
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_SOCKET_SIZE=4"
    shape: {cores: 4, l2cache: true}
    args: "-k 2 -l 64 -l 1024 -n 2"
  # Two hardware clusters, each with its own networks.
  - id: dlmem_store-2cl
    app: dlmem_store
    drivers: [simx, rtlsim]
    shape: {clusters: 2, cores: 2, l3cache: true}
    args: "-k 2 -l 1024 -n 3"
  # Two packets per warp: each carries its own lanes.
  - id: dlmem_store-simd2
    app: dlmem_store
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_SIMD_WIDTH=2"
    shape: {cores: 4, l2cache: true}
    args: "-k 4 -l 1024 -n 2"
  # Two-warp blocks on 8-warp cores: the ring's warps meet at a block barrier.
  - id: dlmem_store-w8
    app: dlmem_store
    drivers: [simx, rtlsim]
    shape: {cores: 4, warps: 8, l2cache: true}
    args: "-k 4 -w 2 -l 1024 -n 2"
  # One store credit and one pending entry, as dlmem_local-spread-p-credit1.
  - id: dlmem_store-credit1
    app: dlmem_store
    drivers: [simx]
    configs+: "-DVX_CFG_DLMEM_STORE_CREDITS=1 -DVX_CFG_DLMEM_PENDING_SIZE=1"
    shape: {cores: 2, l2cache: true}
    args: "-k 2 -l 64 -l 1024 -n 3"
  # Seeded random window loads, stores (1-8 bytes) and atomics on cells each
  # thread owns, spread over every slice, checked against the thread's own model,
  # plus adds into shared counters; each phase ends with cluster.sync(), the
  # fence-free arrive/wait or a ring of flags with a bounded spin. The host
  # checks every cell and counter against its model.
  - id: dlmem_stress-2c
    app: dlmem_stress
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {cores: 2, l2cache: true}
    args: "-k 2 -n 3 -i 4 -s 16"
  - id: dlmem_stress-4c-s2
    app: dlmem_stress
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE -DVX_CFG_SOCKET_SIZE=2"
    shape: {cores: 4, l2cache: true}
    args: "-k 4 -n 2 -i 4 -s 16 -r 3"
  # The full default mix (8 phases of 32 steps, K = 2 and 4), too long for the RTL.
  - id: dlmem_stress-4c-long
    app: dlmem_stress
    drivers: [simx]
    configs+: "-DVX_CFG_EXT_A_ENABLE -DVX_CFG_SOCKET_SIZE=2"
    shape: {cores: 4, l2cache: true}
    args: "-r 11"
  # A DXA copy into each block's own local memory every phase, beside the
  # ingress writes (no multicast: never with SPREAD).
  - id: dlmem_stress-dxa
    app: dlmem_stress
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE -DVX_CFG_EXT_DXA_ENABLE"
    shape: {cores: 4, l2cache: true}
    args: "-k 4 -n 2 -i 4 -s 16 -d -r 5"
  - id: dlmem_stress-2cl-w2
    app: dlmem_stress
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {clusters: 2, cores: 2, warps: 8, l3cache: true}
    args: "-k 2 -w 2 -n 2 -i 4 -s 16 -r 9"

  # --- remote loads ---
  # Each block fills its own slice, cluster.sync(), and reads every slice at
  # every width with its sign or zero extension; ping-pong between ranks 2i and
  # 2i + 1 polling each other's doubleword; one word and one doubleword load
  # whose lanes are global, own local memory and the window on another core; and
  # a thread's window store followed by its own load of the same bytes, with no
  # fence between them. 1 KB and SRAM / K per block unless -l says otherwise.
  - id: dlmem_load-2c
    app: dlmem_load
    drivers: [simx, rtlsim]
    shape: {cores: 2, l2cache: true}
    args: "-k 2 -n 3"
  - id: dlmem_load-4c
    app: dlmem_load
    drivers: [simx, rtlsim]
    shape: {cores: 4, l2cache: true}
    args: "-k 4 -l 1024 -n 3"
  - id: dlmem_load-4c-s2
    app: dlmem_load
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_SOCKET_SIZE=2"
    shape: {cores: 4, l2cache: true}
    args: "-k 4 -l 4096 -n 2"
  # One socket of four cores. The xrt leg wraps the same RTL in the AFU shell
  # and host stack, so it stands in for rtlsim here.
  - id: dlmem_load-4c-s4
    app: dlmem_load
    drivers: [simx, xrt]
    configs+: "-DVX_CFG_SOCKET_SIZE=4"
    shape: {cores: 4, l2cache: true}
    args: "-k 4 -l 1024 -n 2"
  - id: dlmem_load-2cl
    app: dlmem_load
    drivers: [simx, rtlsim]
    shape: {clusters: 2, cores: 2, l3cache: true}
    args: "-k 2 -l 1024 -n 3"
  - id: dlmem_load-simd2
    app: dlmem_load
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_SIMD_WIDTH=2"
    shape: {cores: 4, l2cache: true}
    args: "-k 4 -l 1024 -n 2"
  - id: dlmem_load-w8
    app: dlmem_load
    drivers: [simx, rtlsim]
    shape: {cores: 4, warps: 8, l2cache: true}
    args: "-k 2 -w 4 -l 1024 -n 3"

  # --- remote atomics ---
  # An amoadd.w/.d histogram into rank 0 from every block, and one amoadd
  # ticket of each width per thread from rank K-1 (each value once, the word
  # tickets crossing the sign bit and the doubleword ones the low-word carry);
  # an amoswap spinlock in rank K-1 around a plain window read-modify-write of
  # a counter in rank 0, with a holder word in rank 1; and every amo{add,xor,
  # and,or,min,max,minu,maxu}.{w,d} into every slice with no destination
  # register, against the host's fold.
  - id: dlmem_atomic-2c
    app: dlmem_atomic
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {cores: 2, l2cache: true}
    args: "-k 2 -n 3"
  - id: dlmem_atomic-4c
    app: dlmem_atomic
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {cores: 4, l2cache: true}
    args: "-k 4 -n 3"
  - id: dlmem_atomic-4c-s2
    app: dlmem_atomic
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE -DVX_CFG_SOCKET_SIZE=2"
    shape: {cores: 4, l2cache: true}
    args: "-k 4 -n 3"
  - id: dlmem_atomic-4c-s4
    app: dlmem_atomic
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE -DVX_CFG_SOCKET_SIZE=4"
    shape: {cores: 4, l2cache: true}
    args: "-k 4 -n 3"
  # Two hardware clusters. The xrt leg wraps the same RTL in the AFU shell and
  # host stack, so it stands in for rtlsim here.
  - id: dlmem_atomic-2cl
    app: dlmem_atomic
    drivers: [simx, xrt]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {clusters: 2, cores: 2, l3cache: true}
    args: "-k 2 -n 3"
  - id: dlmem_atomic-simd2
    app: dlmem_atomic
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE -DVX_CFG_SIMD_WIDTH=2"
    shape: {cores: 4, l2cache: true}
    args: "-k 4 -n 2"
  - id: dlmem_atomic-w8
    app: dlmem_atomic
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE"
    shape: {cores: 4, warps: 8, l2cache: true}
    args: "-k 4 -w 2 -i 2 -n 2"
  # Compare-and-swap retry loops on a word and a doubleword counter, starting
  # just below the sign bit and the low-word carry; the compare value travels
  # in the request.
  - id: dlmem_atomic-zacas
    app: dlmem_atomic
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_A_ENABLE -DVX_CFG_EXT_ZACAS_ENABLE"
    shape: {cores: 4, l2cache: true}
    args: "-k 4 -t 8 -n 2"
  # A reservation on another core's local memory must stop the simulation:
  # the network carries no LR/SC.
  - id: dlmem_atomic-lrsc
    via: script
    driver: simx
    configs+: "-DVX_CFG_EXT_A_ENABLE -DVX_CFG_NUM_CORES=2 -DVX_CFG_L2_ENABLE"
    env: {DRIVER: simx, APP: dlmem_atomic, ARGS: "-x lrsc", EXPECT: "remote LR/SC is not supported"}
    run: *expect_fail_run
  - id: dlmem_atomic-lrsc
    via: script
    driver: rtlsim
    configs+: "-DVX_CFG_EXT_A_ENABLE -DVX_CFG_NUM_CORES=2 -DVX_CFG_L2_ENABLE"
    env: {DRIVER: rtlsim, APP: dlmem_atomic, ARGS: "-x lrsc", EXPECT: "remote LR/SC is not supported"}
    run: *expect_fail_run

  # SimX<->rtlsim parity of the network at XLEN 64: fixed loops of window
  # stores, loads and atomics into the next rank's slice, on another core, with
  # no spin and no data-dependent trip count, between fence-free cluster
  # barriers. Four clusters of four one-warp blocks fill the four cores at once,
  # so the placement does not depend on the done-event timing. The stores run
  # on two sockets (the crossbar), the loads on four, the atomics on one socket.
  # Eight lanes per store outrun the store credits and the ingress slots, so
  # the store cell is bound by the network and holds its fences.
  - id: parity-dlmem-store
    check: model_parity
    app: dlmem_store
    xlen: [64]
    configs+: "-DVX_CFG_SOCKET_SIZE=2"
    shape: {cores: 4, threads: 8, l2cache: true}
    args: "-p -k 4 -n 4"
  - id: parity-dlmem-load
    check: model_parity
    app: dlmem_load
    xlen: [64]
    shape: {cores: 4, l2cache: true}
    args: "-p -k 4 -n 4"
  - id: parity-dlmem-atomic
    check: model_parity
    app: dlmem_atomic
    xlen: [64]
    configs+: "-DVX_CFG_EXT_A_ENABLE -DVX_CFG_SOCKET_SIZE=4"
    shape: {cores: 4, l2cache: true}
    args: "-p -k 4 -n 4"
  # The same loops with a fence per iteration: the fence waits at the
  # translation stage until the atomics' answers reach the egress. No L2, so
  # the socket's dcache is the shared level and drains a fence: the two models
  # cost a walking fence differently even with the knob off (amo -tamomax at
  # 4 cores + L2: 26492 SimX vs 29900 RTL cycles).
  - id: parity-dlmem-atomic-fence
    check: model_parity
    app: dlmem_atomic
    xlen: [64]
    configs+: "-DVX_CFG_EXT_A_ENABLE -DVX_CFG_SOCKET_SIZE=4"
    shape: {cores: 4}
    args: "-p -f -k 4 -n 4"


  # Illegal knob combinations must stop the build, in SimX (the processor
  # object) and in the RTL (a Verilator lint of the processor), each with the
  # exact message. Tagged simx only for cell placement: a driverless case would
  # open a host cell, whose `-m dlmem` selects every case of the category.
  - id: reject-rv32
    via: script
    driver: simx
    xlen: [32]
    env: {EXPECT: "DLMEM requires XLEN 64"}
    run: &reject_run |
      set -u
      read -r vh vl xl <<< "$(printf 'include config.mk\nall:\n\t@echo $(VORTEX_HOME) $(VERILATOR_PATH) $(XLEN)\n' | make -s -f -)"
      tmp=$(mktemp -d)
      make -C sim/simx DESTDIR="$tmp" "$tmp/obj/processor.o" > "$tmp/simx.log" 2>&1; simx_rc=$?
      r=$vh/hw/rtl
      "$vl/bin/verilator" --lint-only -Wno-lint -Wno-style -Wno-REDEFMACRO \
        -DVX_CFG_XLEN="$xl" -DVX_CFG_XLEN_"$xl" -DSIMULATION ${CONFIGS:-} \
        -Isw -Ihw -I"$r" -I"$r/libs" -I"$r/interfaces" -I"$r/core" -I"$r/mem" \
        -I"$r/vm" -I"$r/cache" -I"$r/fpu" -I"$r/dlmem" \
        "$r/VX_gpu_pkg.sv" "$r/fpu/VX_fpu_pkg.sv" "$r/dlmem/VX_dlmem_pkg.sv" \
        "$r/VX_trace_pkg.sv" "$r/Vortex.sv" \
        --top-module Vortex > "$tmp/rtl.log" 2>&1; rtl_rc=$?
      fail=0
      for side in simx rtl; do
        rc=simx_rc; [ $side = rtl ] && rc=rtl_rc
        if [ "${!rc}" -eq 0 ]; then
          echo "FAIL: the $side build accepted CONFIGS=${CONFIGS:-}"; fail=1
        elif ! grep -qF "$EXPECT" "$tmp/$side.log"; then
          echo "FAIL: the $side build failed without '$EXPECT':"; tail -n 20 "$tmp/$side.log"; fail=1
        else
          echo "OK: the $side build rejects it: $(grep -F -m1 "$EXPECT" "$tmp/$side.log")"
        fi
      done
      rm -rf "$tmp"
      exit $fail
  - id: reject-maxcluster
    via: script
    driver: simx
    configs+: "-DVX_CFG_NUM_CORES=2 -DVX_CFG_DLMEM_MAX_CLUSTER=4"
    env: {EXPECT: "DLMEM_MAX_CLUSTER must be between 1 and the cores of a cluster"}
    run: *reject_run
  - id: reject-lmem19
    via: script
    driver: simx
    configs+: "-DVX_CFG_LMEM_LOG_SIZE=19"
    env: {EXPECT: "DLMEM requires a local memory of at most 256 KB"}
    run: *reject_run
  - id: reject-socketmult
    via: script
    driver: simx
    configs+: "-DVX_CFG_NUM_CORES=3 -DVX_CFG_SOCKET_SIZE=2"
    env: {EXPECT: "DLMEM requires NUM_CORES to be a multiple of SOCKET_SIZE"}
    run: *reject_run
