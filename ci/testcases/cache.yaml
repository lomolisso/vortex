- id: carveout-default-standalone
  via: script
  driver: simx
  xlen: [64]
  configs: "-DVX_CFG_H100_SM_ENABLE -DVX_CFG_L2_ENABLE -DVX_CFG_NUM_CORES=1 -DVX_CFG_NUM_WARPS=4 -DVX_CFG_NUM_THREADS=32"
  touches: *carveout_touches
  run: |
    set -u
    make -C sim/simx > /dev/null || { echo "FAIL: simx build"; exit 1; }
    make -C tests/regression/carveout/standalone clean > /dev/null
    make -C tests/regression/carveout/standalone run-simx; rc=$?
    if [ $rc -ne 0 ]; then echo "FAIL: exit code $rc"; exit 1; fi
    echo "PASSED!"
