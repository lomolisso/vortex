- id: reject-sm-l1-ways
  via: script
  driver: simx
  xlen: [64]
  configs: "-DVX_CFG_H100_SM_ENABLE -DVX_CFG_L1_TAG_WAYS=12"
  env: {EXPECT: "L1_TAG_WAYS_POW2"}
  touches: [VX_config.toml, ci/gen_config.py]
  run: |
    set -u
    tmp=$(mktemp -d)
    make -C sim/simx DESTDIR="$tmp" "$tmp/obj/socket.o" > "$tmp/simx.log" 2>&1; rc=$?
    if [ $rc -eq 0 ]; then echo "FAIL: the simx build accepted CONFIGS=${CONFIGS:-}"; rm -rf "$tmp"; exit 1; fi
    if ! grep -qF "$EXPECT" "$tmp/simx.log"; then echo "FAIL: the build failed without '$EXPECT':"; tail -n 20 "$tmp/simx.log"; rm -rf "$tmp"; exit 1; fi
    echo "PASSED: the build stopped at $EXPECT"; rm -rf "$tmp"
