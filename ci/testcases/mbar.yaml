              hw/rtl/core/VX_kmu_bus_arb.sv, hw/rtl/core/VX_bar_unit.sv, hw/rtl/mem/VX_gbar_unit.sv,
              hw/rtl/core/VX_execute.sv, hw/rtl/cp/VX_cp_axil_regfile.sv, hw/rtl/VX_socket.sv,
