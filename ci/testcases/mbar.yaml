    app: cf_decoder
    drivers: [simx]
    configs+: *dsmem_coll_cfg
    shape: &cf_decoder_shape {cores: 4, warps: 4, threads: 32, l2cache: true}
    env: &cf_decoder_env {CF_LLAMA_HEADS: "4", CF_MLA_HEADS: "2", CF_MLA_HIDDEN: "1024", CF_MLA_SEQ: "128"}
