# mbarriers: 64-bit synchronization objects in a block's local memory, which
# the local memory banks update in their atomic unit (custom-2 arrive,
# arrive_tx, expect_tx, complete_tx, test_wait, try_wait). RV64, on a DLMEM
# device with the A extension. try_wait suspends the warp in the core's
# waiter table until the phase completes or the time limit passes. The
# arrive and tx ops also reach a peer block's object through the DLMEM
# window, as remote atomics. The apps check every final object word against
# the golden model sw/common/mbar_ref.h. See docs/proposals/dlmem_proposal.md.
category: mbar
defaults:
  xlen: [64]
  configs: "-DVX_CFG_EXT_DLMEM_ENABLE -DVX_CFG_EXT_A_ENABLE -DVX_CFG_EXT_MBAR_ENABLE"
  tier: smoke
  touches: [hw/rtl/cache/VX_amo_alu.sv, hw/rtl/cache/VX_amo_unit.sv, hw/rtl/mem/VX_local_mem.sv,
            hw/rtl/core/VX_decode.sv, hw/rtl/VX_gpu_pkg.sv, hw/rtl/VX_define.vh, hw/rtl/dlmem,
            hw/rtl/core/VX_lsu_slice.sv, hw/rtl/core/VX_mem_unit.sv, hw/rtl/core/VX_core.sv,
            sim/simx/types.h, sim/simx/decode.cpp, sim/simx/amo, sim/simx/mem/local_mem,
            sim/simx/lsu_unit, sim/simx/dlmem, sim/simx/core, sim/simx/processor.cpp,
            sw/common/mbar_ref.h, sw/kernel/include/vx_mbar.h, tests/regression/mbar_local,
            VX_config.toml, hw/rtl/cache/VX_cache_amo.sv, hw/rtl/core/VX_wctl_unit.sv,
            hw/rtl/interfaces/VX_warp_ctl_if.sv, sim/simx/sfu_unit.cpp,
            sw/kernel/include/vx_dlmem.h, sw/kernel/include/vx_dxa.h, sw/common/dxa_tmap.h,
            hw/rtl/mem/VX_lmem_switch.sv, hw/rtl/core/VX_lsu_unit.sv,
            hw/rtl/core/VX_scheduler.sv, sw/common/dlmem_ref.h, hw/rtl/dxa, hw/rtl/VX_kmu.sv,
            hw/rtl/Vortex.sv, hw/rtl/VX_cluster.sv, hw/rtl/interfaces/VX_kmu_bus_if.sv,
            hw/rtl/core/VX_cta_dispatch.sv, hw/rtl/core/VX_csr_data.sv,
            hw/rtl/core/VX_kmu_bus_arb.sv, hw/rtl/core/VX_bar_unit.sv,
            hw/rtl/mem/VX_gbar_unit.sv, hw/rtl/core/VX_execute.sv,
            hw/rtl/interfaces/VX_sched_unlock_if.sv, hw/rtl/cp/VX_cp_axil_regfile.sv,
            hw/rtl/VX_socket.sv, sim/simx/kmu, sim/simx/cta_dispatcher, sim/simx/scheduler,
            sim/simx/csr_unit.cpp, sim/simx/cluster, sim/simx/barrier_unit,
            sim/common/cmd_processor.cpp, sim/simx/wctl_unit.cpp, sim/simx/socket,
            sw/kernel/include/vx_spawn2.h, sw/runtime/common/caps.h,
            sw/runtime/common/queue.cpp, sw/runtime/common/legacy_runtime.cpp,
            tests/regression/cluster_rank, tests/regression/cta_gang,
            tests/regression/cluster_sync, tests/regression/dlmem_local,
            tests/regression/dlmem_store, tests/regression/dlmem_load,
            tests/regression/dlmem_atomic, tests/regression/dlmem_stress,
            tests/regression/lmem_bar_order, tests/regression/dlmem_amo_order, VX_types.toml,
            hw/rtl/core/VX_uop_sequencer.sv, hw/rtl/dlmem/VX_uop_release.sv, sim/simx/sequencer,
            hw/rtl/core/VX_cpa_unit.sv, sim/simx/cpa_unit, hw/rtl/VX_trace_pkg.sv,
            sim/simx/instr.h, hw/rtl/cache, sim/simx/mem/cache, hw/rtl/VX_socket.sv,
            hw/rtl/tcu, sim/simx/tcu, sw/kernel/include/vx_tensor.h,
            tests/regression/sgemm_tcu_wg_mbar, tests/regression/sgemm_tcu_mx_mbar,
            sim/simx/mbar_waiters, sim/simx/Makefile, tests/regression/mbar_wait,
            tests/regression/mbar_remote, sw/common/dxa_ref.h, sw/common/dxa_meta.h,
            hw/rtl/core/VX_bg_unit.sv, hw/rtl/core/VX_sfu_unit.sv, sim/simx/bg_unit, sim/simx/dxa/dxa_bg.h,
            sim/simx/dxa/dxa_core.cpp, sim/simx/dxa/dxa_core.h, sim/simx/dxa/dxa_unit.cpp,
            sim/simx/dxa/dxa_unit.h, sim/simx/sfu_unit]
tests:
  # One block of 4 warps x 4 threads. basic: every thread arrives with 1 and
  # waits on its token for 32 phases; the stores before each arrive must be
  # visible after the wait. count: lane 0 of each warp arrives for its warp,
  # odd warps in two arrives. pc: two producer and two consumer warps over a
  # double buffer with FULL and EMPTY barriers; an EMPTY arrive must wait for
  # the warp's loads. tx: a scripted sequence of every op (each returned word
  # against mbar_ref, a complete before its expect, a flip by expect_tx, tx at
  # both ends of its range), then expect/complete/arrive_tx by every warp per
  # phase with the completes first on odd phases.
  - id: mbar_local
    app: mbar_local
    drivers: [simx, rtlsim]
    args: "-m basic -r 32"
  - id: mbar_local-count
    app: mbar_local
    drivers: [simx, rtlsim]
    args: "-m count -r 32"
  - id: mbar_local-pc
    app: mbar_local
    drivers: [simx, rtlsim]
    args: "-m pc -r 32"
  - id: mbar_local-tx
    app: mbar_local
    drivers: [simx, rtlsim]
    args: "-m tx -r 16"
  # The xrt leg wraps the same RTL in the AFU shell and host stack.
  - id: mbar_local-pc-xrt
    app: mbar_local
    drivers: [xrt]
    args: "-m pc -r 16"

  # Wider shapes: 8 warps of 8 threads (64 arrivals per phase on one word, four
  # producer and four consumer warps), and SIMD 2 with issue width 2, where a
  # warp's lanes reach the banks as two packets.
  - id: mbar_local-w8t8
    app: mbar_local
    drivers: [simx, rtlsim]
    tier: nightly
    shape: {warps: 8, threads: 8}
    args: "-m basic -r 32"
  - id: mbar_local-pc-w8t8
    app: mbar_local
    drivers: [simx, rtlsim]
    tier: nightly
    shape: {warps: 8, threads: 8}
    args: "-m pc -r 64"
  - id: mbar_local-tx-simd2
    app: mbar_local
    drivers: [simx, rtlsim]
    tier: nightly
    configs+: "-DVX_CFG_SIMD_WIDTH=2 -DVX_CFG_ISSUE_WIDTH=2"
    shape: {warps: 8}
    args: "-m tx -r 32"
  # Two warps stream DXA copies into their own tiles, so DMA beats win the
  # banks while the objects are updated.
  - id: mbar_local-pc-dxa
    app: mbar_local
    drivers: [simx, rtlsim]
    tier: nightly
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    shape: {warps: 8}
    args: "-m pc -r 64 -D 2"
  - id: mbar_local-pc-dxa-simd2
    app: mbar_local
    drivers: [simx, rtlsim]
    tier: nightly
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_SIMD_WIDTH=2"
    shape: {warps: 8}
    args: "-m pc -r 64 -D 2"
  - id: mbar_local-count-dxa
    app: mbar_local
    drivers: [simx, rtlsim]
    tier: nightly
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    shape: {warps: 8}
    args: "-m count -r 64 -D 2"

  # SimX<->rtlsim parity at XLEN 64: no spin (the warps meet in a register
  # barrier where they would wait, then test_wait must pass at once), so the
  # instruction count is exact; the arrive holds and the bank's atomic timing
  # set the cycles.
  - id: parity-mbar-local
    check: model_parity
    app: mbar_local
    xlen: [64]
    args: "-m pc -r 32 -p"
  - id: parity-mbar-tx
    check: model_parity
    app: mbar_local
    xlen: [64]
    args: "-m tx -r 16 -p"

  # --- releases of global memory and tensor-core loads ---
  # glob: pc over a global double buffer in one block, so one L1. With issue
  # width 2 each producer warp has a consumer warp on the other LSU block,
  # whose loads reach the L1 through another input: the FULL arrive, a
  # CTA-scope release, must wait until the producers' stores are in the L1.
  - id: mbar_local-glob
    app: mbar_local
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_ISSUE_WIDTH=2"
    args: "-m glob -r 32 -b 4"
  # The xrt leg shares the pc-xrt build.
  - id: mbar_local-glob-xrt
    app: mbar_local
    drivers: [xrt]
    args: "-m glob -r 16"
  - id: mbar_local-glob-w8t8
    app: mbar_local
    drivers: [simx, rtlsim]
    tier: nightly
    configs+: "-DVX_CFG_ISSUE_WIDTH=4"
    shape: {warps: 8, threads: 8}
    args: "-m glob -r 64 -b 8"
  # lmem_bar_order with a global X released by an mbarrier arrive; dlmem.yaml
  # has the barrier and .rl forms. Every lane's stores miss on X's L1 bank, so
  # the X store can wait there while the arrive goes to local memory.
  - id: lmem_bar_order-gst-mbar
    app: lmem_bar_order
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_ISSUE_WIDTH=2"
    args: "-m mbar -o gst -d 1 -r 200 -b 8 -w 0 -e 768 -s 1"
  # MX metadata staged in local memory by a producer warp: the consumer's
  # EMPTY arrive follows its TCU_LDs of the buffer, which the producer then
  # overwrites; the arrive must wait for the TCU_LD writeback. Each K block
  # has its own magnitude, so wrong scales fail the GEMM check.
  - id: sgemm_tcu_mx_mbar
    app: sgemm_tcu_mx_mbar
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_MX_ENABLE -DVX_CFG_TCU_FP8_ENABLE -DVX_CFG_NUM_THREADS=4 -DITYPE=mxfp8 -DOTYPE=fp32"
    args: "-k 256"

  # --- wgmma groups ---
  # A CUTLASS-style multi-stage mainloop: a DXA producer warp fills S stages
  # of slabs behind FULL/EMPTY mbarriers; the WGMMA group (one consumer warp
  # per issue slot) runs wgmma, commit_group, wait_group<1> and arrives on
  # the previous stage's EMPTY. The GEMM is checked against the CPU; lat
  # ends with wait_group<0> and prints the cycles from the last wgmma to it.
  - id: sgemm_tcu_wg_mbar
    app: sgemm_tcu_wg_mbar
    drivers: [simx, rtlsim]
    configs+: &wg_mbar "-DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_ISSUE_WIDTH=2 -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DITYPE=fp16 -DOTYPE=fp32 -DWGMMA_NRC=8"
    args: "-m wait -s 3"
  - id: sgemm_tcu_wg_mbar-lat
    app: sgemm_tcu_wg_mbar
    drivers: [simx, rtlsim]
    configs+: *wg_mbar
    args: "-m lat -s 3"
  # k-tile 0 waits on a one-wgmma group at once, then on a 48-wgmma group,
  # whose retires carry `done` far past the first, waited boundary (a 6-bit
  # compare must not see that boundary again), then wait_group<2> on three
  # groups sharing one boundary. The consumers drift apart in the large group,
  # so the B buffer serves two different wgmmas at once.
  - id: sgemm_tcu_wg_mbar-groups
    app: sgemm_tcu_wg_mbar
    drivers: [simx, rtlsim]
    configs+: *wg_mbar
    args: "-m groups -s 3"
  # One stage refilled in place between wgmmas with the same descriptors, while
  # the consumers' wgmmas on a zeroed slab overlap the refill.
  - id: sgemm_tcu_wg_mbar-refill
    app: sgemm_tcu_wg_mbar
    drivers: [simx, rtlsim]
    tier: nightly
    configs+: *wg_mbar
    args: "-m refill -s 1 -e 16 -k 128"
  # Memory-sourced A with 16 accumulator registers, and the widest group
  # (issue width 4, 16 threads) over four stages.
  - id: sgemm_tcu_wg_mbar-ss16
    app: sgemm_tcu_wg_mbar
    drivers: [simx, rtlsim]
    tier: nightly
    configs+: "-DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_ISSUE_WIDTH=2 -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DITYPE=fp16 -DOTYPE=fp32 -DWGMMA_NRC=16 -DWGMMA_SS"
    args: "-m wait -s 2 -M 64 -n 64 -k 128"
  - id: sgemm_tcu_wg_mbar-iw4
    app: sgemm_tcu_wg_mbar
    drivers: [simx, rtlsim]
    tier: nightly
    configs+: "-DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_NUM_THREADS=16 -DVX_CFG_NUM_WARPS=8 -DITYPE=fp16 -DOTYPE=fp32 -DWGMMA_NRC=8"
    args: "-m wait -s 4 -M 64 -n 64 -k 128"

  # Parity of the new releases at XLEN 64, with no spin: the global double
  # buffer (the CTA fence's drain at the L1), and the wgmma mainloop (the
  # group waits and their unlock).
  - id: parity-mbar-glob
    check: model_parity
    app: mbar_local
    xlen: [64]
    configs+: "-DVX_CFG_ISSUE_WIDTH=2"
    args: "-m glob -r 16 -p"
  # The wgmma cell runs at 4 warps, one block per core. At 8 warps it differs
  # by 5.6% (simx 242227, rtlsim 256638, with wgmmas no longer holding fetch
  # in SimX), and the gap is there without the groups: -m nowait -p at 8 warps
  # 5.1% (215528 / 227135), and 4.9% (204679 / 215310) before the CTA fence
  # existed. 8-warp cores already differ without the feature (see the
  # proposal's open items).
  - id: parity-wgmma-mbar
    check: model_parity
    app: sgemm_tcu_wg_mbar
    xlen: [64]
    configs+: "-DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_ISSUE_WIDTH=2 -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=4 -DITYPE=fp16 -DOTYPE=fp32 -DWGMMA_NRC=8"
    args: "-m wait -p -s 3"
  # The same mainloop with waits that block: -m refill waits with
  # wait_group<0> right after each commit, so every release comes from the
  # wgmma's retire (the -m wait waits all find their groups complete).
  - id: parity-wgmma-wait0
    check: model_parity
    app: sgemm_tcu_wg_mbar
    xlen: [64]
    configs+: "-DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_ISSUE_WIDTH=2 -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=4 -DITYPE=fp16 -DOTYPE=fp32 -DWGMMA_NRC=8"
    args: "-m refill -p -s 3"

  # --- try_wait ---
  # One block of 4 warps x 4 threads; worker warp 0 arrives, the others wait
  # with try_wait. late: the arrive comes after the time limit, so every wait
  # times out at least once, then succeeds. sleep: the producer sleeps
  # through 100 time limits on an object nobody arrives on, so the whole core
  # sleeps for longer than the scheduler's 100000-cycle stall timeout; only
  # the time limit keeps it alive. many: every lane of every warp waits, on
  # one object, on one object per warp, and on one per lane (a warp is woken
  # by its last waiting lane's object or the time limit). mixed: the arrive
  # lands among a waiter warp's lanes, so its first poll splits the warp; it
  # runs 8 threads per warp, whose lanes reach the bank in two packets (with
  # one packet per warp the arrive almost never falls inside one). A try_wait
  # on one object returns false only after the time limit, every run must
  # suspend a warp, and a time-out while every arrive was answered 64 cycles
  # within the time limit is a lost wake-up (mixed and one-object many runs
  # must stay within it).
  - id: mbar_wait
    app: mbar_wait
    drivers: [simx, rtlsim]
    args: "-m late -r 8"
  - id: mbar_wait-sleep
    app: mbar_wait
    drivers: [simx, rtlsim]
    args: "-m sleep -r 100"
  - id: mbar_wait-many
    app: mbar_wait
    drivers: [simx, rtlsim]
    args: "-m many -r 8"
  - id: mbar_wait-many-warps
    app: mbar_wait
    drivers: [simx, rtlsim]
    args: "-m many -o 4 -r 8"
  - id: mbar_wait-many-lanes
    app: mbar_wait
    drivers: [simx, rtlsim]
    args: "-m many -o 4 -L -r 8"
  - id: mbar_wait-mixed
    app: mbar_wait
    drivers: [simx, rtlsim]
    shape: {threads: 8}
    args: "-m mixed -r 96"
  # try_wait against the test_wait spin on the same late arrives: the run that
  # sleeps must retire fewer instructions.
  - id: mbar_wait-spin
    via: script
    driver: simx
    env: {DRIVER: simx, ARGS: "-m late -r 8"}
    run: &spin_cmp_run |
      set -u
      tmp=$(mktemp -d)
      if ! make -C sw/runtime/"$DRIVER" > "$tmp/build.log" 2>&1 \
         || ! make -C tests/regression/mbar_wait >> "$tmp/build.log" 2>&1; then
        echo "FAIL: the build failed with CONFIGS=${CONFIGS:-}"; tail -n 20 "$tmp/build.log"
        rm -rf "$tmp"; exit 1
      fi
      fail=0
      for v in try spin; do
        a="$ARGS"; [ $v = spin ] && a="$a -s"
        if ! timeout 300 ./ci/blackbox.sh --driver="$DRIVER" --app=mbar_wait --args="$a" > "$tmp/$v.log" 2>&1; then
          echo "FAIL: '$a' failed on $DRIVER"; tail -n 20 "$tmp/$v.log"; fail=1
        fi
        grep -F 'waiter threads' "$tmp/$v.log"
      done
      if [ $fail -eq 0 ]; then
        ti=$(sed -n 's/^PERF: instrs=\([0-9]*\),.*/\1/p' "$tmp/try.log" | tail -n 1)
        si=$(sed -n 's/^PERF: instrs=\([0-9]*\),.*/\1/p' "$tmp/spin.log" | tail -n 1)
        if [ -z "$ti" ] || [ -z "$si" ]; then
          echo "FAIL: no PERF summary"; fail=1
        elif [ "$ti" -ge "$si" ]; then
          echo "FAIL: try_wait retired $ti instructions, the test_wait spin $si"; fail=1
        else
          echo "OK: try_wait retired $ti instructions, the test_wait spin $si"
        fi
      fi
      rm -rf "$tmp"
      exit $fail
  - id: mbar_wait-spin
    via: script
    driver: rtlsim
    env: {DRIVER: rtlsim, ARGS: "-m late -r 8"}
    run: *spin_cmp_run

  # Wider shapes and bank pressure: 8 warps of 8 threads; SIMD 2 with issue
  # width 2, where a warp's lanes reach the banks as two packets and only the
  # last response ends the wait (its lanes wait on different objects, so the
  # packets insert different ones); two warps streaming DXA copies, so DMA
  # beats win the banks while the waiters poll and the arrives land. The
  # mixed runs share the issue slots with up to seven waiter warps' nops and
  # the DMA beats, so an arrive is answered up to ~1800 cycles after the
  # meeting: they run a 4096-cycle time limit to keep it well within (the
  # lost-wake-up check needs that), and 8 warps of 8 threads arrive 16 idle
  # iterations late so that SimX's waiters still poll before the arrive.
  - id: mbar_wait-many-w8t8
    app: mbar_wait
    drivers: [simx, rtlsim]
    tier: nightly
    shape: {warps: 8, threads: 8}
    args: "-m many -o 8 -L -r 8"
  - id: mbar_wait-mixed-w8t8
    app: mbar_wait
    drivers: [simx, rtlsim]
    tier: nightly
    configs+: "-DVX_CFG_MBAR_SUSPEND_CYCLES=4096"
    shape: {warps: 8, threads: 8}
    args: "-m mixed -r 96 -d 16"
  - id: mbar_wait-many-lanes-simd2
    app: mbar_wait
    drivers: [simx, rtlsim]
    tier: nightly
    configs+: "-DVX_CFG_SIMD_WIDTH=2 -DVX_CFG_ISSUE_WIDTH=2"
    shape: {warps: 8}
    args: "-m many -o 4 -L -r 8"
  - id: mbar_wait-dxa
    app: mbar_wait
    drivers: [simx, rtlsim]
    tier: nightly
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    shape: {warps: 8}
    args: "-m late -r 16 -D 2"
  - id: mbar_wait-mixed-dxa
    app: mbar_wait
    drivers: [simx, rtlsim]
    tier: nightly
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_MBAR_SUSPEND_CYCLES=4096"
    shape: {warps: 8}
    args: "-m mixed -r 96 -D 2"

  # Parity of try_wait at XLEN 64 with a fixed schedule: every wait is one
  # try_wait that sleeps until the arrive wakes it and returns true, and each
  # worker warp ends with one time-out; the table's decision, unlock and
  # re-schedule cycles set the timing.
  - id: parity-mbar-wait
    check: model_parity
    app: mbar_wait
    xlen: [64]
    args: "-m late -r 16 -p"

  # --- remote ops ---
  # SPREAD clusters of 2 blocks of 2 warps on 2 cores, so every op on a peer's
  # object crosses the network to its bank as a remote atomic. all: every
  # thread arrives on every rank's object for 16 phases, and rank p % 2 comes
  # late in phase p, so its remote arrive completes the peer's phase while the
  # peer's warps sleep and must wake them. data: window stores into the next
  # rank's buffer, then a remote arrive, which releases them. global: global
  # buffers released and acquired with the _cluster forms, the consumer's L1
  # refilled with its buffer's old lines before each wait. tx: remote
  # complete_tx, expect_tx and arrive_tx, with tx negative in between. self:
  # DEFAULT clusters, so every peer sits on the caller's core and its object
  # takes the local path through the window. relaxed: all with relaxed
  # arrives (each rank's last of a phase stays a release), then a relaxed
  # and a release arrive timed behind four window stores: the relaxed one
  # must be cheaper every time. The host checks which op completed each
  # phase and that every late completion woke its waiters.
  - id: mbar_remote
    app: mbar_remote
    drivers: [simx, rtlsim]
    shape: {cores: 2, l2cache: true}
    args: "-m all"
  - id: mbar_remote-data
    app: mbar_remote
    drivers: [simx, rtlsim]
    shape: {cores: 2, l2cache: true}
    args: "-m data"
  - id: mbar_remote-global
    app: mbar_remote
    drivers: [simx, rtlsim]
    shape: {cores: 2, l2cache: true}
    args: "-m global"
  - id: mbar_remote-tx
    app: mbar_remote
    drivers: [simx, rtlsim]
    shape: {cores: 2, l2cache: true}
    args: "-m tx"
  - id: mbar_remote-self
    app: mbar_remote
    drivers: [simx, rtlsim]
    shape: {cores: 2, l2cache: true}
    args: "-m self"
  - id: mbar_remote-relaxed
    app: mbar_remote
    drivers: [simx, rtlsim]
    shape: {cores: 2, l2cache: true}
    args: "-m all -R"

  # Four cores of 8 warps in two sockets, clusters of 4 blocks of 2 warps: the
  # ops of a phase cross both levels of the network and contend at each bank.
  # A late rank arrives on four objects, one after another, from a core whose
  # eight warps share the issue slots, so its last arrive lands up to ~2000
  # cycles after the waiters slept: the cells run a 4096-cycle time limit to
  # keep each wait within one suspension (the wake-up check needs that).
  - id: mbar_remote-4c
    app: mbar_remote
    drivers: [simx, rtlsim]
    tier: nightly
    configs+: "-DVX_CFG_SOCKET_SIZE=2 -DVX_CFG_MBAR_SUSPEND_CYCLES=4096"
    shape: {cores: 4, warps: 8, l2cache: true}
    args: "-m all -k 4 -n 4 -w 2"
  - id: mbar_remote-data-4c
    app: mbar_remote
    drivers: [simx, rtlsim]
    tier: nightly
    configs+: "-DVX_CFG_SOCKET_SIZE=2 -DVX_CFG_MBAR_SUSPEND_CYCLES=4096"
    shape: {cores: 4, warps: 8, l2cache: true}
    args: "-m data -k 4 -n 4 -w 2 -r 32"
  - id: mbar_remote-global-4c
    app: mbar_remote
    drivers: [simx, rtlsim]
    tier: nightly
    configs+: "-DVX_CFG_SOCKET_SIZE=2 -DVX_CFG_MBAR_SUSPEND_CYCLES=4096"
    shape: {cores: 4, warps: 8, l2cache: true}
    args: "-m global -k 4 -n 4 -w 2"
  - id: mbar_remote-tx-4c
    app: mbar_remote
    drivers: [simx, rtlsim]
    tier: nightly
    configs+: "-DVX_CFG_SOCKET_SIZE=2 -DVX_CFG_MBAR_SUSPEND_CYCLES=4096"
    shape: {cores: 4, warps: 8, l2cache: true}
    args: "-m tx -k 4 -n 4 -w 2 -r 32"
  - id: mbar_remote-relaxed-4c
    app: mbar_remote
    drivers: [simx, rtlsim]
    tier: nightly
    configs+: "-DVX_CFG_SOCKET_SIZE=2 -DVX_CFG_MBAR_SUSPEND_CYCLES=4096"
    shape: {cores: 4, warps: 8, l2cache: true}
    args: "-m all -k 4 -n 4 -w 2 -R"

  # Parity of remote ops at XLEN 64 with a fixed schedule: per phase the
  # blocks meet at the cluster barrier, then one rank fills the other's
  # buffer with window stores and arrives remotely, which wakes the other's
  # sleeping warps; the release hold, the network, the bank and the wake-up
  # set the timing.
  # The first phase's fill, from cold caches, comes close to the default
  # 1024-cycle time limit, which a wait must not reach.
  - id: parity-mbar-remote
    check: model_parity
    app: mbar_remote
    xlen: [64]
    configs+: "-DVX_CFG_MBAR_SUSPEND_CYCLES=2048"
    shape: {cores: 2, l2cache: true}
    args: "-m data -p -r 16 -e 16"
  # The same schedule with a relaxed arrive right behind each producer
  # thread's stores, then its release arrive: the relaxed one is not held,
  # the release one waits for it and the stores.
  - id: parity-mbar-remote-relaxed
    check: model_parity
    app: mbar_remote
    xlen: [64]
    configs+: "-DVX_CFG_MBAR_SUSPEND_CYCLES=2048"
    shape: {cores: 2, l2cache: true}
    args: "-m data -p -R -r 16 -e 16"

  # --- st.async / red.async (dlmem_st_async) ---
  # Each round every block arms one mbarrier per op it receives with
  # arrive_tx of the incoming bytes before the cluster barrier; every thread
  # then stores st.async elements into the next rank's block and reduces
  # red.async operands into a counter of another rank (rank 0 into rank 1,
  # the others into rank 0), all with no fence, each op completing its bytes
  # on the destination block's mbarrier, a 16-byte store as two 8-byte
  # halves. Every thread waits for its own block's phases and checks at once
  # that each stored word holds the round's value and each counter the exact
  # result; the host checks every block's whole local memory (some 32-bit
  # counters sit in the high half of their word, the other half a canary)
  # and each mbarrier word against mbar_ref. A warp's lanes write consecutive
  # elements in one instruction. -o picks the ops (default 0xf: st.b32,
  # st.b64, add.u32, add.u64).
  - id: dlmem_st_async
    app: dlmem_st_async
    drivers: [simx, rtlsim]
    touches: &st_async_touches [tests/regression/dlmem_st_async, hw/rtl/dlmem, hw/rtl/core/VX_decode.sv,
              hw/rtl/core/VX_lsu_slice.sv, hw/rtl/core/VX_lsu_unit.sv, hw/rtl/core/VX_mem_unit.sv,
              hw/rtl/core/VX_lsu_scheduler.sv, hw/rtl/core/VX_uop_sequencer.sv,
              hw/rtl/core/VX_execute.sv, hw/rtl/core/VX_issue.sv, hw/rtl/core/VX_operands.sv,
              hw/rtl/core/VX_core.sv, hw/rtl/VX_gpu_pkg.sv, hw/rtl/VX_define.vh, hw/rtl/interfaces,
              hw/rtl/mem/VX_local_mem.sv, hw/rtl/mem/VX_lmem_switch.sv, hw/rtl/cache/VX_amo_alu.sv,
              hw/rtl/cache/VX_amo_unit.sv, hw/rtl/VX_socket.sv, hw/rtl/VX_cluster.sv,
              sim/simx/dlmem, sim/simx/decode.cpp, sim/simx/instr.h, sim/simx/operands,
              sim/simx/lsu_unit, sim/simx/core, sim/simx/types.h, sim/simx/mem/local_mem,
              sim/simx/amo, sim/simx/socket, sim/simx/cluster, sim/simx/mbar_waiters,
              sim/simx/sequencer, sw/kernel/include/vx_mbar.h, sw/kernel/include/vx_dlmem.h,
              sw/common/mbar_ref.h, sw/common/dlmem_ref.h, sw/common/amo_ref.h, VX_config.toml,
              hw/rtl/core/VX_cpa_unit.sv, sim/simx/cpa_unit, hw/rtl/core/VX_wctl_unit.sv,
              sim/simx/sfu_unit]
    shape: {cores: 2, l2cache: true}
    args: "-k 2 -n 2"
  # The vector stores (v2.b32, v4.b32 as one 16-byte instruction from an
  # even/odd register pair, v2.b64) with the scalar ones.
  - id: dlmem_st_async-vec
    app: dlmem_st_async
    drivers: [simx, rtlsim]
    touches: *st_async_touches
    shape: {cores: 2, l2cache: true}
    args: "-k 2 -n 2 -o 0x73"
  # Every reduction but inc/dec: add u32/u64/s32, min/max s32/u32 (operands
  # of both signs), and/or/xor.
  - id: dlmem_st_async-red
    app: dlmem_st_async
    drivers: [simx, rtlsim]
    touches: *st_async_touches
    shape: {cores: 2, l2cache: true}
    args: "-k 2 -n 2 -o 0x7f8c"
  # inc/dec, which need the PTX atomics, with every other reduction.
  - id: dlmem_st_async-red-fpamo
    app: dlmem_st_async
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_ZACAS_ENABLE -DVX_CFG_EXT_FPAMO_ENABLE"
    touches: *st_async_touches
    shape: {cores: 2, l2cache: true}
    args: "-k 2 -n 2 -o 0x1ff8c"
  - id: dlmem_st_async-samecore
    app: dlmem_st_async
    drivers: [simx, rtlsim]
    touches: *st_async_touches
    shape: {cores: 2, l2cache: true}
    args: "-p single-core -k 2 -n 2"
  # Every op but inc/dec between two blocks of one core (different slots).
  - id: dlmem_st_async-samecore-all
    app: dlmem_st_async
    drivers: [simx, rtlsim]
    touches: *st_async_touches
    shape: {cores: 2, l2cache: true}
    args: "-p single-core -k 2 -n 2 -o 0x7fff"
  # Four cores in two sockets: the ring and the reductions cross the cluster crossbar.
  - id: dlmem_st_async-4c-s2
    app: dlmem_st_async
    drivers: [simx, rtlsim]
    tier: nightly
    configs+: "-DVX_CFG_SOCKET_SIZE=2 -DVX_CFG_MBAR_SUSPEND_CYCLES=4096"
    touches: *st_async_touches
    shape: {cores: 4, warps: 8, l2cache: true}
    args: "-k 4 -n 4 -w 2 -r 4"
  # The same with every op, inc/dec included.
  - id: dlmem_st_async-4c-s2-all
    app: dlmem_st_async
    drivers: [simx, rtlsim]
    tier: nightly
    configs+: "-DVX_CFG_SOCKET_SIZE=2 -DVX_CFG_MBAR_SUSPEND_CYCLES=4096 -DVX_CFG_EXT_ZACAS_ENABLE -DVX_CFG_EXT_FPAMO_ENABLE"
    touches: *st_async_touches
    shape: {cores: 4, warps: 8, l2cache: true}
    args: "-k 4 -n 4 -w 2 -r 4 -o 0x1ffff"
  # 64 ops per round from each block, eight times the store credits.
  - id: dlmem_st_async-4c-flood
    app: dlmem_st_async
    drivers: [simx, rtlsim]
    tier: nightly
    configs+: "-DVX_CFG_SOCKET_SIZE=2 -DVX_CFG_MBAR_SUSPEND_CYCLES=4096"
    touches: *st_async_touches
    shape: {cores: 4, warps: 8, l2cache: true}
    args: "-k 4 -n 1 -w 8 -e 8 -o 5 -r 3"
  # Parity at XLEN 64: one SPREAD cluster of four blocks on four single-core
  # sockets, D5's four ops, two rounds (SimX -3.97%: a fixed ~1.1-1.4k-cycle
  # SimX-faster memory/fetch gap independent of the op, already on D5's path
  # and weighted more by the shorter kernel; st.b32 alone is -7.1% at this
  # shape). With two cores per socket SimX measures -6.95%, and apps without
  # async ops swing by the same ~6.5 points: the known SimX-fast gap of
  # SOCKET_SIZE 2. Every wait is one try_wait, which the last complete_tx
  # wakes: the egress credits, the network, the ingress's store or add then
  # complete_tx and the wake-up set the timing.
  - id: parity-dlmem-st-async
    check: model_parity
    app: dlmem_st_async
    xlen: [64]
    configs+: "-DVX_CFG_MBAR_SUSPEND_CYCLES=4096"
    touches: *st_async_touches
    shape: {cores: 4, warps: 8, l2cache: true}
    args: "-k 4 -n 1 -w 2 -e 2 -r 2"
  # The same shape with a 16-byte st.async (two uops, two 8-byte packets) and
  # the min.s32, max.s32 and xor reductions.
  - id: parity-dlmem-st-async-e3
    check: model_parity
    app: dlmem_st_async
    xlen: [64]
    configs+: "-DVX_CFG_MBAR_SUSPEND_CYCLES=4096"
    touches: *st_async_touches
    shape: {cores: 4, warps: 8, l2cache: true}
    args: "-k 4 -n 1 -w 2 -e 2 -r 2 -o 0x4320"

  # --- DXA copies completing on an mbarrier ---
  # dxa_mbar: one block fills the core. Per round warp 0 arrives on the
  # mbarrier declaring the box bytes and issues a 1-D copy into local memory;
  # warps 0 and 1 wait with try_wait, which the copy's complete_tx must wake
  # (at least once for warp 1); then the tile's last word must already hold
  # the copied value (spins=0) while the other warps load, store and add
  # atomically on that word's bank, and the whole tile must match. -l: the
  # same probe with the copy completing on a barrier event. 16 banks make a
  # 128-byte row, which a DMA beat writes as two blocks. The final object word
  # is checked against mbar_ref.
  - id: dxa_mbar
    app: dxa_mbar
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: &dxa_mbar_touches [hw/rtl/dxa, sim/simx/dxa, hw/rtl/core/VX_mem_unit.sv,
              hw/rtl/mem/VX_local_mem.sv, hw/rtl/core/VX_cta_dispatch.sv, hw/rtl/core/VX_core.sv,
              hw/rtl/core/VX_execute.sv, hw/rtl/core/VX_sfu_unit.sv, hw/rtl/core/VX_wctl_unit.sv,
              hw/rtl/core/VX_bar_unit.sv, hw/rtl/VX_socket.sv, hw/rtl/VX_gpu_pkg.sv,
              hw/rtl/VX_define.vh, hw/rtl/cache/VX_amo_alu.sv, hw/rtl/cache/VX_amo_unit.sv,
              hw/rtl/dlmem/VX_mbar_waiters.sv, hw/rtl/dlmem/VX_dlmem_row_egress.sv,
              hw/rtl/interfaces, sim/simx/mem/local_mem,
              sim/simx/core, sim/simx/socket, sim/simx/cta_dispatcher, sim/simx/types.h,
              sim/simx/mbar_waiters, sim/simx/amo, sim/simx/scheduler, sim/simx/barrier_unit,
              sim/simx/sfu_unit, sim/simx/Makefile, hw/rtl/core/VX_scheduler.sv,
              sw/common/mbar_ref.h, sw/kernel/include/vx_dxa.h, sw/common/dxa_tmap.h, sw/kernel/include/vx_mbar.h,
              tests/regression/dxa_mbar, tests/regression/dxa_copy,
              tests/regression/dxa_kmajor_check, VX_config.toml, hw/rtl/core/VX_cpa_unit.sv,
              sim/simx/cpa_unit, sw/common/dxa_ref.h, sw/common/dxa_meta.h,
              hw/rtl/core/VX_decode.sv, sim/simx/decode.cpp,
              hw/rtl/cache/VX_cache_amo.sv, hw/rtl/core/VX_bg_unit.sv, hw/rtl/core/VX_lsu_slice.sv,
              hw/rtl/dlmem/VX_dlmem_ingress.sv, sim/simx/bg_unit, sim/simx/dlmem/dlmem_ingress.cpp,
              sim/simx/dlmem/dlmem_ingress.h, sim/simx/lsu_unit, sim/simx/mem/cache.cpp]
    args: "-r 8"
  - id: dxa_mbar-legacy
    app: dxa_mbar
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_mbar_touches
    args: "-l -r 8"
  - id: dxa_mbar-rows
    app: dxa_mbar
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_LMEM_NUM_BANKS=16"
    touches: *dxa_mbar_touches
    args: "-r 8"
  - id: dxa_mbar-rows-legacy
    app: dxa_mbar
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_LMEM_NUM_BANKS=16"
    touches: *dxa_mbar_touches
    args: "-l -r 8"
  # The completion queue full: both waiter warps issue 12 copies of 1 KB back
  # to back on four DXA workers fed from the L2, all completing on the one
  # mbarrier, while the other warps hammer its bank. The copies' beats win the
  # bank ahead of the complete_tx requests, so more than the queue's 4 entries
  # land before one leaves, and the core's DXA input holds the next copy's
  # last beat (with the beats behind it) until an entry leaves.
  - id: dxa_mbar-queue
    app: dxa_mbar
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_NUM_DXA_CORES=4"
    shape: {l2cache: true}
    touches: *dxa_mbar_touches
    args: "-q -e 256 -r 2"
  # dxa_copy -m: ranks 1-5, each block's copy completing on an mbarrier in its
  # own local memory, read back and compared byte for byte; -o ends the
  # descriptor half a tile early along an outer dimension (the fill counts in
  # the box bytes and is checked byte for byte), -c puts canary words after
  # the tile. dxa_kmajor_check -m: a row-major and a K-major copy completing
  # on one mbarrier that expects both boxes.
  - id: dxa_copy-mbar-d1
    app: dxa_copy
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_mbar_touches
    args: "-m -d1"
  - id: dxa_copy-mbar-d2
    app: dxa_copy
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_mbar_touches
    args: "-m -d2"
  - id: dxa_copy-mbar-d3
    app: dxa_copy
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_mbar_touches
    args: "-m -d3"
  - id: dxa_copy-mbar-d4
    app: dxa_copy
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_mbar_touches
    args: "-m -d4"
  - id: dxa_copy-mbar-d5
    app: dxa_copy
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_mbar_touches
    args: "-m -d5"
  - id: dxa_copy-mbar-oob-canary-d2
    app: dxa_copy
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_mbar_touches
    args: "-m -o -c -d2"
  - id: dxa_copy-mbar-oob-canary-d5
    app: dxa_copy
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_mbar_touches
    args: "-m -o -c -d5"
  # One elected thread issues while the DXA operands cross two packets.
  - id: dxa_copy-mbar-elect-simd2
    app: dxa_copy
    drivers: [simx, rtlsim]
    tier: nightly
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_SIMD_WIDTH=2"
    touches: *dxa_mbar_touches
    args: "-m -e -c -d3"
  - id: dxa_kmajor_check-mbar
    app: dxa_kmajor_check
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_mbar_touches
    args: "-m"

  # Parity of the mbarrier completion at XLEN 64: dxa_copy -m at rank 1, and
  # dxa_mbar with a fixed amount of contention, where every wait is one
  # try_wait (a 4096-cycle time limit keeps the first, cold copy well within
  # it). That try_wait finds the phase complete or sleeps until the
  # completion wakes it, which one depends on timing, and both run the same
  # instructions. The bank commit of the copy's last beat, the complete_tx
  # behind it and the wake-up set the timing.
  - id: parity-dxa-copy-mbar
    check: model_parity
    app: dxa_copy
    xlen: [64]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_mbar_touches
    args: "-m -d1"
  - id: parity-dxa-mbar
    check: model_parity
    app: dxa_mbar
    xlen: [64]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_MBAR_SUSPEND_CYCLES=4096"
    touches: *dxa_mbar_touches
    args: "-p -r 8"
  # dxa_mbar-queue with a fixed amount of contention: the held last beats
  # and the complete_tx requests that free their entries set the timing.
  - id: parity-dxa-mbar-queue
    check: model_parity
    app: dxa_mbar
    xlen: [64]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_NUM_DXA_CORES=4"
    shape: {l2cache: true}
    touches: *dxa_mbar_touches
    args: "-q -p -e 256 -r 2"

  # Each must stop the simulation with the exact message: an arrive past
  # pending, tx past its 21-bit range, an mbarrier op on a global address, and
  # a wait on another block's object through the window (a SPREAD cluster of 2
  # on 2 cores): a test_wait in mbar_local, a try_wait in mbar_remote. The
  # shape goes in CONFIGS, so the run reuses the prebuilt driver.
  - id: mbar_local-underflow
    via: script
    driver: simx
    env: {DRIVER: simx, APP: mbar_local, ARGS: "-x underflow", EXPECT: "mbarrier pending underflow"}
    run: &expect_fail_run |
      set -u
      tmp=$(mktemp -d)
      if ! make -C sw/runtime/"$DRIVER" > "$tmp/build.log" 2>&1 \
         || ! make -C tests/regression/"$APP" >> "$tmp/build.log" 2>&1; then
        echo "FAIL: the build failed with CONFIGS=${CONFIGS:-}"; tail -n 20 "$tmp/build.log"
        rm -rf "$tmp"; exit 1
      fi
      timeout 120 ./ci/blackbox.sh --driver="$DRIVER" --app="$APP" --args="$ARGS" > "$tmp/run.log" 2>&1
      rc=$?
      fail=0
      if [ $rc -eq 0 ]; then
        echo "FAIL: '$ARGS' ran to completion on $DRIVER"; fail=1
      elif [ $rc -eq 124 ]; then
        echo "FAIL: '$ARGS' timed out on $DRIVER"; fail=1
      elif ! grep -qF "$EXPECT" "$tmp/run.log"; then
        echo "FAIL: '$ARGS' failed on $DRIVER (exit $rc) without '$EXPECT'"; fail=1
      else
        echo "OK: '$ARGS' stops $DRIVER (exit $rc): $(grep -F -m1 "$EXPECT" "$tmp/run.log")"
      fi
      [ $fail -eq 0 ] || tail -n 20 "$tmp/run.log"
      rm -rf "$tmp"
      exit $fail
  - id: mbar_local-underflow
    via: script
    driver: rtlsim
    env: {DRIVER: rtlsim, APP: mbar_local, ARGS: "-x underflow", EXPECT: "mbarrier pending underflow"}
    run: *expect_fail_run
  - id: mbar_local-txrange
    via: script
    driver: simx
    env: {DRIVER: simx, APP: mbar_local, ARGS: "-x txrange", EXPECT: "mbarrier tx out of range"}
    run: *expect_fail_run
  - id: mbar_local-txrange
    via: script
    driver: rtlsim
    env: {DRIVER: rtlsim, APP: mbar_local, ARGS: "-x txrange", EXPECT: "mbarrier tx out of range"}
    run: *expect_fail_run
  - id: mbar_local-global
    via: script
    driver: simx
    env: {DRIVER: simx, APP: mbar_local, ARGS: "-x global", EXPECT: "mbarrier op on a global address"}
    run: *expect_fail_run
  - id: mbar_local-global
    via: script
    driver: rtlsim
    env: {DRIVER: rtlsim, APP: mbar_local, ARGS: "-x global", EXPECT: "mbarrier op on a global address"}
    run: *expect_fail_run
  - id: mbar_local-remote
    via: script
    driver: simx
    configs+: "-DVX_CFG_NUM_CORES=2 -DVX_CFG_L2_ENABLE"
    env: {DRIVER: simx, APP: mbar_local, ARGS: "-x remote", EXPECT: "remote mbarrier wait is not supported"}
    run: *expect_fail_run
  - id: mbar_local-remote
    via: script
    driver: rtlsim
    configs+: "-DVX_CFG_NUM_CORES=2 -DVX_CFG_L2_ENABLE"
    env: {DRIVER: rtlsim, APP: mbar_local, ARGS: "-x remote", EXPECT: "remote mbarrier wait is not supported"}
    run: *expect_fail_run
  - id: mbar_remote-wait
    via: script
    driver: simx
    configs+: "-DVX_CFG_NUM_CORES=2 -DVX_CFG_L2_ENABLE"
    env: {DRIVER: simx, APP: mbar_remote, ARGS: "-x wait", EXPECT: "remote mbarrier wait is not supported"}
    run: *expect_fail_run
  - id: mbar_remote-wait
    via: script
    driver: rtlsim
    configs+: "-DVX_CFG_NUM_CORES=2 -DVX_CFG_L2_ENABLE"
    env: {DRIVER: rtlsim, APP: mbar_remote, ARGS: "-x wait", EXPECT: "remote mbarrier wait is not supported"}
    run: *expect_fail_run

  # DXA copies completing on an mbarrier that must stop the run: an arrive
  # declaring 16 bytes more than the box, so the phase never completes and
  # the app's bounded wait gives up; a block that exits before its copy lands,
  # while the next block holds its slot; an mbarrier past the block's local
  # memory; and an mbarrier-mode copy whose multicast mask names rank 1 of a
  # block launched without a cluster.
  - id: dxa_mbar-expect
    via: script
    driver: simx
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_mbar_touches
    env: {DRIVER: simx, APP: dxa_mbar, ARGS: "-x expect", EXPECT: "mbarrier phase did not complete"}
    run: *expect_fail_run
  - id: dxa_mbar-expect
