  # Part 2a of the H100 workload set, the kernels without tensor cores, each a re-implementation
  # of the kernel the H100 ran, at the ports' shape: one cluster of C cores (one block per core,
  # blocks of 32-thread warps), an L2, DLMEM, A, Zacas, mbarriers, DXA, FPAMO and 256 KB of local
  # memory. Every run checks every element of every launch against a host reference with the
  # H100 harness's tolerance, plus a tight gate a broken cluster reduction fails where the outputs
  # are far below that tolerance, a guard tail after each output and the smid buffer, and the
  # blocks' distinct cores; each launch draws a new input.
  # credit_reduction: the six CREDIT cluster kernels (cluster_*_staged_kernel<256, 8>), one row
  # per cluster of P blocks of 256 threads, -c cols -n rows -p P. Smoke: the H100 shape n4k (4096
  # columns) at the profiled P = 8, 3 rows.
  - id: credit_reduction-layernorm
    app: credit_reduction
    drivers: [simx]
    configs+: &e9b_a_cfg "-DVX_CFG_EXT_ZACAS_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_EXT_FPAMO_ENABLE -DVX_CFG_LMEM_LOG_SIZE=18"
    shape: &credit_p8 {cores: 8, warps: 8, threads: 32, l2cache: true}
    touches: &credit_touches [tests/regression/credit_reduction, tests/regression/dsmem_collectives,
              sw/kernel/include/vx_cuda.h, sw/kernel/include/vx_dlmem.h, sw/kernel/include/vx_mbar.h,
              sw/kernel/include/vx_dxa.h, sw/runtime/include/vx_cuda_runtime.h, sw/common/vx_cuda_fp.h,
              hw/rtl/mem/VX_local_mem.sv, hw/rtl/core/VX_decode.sv, hw/rtl/VX_gpu_pkg.sv,
              hw/rtl/VX_define.vh, hw/rtl/dlmem, hw/rtl/core/VX_lsu_slice.sv,
              hw/rtl/core/VX_mem_unit.sv, hw/rtl/core/VX_core.sv, sim/simx/types.h,
              sim/simx/decode.cpp, sim/simx/amo, sim/simx/lsu_unit, sim/simx/dlmem, sim/simx/core,
              sim/simx/processor.cpp, sw/common/mbar_ref.h, tests/regression/mbar_local,
