              sw/runtime/common, sw/common/dxa_tmap.h, sw/common/dxa_meta.h, sw/common/dlmem_ref.h,
              hw/rtl/dxa, sim/simx/dxa, hw/rtl/core/VX_alu_int.sv, sim/simx/alu_unit.cpp,
              hw/rtl/core/VX_mem_unit.sv, hw/rtl/mem/VX_local_mem.sv, hw/rtl/core/VX_cta_dispatch.sv,
              hw/rtl/core/VX_core.sv, hw/rtl/core/VX_execute.sv, hw/rtl/core/VX_sfu_unit.sv,
              hw/rtl/core/VX_wctl_unit.sv, hw/rtl/core/VX_bar_unit.sv, hw/rtl/VX_socket.sv,
              hw/rtl/VX_gpu_pkg.sv, hw/rtl/VX_define.vh, hw/rtl/cache, hw/rtl/dlmem,
              hw/rtl/mem/VX_lmem_switch.sv, hw/rtl/VX_kmu.sv, hw/rtl/VX_cluster.sv, hw/rtl/interfaces,
              hw/rtl/core/VX_scheduler.sv, hw/rtl/core/VX_decode.sv, hw/rtl/core/VX_lsu_slice.sv,
              hw/rtl/core/VX_lsu_unit.sv, hw/rtl/core/VX_bg_unit.sv, hw/rtl/core/VX_cpa_unit.sv,
              hw/rtl/core/VX_csr_unit.sv, hw/rtl/core/VX_csr_data.sv, hw/rtl/mem/VX_gbar_unit.sv,
              sim/simx/mem, sim/simx/core, sim/simx/socket, sim/simx/cta_dispatcher, sim/simx/types.h,
              sim/simx/instr.h, sim/simx/decode.cpp, sim/simx/mbar_waiters, sim/simx/amo,
              sim/simx/scheduler, sim/simx/barrier_unit, sim/simx/sfu_unit, sim/simx/lsu_unit,
              sim/simx/bg_unit, sim/simx/cpa_unit, sim/simx/csr_unit.cpp, sim/simx/Makefile,
              sim/simx/dlmem, sim/simx/kmu, sim/simx/cluster, VX_config.toml, VX_types.toml]
