# mbarriers: 64-bit synchronization objects in a block's local memory, which
# the local memory banks update in their atomic unit (custom-2 arrive,
# arrive_tx, expect_tx, complete_tx, test_wait). RV64, on a DLMEM device with
# the A extension. The apps check every final object word against the golden
# model sw/common/mbar_ref.h. See docs/proposals/dlmem_proposal.md.
category: mbar
defaults:
  xlen: [64]
  configs: "-DVX_CFG_EXT_DLMEM_ENABLE -DVX_CFG_EXT_A_ENABLE -DVX_CFG_EXT_MBAR_ENABLE"
  tier: smoke
  touches: [hw/rtl/cache/VX_amo_alu.sv, hw/rtl/cache/VX_amo_unit.sv, hw/rtl/mem/VX_local_mem.sv,
            hw/rtl/core/VX_decode.sv, hw/rtl/VX_gpu_pkg.sv, hw/rtl/VX_define.vh, hw/rtl/dlmem,
            hw/rtl/core/VX_lsu_slice.sv, hw/rtl/core/VX_mem_unit.sv, hw/rtl/core/VX_core.sv,
            sim/simx/types.h, sim/simx/decode.cpp, sim/simx/amo, sim/simx/mem/local_mem,
            sim/simx/lsu_unit, sim/simx/dlmem, sim/simx/core, sim/simx/processor.cpp,
            sw/common/mbar_ref.h, sw/kernel/include/vx_mbar.h, tests/regression/mbar_local,
            VX_config.toml, hw/rtl/cache/VX_cache_amo.sv, hw/rtl/core/VX_wctl_unit.sv,
            hw/rtl/interfaces/VX_warp_ctl_if.sv, sim/simx/sfu_unit.cpp,
            sw/kernel/include/vx_dlmem.h, sw/kernel/include/vx_dxa.h,
            hw/rtl/mem/VX_lmem_switch.sv, hw/rtl/core/VX_lsu_unit.sv,
            hw/rtl/core/VX_scheduler.sv, sw/common/dlmem_ref.h, hw/rtl/dxa, hw/rtl/VX_kmu.sv,
            hw/rtl/Vortex.sv, hw/rtl/VX_cluster.sv, hw/rtl/interfaces/VX_kmu_bus_if.sv,
            hw/rtl/core/VX_cta_dispatch.sv, hw/rtl/core/VX_csr_data.sv,
            hw/rtl/core/VX_kmu_bus_arb.sv, hw/rtl/core/VX_bar_unit.sv,
            hw/rtl/mem/VX_gbar_unit.sv, hw/rtl/core/VX_execute.sv,
            hw/rtl/interfaces/VX_sched_unlock_if.sv, hw/rtl/cp/VX_cp_axil_regfile.sv,
            hw/rtl/VX_socket.sv, sim/simx/kmu, sim/simx/cta_dispatcher, sim/simx/scheduler,
            sim/simx/csr_unit.cpp, sim/simx/cluster, sim/simx/barrier_unit,
            sim/common/cmd_processor.cpp, sim/simx/wctl_unit.cpp, sim/simx/socket,
            sw/kernel/include/vx_spawn2.h, sw/runtime/common/caps.h,
            sw/runtime/common/queue.cpp, sw/runtime/common/legacy_runtime.cpp,
            tests/regression/cluster_rank, tests/regression/cta_gang,
            tests/regression/cluster_sync, tests/regression/dlmem_local,
            tests/regression/dlmem_store, tests/regression/dlmem_load,
            tests/regression/dlmem_atomic, tests/regression/dlmem_stress,
            tests/regression/lmem_bar_order, tests/regression/dlmem_amo_order, VX_types.toml,
            hw/rtl/core/VX_uop_sequencer.sv, hw/rtl/dlmem/VX_uop_release.sv, sim/simx/sequencer,
            sim/simx/instr.h, hw/rtl/cache, sim/simx/mem/cache, hw/rtl/VX_socket.sv,
            hw/rtl/tcu, sim/simx/tcu, sw/kernel/include/vx_tensor.h,
            tests/regression/sgemm_tcu_wg_mbar, tests/regression/sgemm_tcu_mx_mbar]
tests:
  # One block of 4 warps x 4 threads. basic: every thread arrives with 1 and
  # waits on its token for 32 phases; the stores before each arrive must be
  # visible after the wait. count: lane 0 of each warp arrives for its warp,
  # odd warps in two arrives. pc: two producer and two consumer warps over a
  # double buffer with FULL and EMPTY barriers; an EMPTY arrive must wait for
  # the warp's loads. tx: a scripted sequence of every op (each returned word
  # against mbar_ref, a complete before its expect, a flip by expect_tx, tx at
  # both ends of its range), then expect/complete/arrive_tx by every warp per
  # phase with the completes first on odd phases.
  - id: mbar_local
    app: mbar_local
    drivers: [simx, rtlsim]
    args: "-m basic -r 32"
  - id: mbar_local-count
    app: mbar_local
    drivers: [simx, rtlsim]
    args: "-m count -r 32"
  - id: mbar_local-pc
    app: mbar_local
    drivers: [simx, rtlsim]
    args: "-m pc -r 32"
  - id: mbar_local-tx
    app: mbar_local
    drivers: [simx, rtlsim]
    args: "-m tx -r 16"
  # The xrt leg wraps the same RTL in the AFU shell and host stack.
  - id: mbar_local-pc-xrt
    app: mbar_local
    drivers: [xrt]
    args: "-m pc -r 16"

  # Wider shapes: 8 warps of 8 threads (64 arrivals per phase on one word, four
  # producer and four consumer warps), and SIMD 2 with issue width 2, where a
  # warp's lanes reach the banks as two packets.
  - id: mbar_local-w8t8
    app: mbar_local
    drivers: [simx, rtlsim]
    tier: nightly
    shape: {warps: 8, threads: 8}
    args: "-m basic -r 32"
  - id: mbar_local-pc-w8t8
    app: mbar_local
    drivers: [simx, rtlsim]
    tier: nightly
    shape: {warps: 8, threads: 8}
    args: "-m pc -r 64"
  - id: mbar_local-tx-simd2
    app: mbar_local
    drivers: [simx, rtlsim]
    tier: nightly
    configs+: "-DVX_CFG_SIMD_WIDTH=2 -DVX_CFG_ISSUE_WIDTH=2"
    shape: {warps: 8}
    args: "-m tx -r 32"
  # Two warps stream DXA copies into their own tiles, so DMA beats win the
  # banks while the objects are updated.
  - id: mbar_local-pc-dxa
    app: mbar_local
    drivers: [simx, rtlsim]
    tier: nightly
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    shape: {warps: 8}
    args: "-m pc -r 64 -D 2"
  - id: mbar_local-pc-dxa-simd2
    app: mbar_local
    drivers: [simx, rtlsim]
    tier: nightly
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_SIMD_WIDTH=2"
    shape: {warps: 8}
    args: "-m pc -r 64 -D 2"
  - id: mbar_local-count-dxa
    app: mbar_local
    drivers: [simx, rtlsim]
    tier: nightly
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    shape: {warps: 8}
    args: "-m count -r 64 -D 2"

  # SimX<->rtlsim parity at XLEN 64: no spin (the warps meet in a register
  # barrier where they would wait, then test_wait must pass at once), so the
  # instruction count is exact; the arrive holds and the bank's atomic timing
  # set the cycles.
  - id: parity-mbar-local
    check: model_parity
    app: mbar_local
    xlen: [64]
    args: "-m pc -r 32 -p"
  - id: parity-mbar-tx
    check: model_parity
    app: mbar_local
    xlen: [64]
    args: "-m tx -r 16 -p"

  # --- releases of global memory and tensor-core loads ---
  # glob: pc over a global double buffer in one block, so one L1. With issue
  # width 2 each producer warp has a consumer warp on the other LSU block,
  # whose loads reach the L1 through another input: the FULL arrive, a
  # CTA-scope release, must wait until the producers' stores are in the L1.
  - id: mbar_local-glob
    app: mbar_local
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_ISSUE_WIDTH=2"
    args: "-m glob -r 32 -b 4"
  # The xrt leg shares the pc-xrt build.
  - id: mbar_local-glob-xrt
    app: mbar_local
    drivers: [xrt]
    args: "-m glob -r 16"
  - id: mbar_local-glob-w8t8
    app: mbar_local
    drivers: [simx, rtlsim]
    tier: nightly
    configs+: "-DVX_CFG_ISSUE_WIDTH=4"
    shape: {warps: 8, threads: 8}
    args: "-m glob -r 64 -b 8"
  # lmem_bar_order with a global X released by an mbarrier arrive; dlmem.yaml
  # has the barrier and .rl forms. Every lane's stores miss on X's L1 bank, so
  # the X store can wait there while the arrive goes to local memory.
  - id: lmem_bar_order-gst-mbar
    app: lmem_bar_order
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_ISSUE_WIDTH=2"
    args: "-m mbar -o gst -d 1 -r 200 -b 8 -w 0 -e 768 -s 1"
  # MX metadata staged in local memory by a producer warp: the consumer's
  # EMPTY arrive follows its TCU_LDs of the buffer, which the producer then
  # overwrites; the arrive must wait for the TCU_LD writeback. Each K block
  # has its own magnitude, so wrong scales fail the GEMM check.
  - id: sgemm_tcu_mx_mbar
    app: sgemm_tcu_mx_mbar
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_MX_ENABLE -DVX_CFG_TCU_FP8_ENABLE -DVX_CFG_NUM_THREADS=4 -DITYPE=mxfp8 -DOTYPE=fp32"
    args: "-k 256"

  # --- wgmma groups ---
  # A CUTLASS-style multi-stage mainloop: a DXA producer warp fills S stages
  # of slabs behind FULL/EMPTY mbarriers; the WGMMA group (one consumer warp
  # per issue slot) runs wgmma, commit_group, wait_group<1> and arrives on
  # the previous stage's EMPTY. The GEMM is checked against the CPU; lat
  # ends with wait_group<0> and prints the cycles from the last wgmma to it.
  - id: sgemm_tcu_wg_mbar
    app: sgemm_tcu_wg_mbar
    drivers: [simx, rtlsim]
    configs+: &wg_mbar "-DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_ISSUE_WIDTH=2 -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DITYPE=fp16 -DOTYPE=fp32 -DWGMMA_NRC=8"
    args: "-m wait -s 3"
  - id: sgemm_tcu_wg_mbar-lat
    app: sgemm_tcu_wg_mbar
    drivers: [simx, rtlsim]
    configs+: *wg_mbar
    args: "-m lat -s 3"
  # k-tile 0 waits on a one-wgmma group at once, then on a 48-wgmma group,
  # whose retires carry `done` far past the first, waited boundary (a 6-bit
  # compare must not see that boundary again), then wait_group<2> on three
  # groups sharing one boundary. The consumers drift apart in the large group,
  # so the B buffer serves two different wgmmas at once.
  - id: sgemm_tcu_wg_mbar-groups
    app: sgemm_tcu_wg_mbar
    drivers: [simx, rtlsim]
    configs+: *wg_mbar
    args: "-m groups -s 3"
  # One stage refilled in place between wgmmas with the same descriptors, while
  # the consumers' wgmmas on a zeroed slab overlap the refill.
  - id: sgemm_tcu_wg_mbar-refill
    app: sgemm_tcu_wg_mbar
    drivers: [simx, rtlsim]
    tier: nightly
    configs+: *wg_mbar
    args: "-m refill -s 1 -e 16 -k 128"
  # Memory-sourced A with 16 accumulator registers, and the widest group
  # (issue width 4, 16 threads) over four stages.
  - id: sgemm_tcu_wg_mbar-ss16
    app: sgemm_tcu_wg_mbar
    drivers: [simx, rtlsim]
    tier: nightly
    configs+: "-DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_ISSUE_WIDTH=2 -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DITYPE=fp16 -DOTYPE=fp32 -DWGMMA_NRC=16 -DWGMMA_SS"
    args: "-m wait -s 2 -M 64 -n 64 -k 128"
  - id: sgemm_tcu_wg_mbar-iw4
    app: sgemm_tcu_wg_mbar
    drivers: [simx, rtlsim]
    tier: nightly
    configs+: "-DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_NUM_THREADS=16 -DVX_CFG_NUM_WARPS=8 -DITYPE=fp16 -DOTYPE=fp32 -DWGMMA_NRC=8"
    args: "-m wait -s 4 -M 64 -n 64 -k 128"

  # Parity of the new releases at XLEN 64, with no spin: the global double
  # buffer (the CTA fence's drain at the L1), and the wgmma mainloop (the
  # group waits and their unlock).
  - id: parity-mbar-glob
    check: model_parity
    app: mbar_local
    xlen: [64]
    configs+: "-DVX_CFG_ISSUE_WIDTH=2"
    args: "-m glob -r 16 -p"
  # The wgmma cell runs at 4 warps, one block per core. At 8 warps it differs
  # by 5.6% (simx 242227, rtlsim 256638, with wgmmas no longer holding fetch
  # in SimX), and the gap is there without the groups: -m nowait -p at 8 warps
  # 5.1% (215528 / 227135), and 4.9% (204679 / 215310) before the CTA fence
  # existed. 8-warp cores already differ without the feature (see the
  # proposal's open items).
  - id: parity-wgmma-mbar
    check: model_parity
    app: sgemm_tcu_wg_mbar
    xlen: [64]
    configs+: "-DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_ISSUE_WIDTH=2 -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=4 -DITYPE=fp16 -DOTYPE=fp32 -DWGMMA_NRC=8"
    args: "-m wait -p -s 3"
  # The same mainloop with waits that block: -m refill waits with
  # wait_group<0> right after each commit, so every release comes from the
  # wgmma's retire (the -m wait waits all find their groups complete).
  - id: parity-wgmma-wait0
    check: model_parity
    app: sgemm_tcu_wg_mbar
    xlen: [64]
    configs+: "-DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_ISSUE_WIDTH=2 -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=4 -DITYPE=fp16 -DOTYPE=fp32 -DWGMMA_NRC=8"
    args: "-m refill -p -s 3"

  # Each must stop the simulation with the exact message: an arrive past
  # pending, tx past its 21-bit range, an mbarrier op on a global address, and
  # one on another block's object through the window (a SPREAD cluster of 2 on
  # 2 cores, until remote mbarrier ops exist). The shape goes in CONFIGS, so
  # the run reuses the prebuilt driver.
  - id: mbar_local-underflow
    via: script
    driver: simx
    env: {DRIVER: simx, APP: mbar_local, ARGS: "-x underflow", EXPECT: "mbarrier pending underflow"}
    run: &expect_fail_run |
      set -u
      tmp=$(mktemp -d)
      if ! make -C sw/runtime/"$DRIVER" > "$tmp/build.log" 2>&1 \
         || ! make -C tests/regression/"$APP" >> "$tmp/build.log" 2>&1; then
        echo "FAIL: the build failed with CONFIGS=${CONFIGS:-}"; tail -n 20 "$tmp/build.log"
        rm -rf "$tmp"; exit 1
      fi
      timeout 120 ./ci/blackbox.sh --driver="$DRIVER" --app="$APP" --args="$ARGS" > "$tmp/run.log" 2>&1
      rc=$?
      fail=0
      if [ $rc -eq 0 ]; then
        echo "FAIL: '$ARGS' ran to completion on $DRIVER"; fail=1
      elif [ $rc -eq 124 ]; then
        echo "FAIL: '$ARGS' timed out on $DRIVER"; fail=1
      elif ! grep -qF "$EXPECT" "$tmp/run.log"; then
        echo "FAIL: '$ARGS' failed on $DRIVER (exit $rc) without '$EXPECT'"; fail=1
      else
        echo "OK: '$ARGS' stops $DRIVER (exit $rc): $(grep -F -m1 "$EXPECT" "$tmp/run.log")"
      fi
      [ $fail -eq 0 ] || tail -n 20 "$tmp/run.log"
      rm -rf "$tmp"
      exit $fail
  - id: mbar_local-underflow
    via: script
    driver: rtlsim
    env: {DRIVER: rtlsim, APP: mbar_local, ARGS: "-x underflow", EXPECT: "mbarrier pending underflow"}
    run: *expect_fail_run
  - id: mbar_local-txrange
    via: script
    driver: simx
    env: {DRIVER: simx, APP: mbar_local, ARGS: "-x txrange", EXPECT: "mbarrier tx out of range"}
    run: *expect_fail_run
  - id: mbar_local-txrange
    via: script
    driver: rtlsim
    env: {DRIVER: rtlsim, APP: mbar_local, ARGS: "-x txrange", EXPECT: "mbarrier tx out of range"}
    run: *expect_fail_run
  - id: mbar_local-global
    via: script
    driver: simx
    env: {DRIVER: simx, APP: mbar_local, ARGS: "-x global", EXPECT: "mbarrier op on a global address"}
    run: *expect_fail_run
  - id: mbar_local-global
    via: script
    driver: rtlsim
    env: {DRIVER: rtlsim, APP: mbar_local, ARGS: "-x global", EXPECT: "mbarrier op on a global address"}
    run: *expect_fail_run
  - id: mbar_local-remote
    via: script
    driver: simx
    configs+: "-DVX_CFG_NUM_CORES=2 -DVX_CFG_L2_ENABLE"
    env: {DRIVER: simx, APP: mbar_local, ARGS: "-x remote", EXPECT: "remote mbarrier ops are not supported yet"}
    run: *expect_fail_run
  - id: mbar_local-remote
    via: script
    driver: rtlsim
    configs+: "-DVX_CFG_NUM_CORES=2 -DVX_CFG_L2_ENABLE"
    env: {DRIVER: rtlsim, APP: mbar_local, ARGS: "-x remote", EXPECT: "remote mbarrier ops are not supported yet"}
    run: *expect_fail_run

  # The knob without its prerequisites must stop the build, in SimX (the
  # processor object) and in the RTL (a Verilator lint of the processor), each
  # with the exact message. Tagged simx only for cell placement.
  - id: reject-nodlmem
    via: script
    driver: simx
    configs: "-DVX_CFG_EXT_A_ENABLE -DVX_CFG_EXT_MBAR_ENABLE"
    env: {EXPECT: "mbarriers require DLMEM"}
    run: &reject_run |
      set -u
      read -r vh vl xl <<< "$(printf 'include config.mk\nall:\n\t@echo $(VORTEX_HOME) $(VERILATOR_PATH) $(XLEN)\n' | make -s -f -)"
      tmp=$(mktemp -d)
      make -C sim/simx DESTDIR="$tmp" "$tmp/obj/processor.o" > "$tmp/simx.log" 2>&1; simx_rc=$?
      r=$vh/hw/rtl
      "$vl/bin/verilator" --lint-only -Wno-lint -Wno-style -Wno-REDEFMACRO \
        -DVX_CFG_XLEN="$xl" -DVX_CFG_XLEN_"$xl" -DSIMULATION ${CONFIGS:-} \
        -Isw -Ihw -I"$r" -I"$r/libs" -I"$r/interfaces" -I"$r/core" -I"$r/mem" \
        -I"$r/vm" -I"$r/cache" -I"$r/fpu" -I"$r/dlmem" \
        "$r/VX_gpu_pkg.sv" "$r/fpu/VX_fpu_pkg.sv" "$r/dlmem/VX_dlmem_pkg.sv" \
        "$r/VX_trace_pkg.sv" "$r/Vortex.sv" \
        --top-module Vortex > "$tmp/rtl.log" 2>&1; rtl_rc=$?
      fail=0
      for side in simx rtl; do
        rc=simx_rc; [ $side = rtl ] && rc=rtl_rc
        if [ "${!rc}" -eq 0 ]; then
          echo "FAIL: the $side build accepted CONFIGS=${CONFIGS:-}"; fail=1
        elif ! grep -qF "$EXPECT" "$tmp/$side.log"; then
          echo "FAIL: the $side build failed without '$EXPECT':"; tail -n 20 "$tmp/$side.log"; fail=1
        else
          echo "OK: the $side build rejects it: $(grep -F -m1 "$EXPECT" "$tmp/$side.log")"
        fi
      done
      rm -rf "$tmp"
      exit $fail
  - id: reject-noa
    via: script
    driver: simx
    configs: "-DVX_CFG_EXT_DLMEM_ENABLE -DVX_CFG_EXT_MBAR_ENABLE"
    env: {EXPECT: "mbarriers require the A extension"}
    run: *reject_run
