  # --- PTX tensor loads (dxa_load, funct3 = 2) ---
  # cp.async.bulk.tensor.{1..5}d.shared::cluster.global.{tile,im2col}
  # .mbarrier::complete_tx::bytes and the tensor prefetch. Every block fills its
  # local memory with canaries and arms its mbarrier with the bytes it will
  # receive; warp 0 issues the loads; the host checks every byte of every
  # block against sw/common/dxa_ref.h (box, per-element fill, swizzle, im2col
  # walk, canaries) and the final mbarrier word against mbar_ref. Runs that do
  # not fit one local memory or 16 descriptors use several launches.
  # 2D boxes that run past size0 (and size1): only the elements inside the
  # tensor are read, the rest is zero-filled.
  - id: dxa_load-edge
    app: dxa_load
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: &dxa_load_touches [hw/rtl/dxa, sim/simx/dxa, hw/rtl/core/VX_mem_unit.sv,
              hw/rtl/mem/VX_local_mem.sv, hw/rtl/core/VX_cta_dispatch.sv, hw/rtl/core/VX_core.sv,
              hw/rtl/core/VX_execute.sv, hw/rtl/core/VX_sfu_unit.sv, hw/rtl/core/VX_wctl_unit.sv,
              hw/rtl/core/VX_bar_unit.sv, hw/rtl/VX_socket.sv, hw/rtl/VX_gpu_pkg.sv,
              hw/rtl/VX_define.vh, hw/rtl/cache/VX_amo_alu.sv, hw/rtl/cache/VX_amo_unit.sv,
              hw/rtl/dlmem, hw/rtl/mem/VX_lmem_switch.sv, hw/rtl/VX_kmu.sv,
              hw/rtl/VX_cluster.sv, hw/rtl/interfaces, sim/simx/mem/local_mem,
              sim/simx/core, sim/simx/socket, sim/simx/cta_dispatcher, sim/simx/types.h,
              sim/simx/mbar_waiters, sim/simx/amo, sim/simx/scheduler, sim/simx/barrier_unit,
              sim/simx/sfu_unit, sim/simx/Makefile, sim/simx/dlmem, sim/simx/kmu,
              sim/simx/cluster, hw/rtl/core/VX_scheduler.sv,
              sw/common/mbar_ref.h, sw/common/dlmem_ref.h, sw/kernel/include/vx_dxa.h, sw/common/dxa_tmap.h,
              sw/kernel/include/vx_mbar.h, sw/kernel/include/vx_dlmem.h,
              sw/kernel/include/vx_barrier.h,
              tests/regression/dxa_mbar, tests/regression/dxa_copy,
              tests/regression/dxa_kmajor_check, VX_config.toml, hw/rtl/core/VX_cpa_unit.sv,
              sim/simx/cpa_unit, tests/regression/dxa_load, sw/common/dxa_ref.h,
              sw/common/dxa_meta.h, sw/runtime/include/dxa.h, hw/rtl/core/VX_decode.sv,
              sim/simx/decode.cpp, hw/rtl/cache/VX_cache_amo.sv, hw/rtl/core/VX_bg_unit.sv,
              hw/rtl/core/VX_lsu_slice.sv, sim/simx/bg_unit, sim/simx/lsu_unit, sim/simx/mem/cache.cpp]
    args: "-m edge"
  # Signed coordinates, boxes starting at -1 (and further) in dims 0 and 1.
  - id: dxa_load-halo
    app: dxa_load
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_load_touches
    args: "-m halo"
  # 5D boxes larger than the tensor, filled on both sides of every dim.
  - id: dxa_load-oob5
    app: dxa_load
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_load_touches
    args: "-m oob5"
  # OOB-NaN fill: f16 0x7FFF, f32 and f64 0x7FFFFFFF per 32-bit word.
  - id: dxa_load-nan
    app: dxa_load
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_load_touches
    args: "-m nan"
  # Element strides 1-8 in dims 1-4 of a 5D box, with fill.
  - id: dxa_load-es
    app: dxa_load
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_load_touches
    args: "-m es"
  - id: dxa_load-swz32
    app: dxa_load
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_load_touches
    args: "-m swz -s 32"
  - id: dxa_load-swz64
    app: dxa_load
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_load_touches
    args: "-m swz -s 64"
  - id: dxa_load-swz128
    app: dxa_load
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_load_touches
    args: "-m swz -s 128"
  # Interleave: 16B with dim-0 element strides 1, 2 and 4; 32B with 32B swizzle.
  - id: dxa_load-il16
    app: dxa_load
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_load_touches
    args: "-m il16"
  - id: dxa_load-il32
    app: dxa_load
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_load_touches
    args: "-m il32"
  # im2col at ranks 3-5: corners, offsets, traversal strides, channel and image
  # fill, 64B swizzle (i2c4); and the three PTX §5.5.4 examples.
  - id: dxa_load-i2c3
    app: dxa_load
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_load_touches
    args: "-m i2c3"
  - id: dxa_load-i2c4
    app: dxa_load
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_load_touches
    args: "-m i2c4"
  - id: dxa_load-i2c5
    app: dxa_load
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_load_touches
    args: "-m i2c5"
  - id: dxa_load-i2c-ptx
    app: dxa_load
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_load_touches
    args: "-m i2c-ptx"
  # Tensor prefetch (tile, im2col) then the same loads: the data is identical
  # and the prefetch writes nothing.
  - id: dxa_load-pf
    app: dxa_load
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_load_touches
    args: "-m pf"
  # 16 banks: 128-byte local-memory words, so one swizzle row is one word.
  - id: dxa_load-b16
    app: dxa_load
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_LMEM_NUM_BANKS=16"
    touches: *dxa_load_touches
    args: "-m swz -s 128"
  # A SPREAD cluster of 2 on 2 cores: a multicast with 128B swizzle into both
  # ranks and one without the issuer; a window destination with a raw window
  # mbarrier on the peer (both directions, one swizzled); each block into
  # itself through its own window address.
  - id: dxa_load-mc
    app: dxa_load
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_load_touches
    shape: {cores: 2, l2cache: true}
    args: "-m mc"
  - id: dxa_load-win
    app: dxa_load
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_load_touches
    shape: {cores: 2, l2cache: true}
    args: "-m win"
  - id: dxa_load-selfwin
    app: dxa_load
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_load_touches
    shape: {cores: 2, l2cache: true}
    args: "-m selfwin"
  # Parity at XLEN 64, in the perf mode (the loads repeated 8 times, no
  # canaries, no dump): a 2D box with 128B swizzle and fill on both dims, 4D
  # im2col, 5D boxes out of bounds on both sides of every dim (whole rows
  # filled), and a dim-0 gather with 32B interleave; every wait is one
  # try_wait (4096-cycle limit).
  - id: parity-dxa-load-swz
    check: model_parity
    app: dxa_load
    xlen: [64]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_MBAR_SUSPEND_CYCLES=4096"
    touches: *dxa_load_touches
    args: "-m swz-oob -p"
  - id: parity-dxa-load-i2c
    check: model_parity
    app: dxa_load
    xlen: [64]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_MBAR_SUSPEND_CYCLES=4096"
    touches: *dxa_load_touches
    args: "-m i2c4 -p"
  - id: parity-dxa-load-oob
    check: model_parity
    app: dxa_load
    xlen: [64]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_MBAR_SUSPEND_CYCLES=4096"
    touches: *dxa_load_touches
    args: "-m oob5 -p"
  - id: parity-dxa-load-gather
    check: model_parity
    app: dxa_load
    xlen: [64]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_MBAR_SUSPEND_CYCLES=4096"
    touches: *dxa_load_touches
    args: "-m il32 -p"
  # Tensor loads that must stop the simulation with the exact message.
  - id: dxa_load-x-mbar-align
    via: script
    driver: simx
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_load_touches
    env: {DRIVER: simx, APP: dxa_load, ARGS: "-x mbar-align", EXPECT: "DXA mbarrier must be 8-byte aligned"}
    run: *expect_fail_run
  - id: dxa_load-x-mbar-align
    via: script
    driver: rtlsim
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_load_touches
    env: {DRIVER: rtlsim, APP: dxa_load, ARGS: "-x mbar-align", EXPECT: "DXA mbarrier must be 8-byte aligned"}
    run: *expect_fail_run
  - id: dxa_load-x-swz-align
    via: script
    driver: simx
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_load_touches
    env: {DRIVER: simx, APP: dxa_load, ARGS: "-x swz-align", EXPECT: "DXA swizzle needs a 128-byte aligned destination"}
    run: *expect_fail_run
  - id: dxa_load-x-swz-align
    via: script
    driver: rtlsim
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_load_touches
    env: {DRIVER: rtlsim, APP: dxa_load, ARGS: "-x swz-align", EXPECT: "DXA swizzle needs a 128-byte aligned destination"}
    run: *expect_fail_run
  - id: dxa_load-x-swz-span
    via: script
    driver: simx
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_load_touches
    env: {DRIVER: simx, APP: dxa_load, ARGS: "-x swz-span", EXPECT: "DXA swizzle span smaller than the inner box"}
    run: *expect_fail_run
  - id: dxa_load-x-swz-span
    via: script
    driver: rtlsim
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_load_touches
    env: {DRIVER: rtlsim, APP: dxa_load, ARGS: "-x swz-span", EXPECT: "DXA swizzle span smaller than the inner box"}
    run: *expect_fail_run
  - id: dxa_load-x-es0
    via: script
    driver: simx
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_load_touches
    env: {DRIVER: simx, APP: dxa_load, ARGS: "-x es0", EXPECT: "DXA element stride on dimension 0 needs interleave"}
    run: *expect_fail_run
  - id: dxa_load-x-es0
    via: script
    driver: rtlsim
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_load_touches
    env: {DRIVER: rtlsim, APP: dxa_load, ARGS: "-x es0", EXPECT: "DXA element stride on dimension 0 needs interleave"}
    run: *expect_fail_run
  - id: dxa_load-x-il32
    via: script
    driver: simx
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_load_touches
    env: {DRIVER: simx, APP: dxa_load, ARGS: "-x il32", EXPECT: "DXA 32B interleave needs 32B swizzle"}
    run: *expect_fail_run
  - id: dxa_load-x-il32
    via: script
    driver: rtlsim
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_load_touches
    env: {DRIVER: rtlsim, APP: dxa_load, ARGS: "-x il32", EXPECT: "DXA 32B interleave needs 32B swizzle"}
    run: *expect_fail_run
  - id: dxa_load-x-layout
    via: script
    driver: simx
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_load_touches
    env: {DRIVER: simx, APP: dxa_load, ARGS: "-x layout", EXPECT: "DXA swizzle and element strides need the row-major layout"}
    run: *expect_fail_run
  - id: dxa_load-x-layout
    via: script
    driver: rtlsim
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_load_touches
    env: {DRIVER: rtlsim, APP: dxa_load, ARGS: "-x layout", EXPECT: "DXA swizzle and element strides need the row-major layout"}
    run: *expect_fail_run

  # --- PTX TMA stores, reductions, bulk groups, proxy fence (dxa_store, funct3 5 and 6) ---
  # cp.async.bulk{,.tensor}.global.shared::cta.bulk_group and
  # cp.reduce.async.bulk{,.tensor}.global.shared::cta.bulk_group: one block fills
  # its local memory with a pattern (typed values under the reductions), warp 0
  # issues the stores and ends with commit + wait_group 0; the host checks the
  # whole 1 MB global buffer byte for byte (canaries around every box, typed
  # values under the reductions) against sw/common/dxa_ref.h. Without an L2 the
  # writes go to memory directly; the reductions need an L2 (or L3) and FPAMO
  # for the float, inc and dec pairs.
  # Bulk stores of 16 B up to the local memory, then one of 64 KB.
  - id: dxa_store-bst
    app: dxa_store
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: &dxa_store_touches [hw/rtl/dxa, sim/simx/dxa, hw/rtl/core/VX_mem_unit.sv,
              hw/rtl/mem/VX_local_mem.sv, hw/rtl/core/VX_cta_dispatch.sv, hw/rtl/core/VX_core.sv,
              hw/rtl/core/VX_execute.sv, hw/rtl/core/VX_sfu_unit.sv, hw/rtl/core/VX_wctl_unit.sv,
              hw/rtl/core/VX_bar_unit.sv, hw/rtl/VX_socket.sv, hw/rtl/VX_gpu_pkg.sv,
              hw/rtl/VX_define.vh, hw/rtl/cache, hw/rtl/dlmem, hw/rtl/mem/VX_lmem_switch.sv,
              hw/rtl/VX_kmu.sv, hw/rtl/VX_cluster.sv, hw/rtl/interfaces, hw/rtl/core/VX_scheduler.sv,
              hw/rtl/core/VX_decode.sv, hw/rtl/core/VX_lsu_slice.sv, hw/rtl/core/VX_lsu_unit.sv,
              hw/rtl/core/VX_bg_unit.sv, hw/rtl/core/VX_cpa_unit.sv, sim/simx/mem,
              sim/simx/core, sim/simx/socket, sim/simx/cta_dispatcher, sim/simx/types.h,
              sim/simx/instr.h, sim/simx/decode.cpp, sim/simx/mbar_waiters, sim/simx/amo,
              sim/simx/scheduler, sim/simx/barrier_unit, sim/simx/sfu_unit, sim/simx/lsu_unit,
              sim/simx/bg_unit, sim/simx/cpa_unit, sim/simx/Makefile, sim/simx/dlmem, sim/simx/kmu,
              sim/simx/cluster, sw/common/mbar_ref.h, sw/common/dlmem_ref.h, sw/common/amo_ref.h,
              sw/common/dxa_ref.h, sw/common/dxa_tmap.h, sw/common/dxa_meta.h, sw/runtime/include/dxa.h,
              sw/kernel/include/vx_dxa.h, sw/kernel/include/vx_mbar.h, sw/kernel/include/vx_dlmem.h,
              tests/regression/dxa_store, VX_config.toml]
    args: "-m bst"
  - id: dxa_store-bst-64k
    app: dxa_store
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_LMEM_LOG_SIZE=17"
    touches: *dxa_store_touches
    args: "-m bst -z 65536"
  # 1D-5D tile stores in bounds; boxes past the end of every dimension (not written).
  - id: dxa_store-tst
    app: dxa_store
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_store_touches
    args: "-m tst"
  - id: dxa_store-edge
    app: dxa_store
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_store_touches
    args: "-m edge"
  - id: dxa_store-edge-l2
    app: dxa_store
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_store_touches
    shape: {l2cache: true}
    args: "-m edge"
  # Swizzle x element 1/2/4/8 x inner widths, in bounds and past the end.
  - id: dxa_store-swz32
    app: dxa_store
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_store_touches
    args: "-m swz -s 32"
  - id: dxa_store-swz64
    app: dxa_store
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_store_touches
    args: "-m swz -s 64"
  - id: dxa_store-swz128
    app: dxa_store
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_store_touches
    args: "-m swz -s 128"
  # Element strides 1-8 in dims 1-4; 16B interleave (dim-0 strides) and 32B interleave with 32B swizzle.
  - id: dxa_store-es
    app: dxa_store
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_store_touches
    args: "-m es"
  - id: dxa_store-il16
    app: dxa_store
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_store_touches
    args: "-m il16"
  - id: dxa_store-il32
    app: dxa_store
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_store_touches
    args: "-m il32"
  # im2col_no_offs stores: pixels outside the tensor are skipped.
  - id: dxa_store-i2c3
    app: dxa_store
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_store_touches
    args: "-m i2c3"
  - id: dxa_store-i2c4
    app: dxa_store
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_store_touches
    args: "-m i2c4"
  - id: dxa_store-i2c5
    app: dxa_store
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_store_touches
    args: "-m i2c5"
  # Bulk global reductions, every legal op x type (integer pairs without FPAMO), in the LLC atomic unit.
  - id: dxa_store-rg-int
    app: dxa_store
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_store_touches
    shape: {l2cache: true}
    args: "-m rg"
  - id: dxa_store-rg
    app: dxa_store
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_EXT_ZACAS_ENABLE -DVX_CFG_EXT_FPAMO_ENABLE"
    touches: *dxa_store_touches
    shape: {l2cache: true}
    args: "-m rg"
  # Tensor reductions with out-of-bounds edges, swizzle, strides, interleave and im2col.
  - id: dxa_store-rt-int
    app: dxa_store
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_store_touches
    shape: {l2cache: true}
    args: "-m rt"
  - id: dxa_store-rt
    app: dxa_store
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_EXT_ZACAS_ENABLE -DVX_CFG_EXT_FPAMO_ENABLE"
    touches: *dxa_store_touches
    shape: {l2cache: true}
    args: "-m rt"
  # Bulk groups: wait_group 3..0 each followed by fence.proxy.async.global and generic loads of the groups it completes; N >= 8; an empty group; ten groups back to back (8 pending); one group of 70 operations.
  - id: dxa_store-grp
    app: dxa_store
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_store_touches
    args: "-m grp"
  - id: dxa_store-grp-l2
    app: dxa_store
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_store_touches
    shape: {l2cache: true}
    args: "-m grp"
  # wait_group.read 0, the sources overwritten, wait_group 0: global holds the old bytes.
  - id: dxa_store-rdreuse
    app: dxa_store
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_EXT_ZACAS_ENABLE -DVX_CFG_EXT_FPAMO_ENABLE"
    touches: *dxa_store_touches
    shape: {l2cache: true}
    args: "-m rdreuse"
  - id: dxa_store-rdreuse-nol2
    app: dxa_store
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_store_touches
    args: "-m rdreuse"
  # fence.proxy.async.global both ways: generic stores then a bulk load (i7a), a cached line then a bulk store, wait_group and a generic load (i7b); with and without an L2.
  - id: dxa_store-i7a
    app: dxa_store
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_store_touches
    args: "-m i7a"
  - id: dxa_store-i7a-l2
    app: dxa_store
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_store_touches
    shape: {l2cache: true}
    args: "-m i7a"
  - id: dxa_store-i7b
    app: dxa_store
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_store_touches
    args: "-m i7b"
  - id: dxa_store-i7b-l2
    app: dxa_store
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_store_touches
    shape: {l2cache: true}
    args: "-m i7b"
  # i7b with the first 16 bytes stored generically: with 1 core and no L2 the
  # data cache is write-back, and the dirty line's write-back must keep the
  # bytes the bulk store wrote around the cache.
  - id: dxa_store-i7c
    app: dxa_store
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_store_touches
    args: "-m i7c"
  - id: dxa_store-i7c-l2
    app: dxa_store
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_store_touches
    shape: {l2cache: true}
    args: "-m i7c"
  # A 64 KB bulk store waited for with wait_group.read 0 only, then the kernel
  # ends: the end of the kernel waits for the writes (with an L2 and an L3,
  # each store's fence walks the L2).
  - id: dxa_store-exit
    app: dxa_store
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_LMEM_LOG_SIZE=17"
    touches: *dxa_store_touches
    args: "-m exit"
  - id: dxa_store-exit-l2l3
    app: dxa_store
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_LMEM_LOG_SIZE=17"
    touches: *dxa_store_touches
    shape: {l2cache: true, l3cache: true}
    args: "-m exit"
  # Parity at XLEN 64, perf mode (the jobs repeated into fresh global regions,
  # each repeat one group closed by wait_group 0; no fill and no check, so the
  # timed loop is most of the run): a 2D tile store with 128B swizzle and an
  # out-of-bounds edge; bulk f32 and u32 adds into the L2 (every repeat
  # cold); the tensor reductions of -m rt.
  - id: parity-dxa-store-swz
    check: model_parity
    app: dxa_store
    xlen: [64]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_MBAR_SUSPEND_CYCLES=4096"
    touches: *dxa_store_touches
    args: "-m swz-oob -p"
  - id: parity-dxa-red-g-f32
    check: model_parity
    app: dxa_store
    xlen: [64]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_EXT_ZACAS_ENABLE -DVX_CFG_EXT_FPAMO_ENABLE -DVX_CFG_MBAR_SUSPEND_CYCLES=4096"
    touches: *dxa_store_touches
    shape: {l2cache: true}
    args: "-m rg -o add -t f32 -p"
  - id: parity-dxa-red-g-u32
    check: model_parity
    app: dxa_store
    xlen: [64]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_MBAR_SUSPEND_CYCLES=4096"
    touches: *dxa_store_touches
    shape: {l2cache: true}
    args: "-m rg -o add -t u32 -p"
  - id: parity-dxa-red-t
    check: model_parity
    app: dxa_store
    xlen: [64]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_EXT_ZACAS_ENABLE -DVX_CFG_EXT_FPAMO_ENABLE -DVX_CFG_MBAR_SUSPEND_CYCLES=4096"
    touches: *dxa_store_touches
    shape: {l2cache: true}
    args: "-m rt -p"
  # Stores, reductions and fences that must stop the simulation with the exact message.
  - id: dxa_store-x-neg
    via: script
    driver: simx
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_store_touches
    env: {DRIVER: simx, APP: dxa_store, ARGS: "-x neg", EXPECT: "DXA tensor store starts below the tensor"}
    run: *expect_fail_run
  - id: dxa_store-x-neg
    via: script
    driver: rtlsim
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_store_touches
    env: {DRIVER: rtlsim, APP: dxa_store, ARGS: "-x neg", EXPECT: "DXA tensor store starts below the tensor"}
    run: *expect_fail_run
  - id: dxa_store-x-nol2
    via: script
    driver: simx
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_store_touches
    env: {DRIVER: simx, APP: dxa_store, ARGS: "-x nol2", EXPECT: "DXA global reduction needs an L2 or L3"}
    run: *expect_fail_run
  - id: dxa_store-x-nol2
    via: script
    driver: rtlsim
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_store_touches
    env: {DRIVER: rtlsim, APP: dxa_store, ARGS: "-x nol2", EXPECT: "DXA global reduction needs an L2 or L3"}
    run: *expect_fail_run
  - id: dxa_store-x-nofp
    via: script
    driver: simx
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_L2_ENABLE"
    touches: *dxa_store_touches
    env: {DRIVER: simx, APP: dxa_store, ARGS: "-x nofp", EXPECT: "DXA reduction needs FPAMO"}
    run: *expect_fail_run
  - id: dxa_store-x-nofp
    via: script
    driver: rtlsim
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_L2_ENABLE"
    touches: *dxa_store_touches
    env: {DRIVER: rtlsim, APP: dxa_store, ARGS: "-x nofp", EXPECT: "DXA reduction needs FPAMO"}
    run: *expect_fail_run
  - id: dxa_store-x-badred
    via: script
    driver: simx
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_L2_ENABLE"
    touches: *dxa_store_touches
    env: {DRIVER: simx, APP: dxa_store, ARGS: "-x badred", EXPECT: "DXA invalid reduction"}
    run: *expect_fail_run
  - id: dxa_store-x-badred
    via: script
    driver: rtlsim
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_L2_ENABLE"
    touches: *dxa_store_touches
    env: {DRIVER: rtlsim, APP: dxa_store, ARGS: "-x badred", EXPECT: "DXA invalid reduction"}
    run: *expect_fail_run
  - id: dxa_store-x-tsize
    via: script
    driver: simx
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_L2_ENABLE"
    touches: *dxa_store_touches
    env: {DRIVER: simx, APP: dxa_store, ARGS: "-x tsize", EXPECT: "DXA reduction type does not match the element size"}
    run: *expect_fail_run
  - id: dxa_store-x-tsize
    via: script
    driver: rtlsim
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_L2_ENABLE"
    touches: *dxa_store_touches
    env: {DRIVER: rtlsim, APP: dxa_store, ARGS: "-x tsize", EXPECT: "DXA reduction type does not match the element size"}
    run: *expect_fail_run
  - id: dxa_store-x-enc
    via: script
    driver: simx
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_store_touches
    env: {DRIVER: simx, APP: dxa_store, ARGS: "-x enc", EXPECT: "invalid DXA encoding"}
    run: *expect_fail_run
  - id: dxa_store-x-enc
    via: script
    driver: rtlsim
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_store_touches
    env: {DRIVER: rtlsim, APP: dxa_store, ARGS: "-x enc", EXPECT: "invalid DXA encoding"}
    run: *expect_fail_run
  - id: dxa_store-x-pfence
    via: script
    driver: simx
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_store_touches
    env: {DRIVER: simx, APP: dxa_store, ARGS: "-x pfence", EXPECT: "invalid proxy fence"}
    run: *expect_fail_run
  - id: dxa_store-x-pfence
    via: script
    driver: rtlsim
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_store_touches
    env: {DRIVER: rtlsim, APP: dxa_store, ARGS: "-x pfence", EXPECT: "invalid proxy fence"}
    run: *expect_fail_run
  - id: dxa_store-x-layout
    via: script
    driver: simx
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_store_touches
    env: {DRIVER: simx, APP: dxa_store, ARGS: "-x layout", EXPECT: "DXA store needs a tile or im2col layout"}
    run: *expect_fail_run
  - id: dxa_store-x-layout
    via: script
    driver: rtlsim
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_store_touches
    env: {DRIVER: rtlsim, APP: dxa_store, ARGS: "-x layout", EXPECT: "DXA store needs a tile or im2col layout"}
    run: *expect_fail_run
  # --- PTX tensor maps in memory (dxa_tmap: the map forms of funct3 2 and 5, funct3 7) ---
  # The host encodes CUtensorMap-style maps (vortex::dxa::encode_tiled /
  # encode_im2col) into the kernel argument and a global maps buffer; the
  # block's warps run map-form loads, stores and reductions, prefetch.tensormap,
  # the tensormap acquire and release, tensormap.replace and cp_fenceproxy. The
  # host replays the jobs through sw/common/dxa_ref.h and checks every byte of
  # local memory, the global buffer and the maps buffer.
  # A map in the argument: a 2D load with fill and a tensor store, the same box through a slot equal.
  - id: dxa_tmap-param
    app: dxa_tmap
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: &dxa_tmap_touches [hw/rtl/dxa, sim/simx/dxa, hw/rtl/core/VX_mem_unit.sv,
              hw/rtl/mem/VX_local_mem.sv, hw/rtl/core/VX_cta_dispatch.sv, hw/rtl/core/VX_core.sv,
              hw/rtl/core/VX_execute.sv, hw/rtl/core/VX_sfu_unit.sv, hw/rtl/core/VX_wctl_unit.sv,
              hw/rtl/core/VX_bar_unit.sv, hw/rtl/VX_socket.sv, hw/rtl/VX_gpu_pkg.sv,
              hw/rtl/VX_define.vh, hw/rtl/cache, hw/rtl/dlmem, hw/rtl/mem/VX_lmem_switch.sv,
              hw/rtl/VX_kmu.sv, hw/rtl/VX_cluster.sv, hw/rtl/interfaces, hw/rtl/core/VX_scheduler.sv,
              hw/rtl/core/VX_decode.sv, hw/rtl/core/VX_lsu_slice.sv, hw/rtl/core/VX_lsu_unit.sv,
              hw/rtl/core/VX_bg_unit.sv, hw/rtl/core/VX_cpa_unit.sv, sim/simx/mem,
              sim/simx/core, sim/simx/socket, sim/simx/cta_dispatcher, sim/simx/types.h,
              sim/simx/instr.h, sim/simx/decode.cpp, sim/simx/mbar_waiters, sim/simx/amo,
              sim/simx/scheduler, sim/simx/barrier_unit, sim/simx/sfu_unit, sim/simx/lsu_unit,
              sim/simx/bg_unit, sim/simx/cpa_unit, sim/simx/Makefile, sim/simx/dlmem, sim/simx/kmu,
              sim/simx/cluster, sw/common/mbar_ref.h, sw/common/dlmem_ref.h, sw/common/amo_ref.h,
              sw/common/dxa_ref.h, sw/common/dxa_meta.h, sw/common/dxa_tmap.h, sw/runtime/include/dxa.h,
              sw/kernel/include/vx_dxa.h, sw/kernel/include/vx_mbar.h, sw/kernel/include/vx_dlmem.h,
              tests/regression/dxa_tmap, VX_config.toml]
    args: "-m param"
  # Maps in a global buffer: a 3D swizzled load with element strides and fill, 2D stores.
  - id: dxa_tmap-global
    app: dxa_tmap
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_tmap_touches
    args: "-m global"
  # A 4D im2col load through a map, with corners, offsets and a W traversal stride.
  - id: dxa_tmap-im2col
    app: dxa_tmap
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_tmap_touches
    args: "-m im2col"
  # A multicast load through the argument map, a cluster of 2 on 2 cores.
  - id: dxa_tmap-mcast
    app: dxa_tmap
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_tmap_touches
    shape: {cores: 2, l2cache: true}
    args: "-m mcast"
  # Map-typed tensor reductions: f32 add and u32 max into the L2.
  - id: dxa_tmap-red
    app: dxa_tmap
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_EXT_ZACAS_ENABLE -DVX_CFG_EXT_FPAMO_ENABLE"
    touches: *dxa_tmap_touches
    shape: {l2cache: true}
    args: "-m red"
  # Two launches, the same argument address and different maps: each launch uses its own.
  - id: dxa_tmap-relaunch
    app: dxa_tmap
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_tmap_touches
    args: "-m relaunch"
  # 12 maps used in rotation through the 8-entry descriptor cache.
  - id: dxa_tmap-evict
    app: dxa_tmap
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_tmap_touches
    args: "-m evict"
  # prefetch.tensormap, then a load as fast as a cached map and faster than a cold one.
  - id: dxa_tmap-prefetch
    app: dxa_tmap
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_tmap_touches
    args: "-m prefetch"
  # A shared-memory copy, replace global_address, cp_fenceproxy, acquire, __syncthreads, another warp loads.
  - id: dxa_tmap-replace-smem
    app: dxa_tmap
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_tmap_touches
    args: "-m replace-smem"
  # PTX 9.7.13.4: replace on the global map, release, acquire, load.
  - id: dxa_tmap-replace-global
    app: dxa_tmap
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_tmap_touches
    args: "-m replace-global"
  # Every field from a zero buffer, cp_fenceproxy, acquire, load; the map equals the encoder.
  - id: dxa_tmap-replace-zero
    app: dxa_tmap
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_tmap_touches
    args: "-m replace-zero"
  # replace-zero with cp_fenceproxy called by lanes 0 and 2 only: the whole map still reaches global memory.
  - id: dxa_tmap-replace-partial
    app: dxa_tmap
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_tmap_touches
    args: "-m replace-partial"
  # Two DXA workers: the descriptor fetch shares the GMEM port behind the worker arbiter.
  - id: dxa_tmap-param-dxa2
    app: dxa_tmap
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_NUM_DXA_CORES=2"
    touches: *dxa_tmap_touches
    args: "-m param"
  - id: dxa_tmap-evict-dxa2
    app: dxa_tmap
    drivers: [simx, rtlsim]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_NUM_DXA_CORES=2"
    touches: *dxa_tmap_touches
    args: "-m evict"
  # Parity at XLEN 64, perf mode (no canaries, no dump): a first batch caches
  # 8 maps, then 48 prefetch.tensormap back to back, each through a map not
  # yet cached (the descriptor fetches at the queue head bound the run) or
  # through the 8 cached maps, and one load behind them. Each wait is a
  # try_wait and a test_wait, the same instructions whether it slept or not.
  - id: parity-dxa-tmap-miss
    check: model_parity
    app: dxa_tmap
    xlen: [64]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_MBAR_SUSPEND_CYCLES=4096"
    touches: *dxa_tmap_touches
    args: "-p miss"
  - id: parity-dxa-tmap-hit
    check: model_parity
    app: dxa_tmap
    xlen: [64]
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_MBAR_SUSPEND_CYCLES=4096"
    touches: *dxa_tmap_touches
    args: "-p hit"
  # Map uses that must stop the simulation with the exact message.
  - id: dxa_tmap-x-unaligned
    via: script
    driver: simx
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_tmap_touches
    env: {DRIVER: simx, APP: dxa_tmap, ARGS: "-x unaligned", EXPECT: "DXA tensor map is not 64-byte aligned"}
    run: *expect_fail_run
  - id: dxa_tmap-x-unaligned
    via: script
    driver: rtlsim
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_tmap_touches
    env: {DRIVER: rtlsim, APP: dxa_tmap, ARGS: "-x unaligned", EXPECT: "DXA tensor map is not 64-byte aligned"}
    run: *expect_fail_run
  - id: dxa_tmap-x-smem
    via: script
    driver: simx
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_tmap_touches
    env: {DRIVER: simx, APP: dxa_tmap, ARGS: "-x smem", EXPECT: "DXA tensor map must be in global memory"}
    run: *expect_fail_run
  - id: dxa_tmap-x-smem
    via: script
    driver: rtlsim
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_tmap_touches
    env: {DRIVER: rtlsim, APP: dxa_tmap, ARGS: "-x smem", EXPECT: "DXA tensor map must be in global memory"}
    run: *expect_fail_run
  - id: dxa_tmap-x-zero
    via: script
    driver: simx
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_tmap_touches
    env: {DRIVER: simx, APP: dxa_tmap, ARGS: "-x zero", EXPECT: "DXA tensor map rank must be 1-5"}
    run: *expect_fail_run
  - id: dxa_tmap-x-zero
    via: script
    driver: rtlsim
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_tmap_touches
    env: {DRIVER: rtlsim, APP: dxa_tmap, ARGS: "-x zero", EXPECT: "DXA tensor map rank must be 1-5"}
    run: *expect_fail_run
  - id: dxa_tmap-x-wide
    via: script
    driver: simx
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_tmap_touches
    env: {DRIVER: simx, APP: dxa_tmap, ARGS: "-x wide", EXPECT: "DXA tensor stride needs 32 bits"}
    run: *expect_fail_run
  - id: dxa_tmap-x-wide
    via: script
    driver: rtlsim
    configs+: "-DVX_CFG_EXT_DXA_ENABLE"
    touches: *dxa_tmap_touches
    env: {DRIVER: rtlsim, APP: dxa_tmap, ARGS: "-x wide", EXPECT: "DXA tensor stride needs 32 bits"}
    run: *expect_fail_run
