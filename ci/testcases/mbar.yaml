  # The hpc-ops cluster-8 exact top-k (hpc-ops 2a2e265 src/topk/topk_filtered.cu,
  # topk_filtered_cluster8_exact_kernel<VEC, 2048, 8, 1024>): one row per 8-CTA cluster of
  # 1024-thread blocks (32 warps x 32 threads per core, 8 cores), DSMEM histogram all-reduce and
  # gather to rank 0. VEC follows n: n = 8194 is the VEC 2 route the H100 profiled, n = 8192 the
  # VEC 4 route. Each rep draws a new row and checks the wrapper's rule (k unique in-range
  # indices equal to the CPU top-k, or the same sorted values under ties) and the route the kernel
  # recorded against the one the coarse histogram implies; on VEC 2 each rank's recorded spill
  # count must match its segment. The ties case forces the VEC 2 overflow continuation (4500
  # boundary candidates; rank 5's segment alone exceeds its 2048-entry buffer, and the harness
  # requires a spill) and asserts the route with -e.
