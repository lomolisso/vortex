  # A launch whose cluster is not the kernel's __cluster_dims__ traps at the
  # kernel entry (x1). The kernel's vx_printf text is lost when the simulator
  # stops, so the run must print the host marker and then the trap line, in
  # that order. The shape goes in CONFIGS, so the run reuses the prebuilt driver.
  - id: cuda_api-x1
    via: script
    driver: simx
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_EXT_ZACAS_ENABLE -DVX_CFG_EXT_FPAMO_ENABLE -DVX_CFG_NUM_CORES=2 -DVX_CFG_NUM_THREADS=32 -DVX_CFG_L2_ENABLE"
    touches: *cuda_api_touches
    env: {DRIVER: simx, APP: cuda_api, ARGS: "-x 1", MARKER: "cuda_api: x1 marker:", EXPECT: "invalid CSR read addr=0xc00"}
    run: &cuda_expect_trap_run |
      set -u
      tmp=$(mktemp -d)
      if ! make -C sw/runtime/"$DRIVER" > "$tmp/build.log" 2>&1 \
         || ! make -C tests/regression/"$APP" >> "$tmp/build.log" 2>&1; then
        echo "FAIL: the build failed with CONFIGS=${CONFIGS:-}"; tail -n 20 "$tmp/build.log"
        rm -rf "$tmp"; exit 1
      fi
      timeout 120 ./ci/blackbox.sh --driver="$DRIVER" --app="$APP" --args="$ARGS" > "$tmp/run.log" 2>&1
      rc=$?
      m=$(grep -nF -m1 "$MARKER" "$tmp/run.log" | cut -d: -f1)
      e=$(grep -nF -m1 "$EXPECT" "$tmp/run.log" | cut -d: -f1)
      fail=0
      if [ $rc -eq 0 ]; then
        echo "FAIL: '$ARGS' ran to completion on $DRIVER"; fail=1
      elif [ $rc -eq 124 ]; then
        echo "FAIL: '$ARGS' timed out on $DRIVER"; fail=1
      elif [ -z "$m" ] || [ -z "$e" ] || [ "$m" -ge "$e" ]; then
        echo "FAIL: '$ARGS' failed on $DRIVER (exit $rc) without '$MARKER' then '$EXPECT'"; fail=1
      else
        echo "OK: '$ARGS' stops $DRIVER (exit $rc) after the marker: $(grep -F -m1 "$EXPECT" "$tmp/run.log")"
      fi
      [ $fail -eq 0 ] || tail -n 20 "$tmp/run.log"
      rm -rf "$tmp"
      exit $fail
  - id: cuda_api-x1
    via: script
    driver: rtlsim
    configs+: "-DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_EXT_ZACAS_ENABLE -DVX_CFG_EXT_FPAMO_ENABLE -DVX_CFG_NUM_CORES=2 -DVX_CFG_NUM_THREADS=32 -DVX_CFG_L2_ENABLE"
    touches: *cuda_api_touches
    env: {DRIVER: rtlsim, APP: cuda_api, ARGS: "-x 1", MARKER: "cuda_api: x1 marker:", EXPECT: "invalid CSR write address: c00"}
    run: *cuda_expect_trap_run
  # launch_kernel_ex refuses, with VX_ERR_INVALID_VALUE and before any launch,
  # dynamic shared memory past the recorded attribute (x2) and an explicit
  # cluster other than __cluster_dims__ (x3); each first launches its compliant
