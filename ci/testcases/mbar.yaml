  # ClusterFusion's fused decode-step kernels as the H100 ran them (ClusterFusion 8755446 with
  # the patch clusterfusion__residual_out_c4_fix): the Llama-2 attention block
  # (include/H100/llama/kernel_sglang.cuh, variant fused_c4) and DeepSeek-V2-Lite weight-absorbed
  # MLA (include/H100/deepseek/kernel.cuh). One cluster of four 128-thread blocks per head, one
  # block per core (4 cores x 4 warps x 32 threads): TMA weight and KV tiles through tensor maps
  # (zero fill past the sequence), bulk-push cluster reduces and an all-gather on mbarriers,
  # remote f32 atomics and a remote max, f16 global atomics over the heads. Head counts, the MLA
  # hidden size and sequence length are compile-time, through env (the app rebuilds when they
  # change). Each rep draws new inputs and checks the wrappers' tolerances against the unfused
  # sequence computed on the host. Smoke: llama 4 heads (hidden 512, 250 cached tokens), mla 2
  # heads (hidden 1024, 128 tokens); nightly: 2 heads and 1 head.
