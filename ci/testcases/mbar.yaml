  # The 29 DSMEM collectives of the H100 study (h100-dsmem-collectives/collectives, commit
  # 2b9a97e), one app at the ports' shape: N cores of one cluster (one block of 8 warps x 32
  # threads per core), an L2, DLMEM, A, Zacas, mbarriers, DXA, FPAMO and 256 KB of local memory.
  # N, M and the element type are compile-time, as on the H100: COLL_N, COLL_M and COLL_T reach
  # the app build through env (the app rebuilds when they change; they stay out of CONFIGS, the
  # simulator build key). Each run checks every rep against a host reference: pattern A (small
  # integers) is bit-exact for every op, pattern B (-p B, random floats) is within a log2(N)
