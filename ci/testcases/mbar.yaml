  # The host refuses a point the original build rejects: a static_assert of the file exits 2
  # with SKIP:static_assert, a CollectiveSmem past the local memory exits 3 with SKIP:smem
  # (2 x 16 x 4096 floats = 512 KB here). The run must fail with that exit code and line. The
  # shape goes in CONFIGS, so the run reuses the prebuilt driver.
  - id: dsmem_coll-x-static
    via: script
    driver: simx
    configs+: "-DVX_CFG_EXT_ZACAS_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_EXT_FPAMO_ENABLE -DVX_CFG_LMEM_LOG_SIZE=18 -DVX_CFG_NUM_CORES=2 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_NUM_THREADS=32 -DVX_CFG_L2_ENABLE"
    touches: *dsmem_coll_touches
    env: {DRIVER: simx, APP: dsmem_collectives, ARGS: "-a allreduce__shift_accumulate_bulk", COLL_N: "2", COLL_M: "1024", COLL_T: f32,
          EXPECT: "SKIP:static_assert allreduce__shift_accumulate_bulk N=2 M=1024", EXPECT_RC: "2"}
    run: &expect_exit_run |
      set -u
      tmp=$(mktemp -d)
      if ! make -C sw/runtime/"$DRIVER" > "$tmp/build.log" 2>&1 \
         || ! make -C tests/regression/"$APP" >> "$tmp/build.log" 2>&1; then
        echo "FAIL: the build failed with CONFIGS=${CONFIGS:-}"; tail -n 20 "$tmp/build.log"
        rm -rf "$tmp"; exit 1
      fi
      timeout 120 ./ci/blackbox.sh --driver="$DRIVER" --app="$APP" --args="$ARGS" > "$tmp/run.log" 2>&1
      rc=$?
      fail=0
      if [ $rc -eq 0 ]; then
        echo "FAIL: '$ARGS' ran to completion on $DRIVER"; fail=1
      elif [ $rc -eq 124 ]; then
        echo "FAIL: '$ARGS' timed out on $DRIVER"; fail=1
      elif ! grep -qF "$EXPECT" "$tmp/run.log"; then
        echo "FAIL: '$ARGS' failed on $DRIVER (exit $rc) without '$EXPECT'"; fail=1
      elif ! grep -qE "run-$DRIVER\] Error $EXPECT_RC\$" "$tmp/run.log"; then
        echo "FAIL: '$ARGS' printed '$EXPECT' but the app did not exit $EXPECT_RC on $DRIVER"; fail=1
      else
        echo "OK: '$ARGS' stops $DRIVER (app exit $EXPECT_RC): $(grep -F -m1 "$EXPECT" "$tmp/run.log")"
      fi
      [ $fail -eq 0 ] || tail -n 20 "$tmp/run.log"
      rm -rf "$tmp"
      exit $fail
