# SimX<->rtlsim cycle parity on the MX datapath: same config on both drivers,
# cycles must agree within tolerance (see core.yaml).
- id: model_parity-mxfp8
  check: model_parity
  via: blackbox
  app: sgemm_tcu_mx
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_MX_ENABLE -DVX_CFG_TCU_FP8_ENABLE -DITYPE=mxfp8 -DOTYPE=fp32 -DVX_CFG_TCU_TYPE_DPI
  args: "-k32"

# Perf-regression twin of the model_parity-mxfp8 benchmark (same run, cycles-vs-baseline).
- id: perf_gate-mxfp8
  check: perf_gate
  via: blackbox
  app: sgemm_tcu_mx
  args: -m 128 -n 128 -k32
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_MX_ENABLE -DVX_CFG_TCU_FP8_ENABLE -DITYPE=mxfp8 -DOTYPE=fp32 -DVX_CFG_TCU_TYPE_DPI

  # Not warp-width swept: the tensor-core fragment layout is defined over a fixed
  # lane count, which the configs pin.

# Metadata loads (TCU_LD through the TCU's AGU) on the H100 SM path: the SM's L1
# fetches only enabled bytes, so each AGU lane must enable its whole word.
- id: sgemm_tcu_mx-sm
  via: blackbox
  drivers: [simx]
  xlen: [64]
  app: sgemm_tcu_mx
  args: "-k32"
  configs: -DVX_CFG_NUM_THREADS=16 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_MX_ENABLE -DVX_CFG_TCU_FP8_ENABLE -DITYPE=mxfp8 -DOTYPE=fp32
    -DVX_CFG_H100_SM_ENABLE -DVX_CFG_L2_ENABLE
  touches: [hw/rtl/tcu, sim/simx/tcu, sim/simx/mem/sm_l1.cpp, hw/rtl/mem/VX_sm_l1.sv, VX_config.toml]
- id: sgemm_tcu_mx-sm-rtl
  via: blackbox
  drivers: [rtlsim]
  xlen: [64]
  app: sgemm_tcu_mx
  args: "-k32"
  configs: -DVX_CFG_NUM_THREADS=16 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_MX_ENABLE -DVX_CFG_TCU_FP8_ENABLE -DVX_CFG_TCU_TYPE_DPI -DITYPE=mxfp8 -DOTYPE=fp32
    -DVX_CFG_H100_SM_ENABLE -DVX_CFG_L2_ENABLE
  touches: [hw/rtl/tcu, sim/simx/tcu, sim/simx/mem/sm_l1.cpp, hw/rtl/mem/VX_sm_l1.sv, VX_config.toml]
