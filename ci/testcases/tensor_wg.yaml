# SimX<->rtlsim cycle parity on the WGMMA int8 datapath: same config on both
# drivers, cycles must agree within tolerance (see core.yaml).
- id: model_parity-wgmma-int8
  check: model_parity
  via: blackbox
  app: sgemm_tcu_wg
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_INT8_ENABLE -DITYPE=int8 -DOTYPE=int32 -DWGMMA_NRC=32

# Dense WGMMA fp16 SS datapath, cycles-vs-baseline.
- id: perf_gate-wgmma-fp16-ss
  check: perf_gate
  via: blackbox
  app: sgemm_tcu_wg
  args: -m 128 -n 128 -k 128
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DITYPE=fp16 -DOTYPE=fp32 -DWGMMA_NRC=32 -DWGMMA_SS

- id: perf_gate-wgmma-fedp2k-rs
  check: perf_gate
  via: blackbox
  app: sgemm_tcu_wg
  args: -m64 -n64 -k64
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_FEDP2K -DITYPE=fp16 -DOTYPE=fp32 -DWGMMA_NRC=8 -DWGMMA_RS

- id: model_parity-wgmma-fedp2k-rs
  check: model_parity
  # Retired instructions match exactly and the cycle gap is now within tolerance
  # (~3.5%): the SimX WGMMA setup/tile-buffer timing closed the former ~8% gap.
  via: blackbox
  app: sgemm_tcu_wg
  args: -m64 -n64 -k64
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE
    -DVX_CFG_TCU_FEDP2K -DVX_CFG_TCU_TYPE_DPI -DITYPE=fp16 -DOTYPE=fp32 -DWGMMA_NRC=8 -DWGMMA_RS

# Cooperative sparse WGMMA (default fp16 operands, 2:4 structured sparsity).
  # Not warp-width swept: the tensor-core fragment layout is defined over a fixed
  # lane count, which the configs pin.
- id: perf_gate-wgmma-sparse
  check: perf_gate
  via: blackbox
  app: sgemm_tcu_wg_sp
  args: -m 128 -n 128 -k 128
  configs: -DVX_CFG_NUM_THREADS=8 -DVX_CFG_NUM_WARPS=8 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_TCU_SPARSE_ENABLE -DWGMMA_NRC=32

  # Not warp-width swept: the tensor-core fragment layout is defined over a fixed
  # lane count, which the configs pin.

# WGMMA as on the H100 (VX_CFG_TCU_H100_ENABLE, RV64 only): wgmma_h100 checks every
# accumulator register of every thread bit for bit against the TFR model
# (sw/common/tcu_fedp_ref.h) through the PTX fragment layout, with operands placed by
# the descriptor golden (sw/common/tcu_desc_ref.h) or by DXA tensor loads.
# 1 core, 4 warps (8 with -w 2), 32 threads, ISSUE_WIDTH 4, 256 KB of local memory.
- id: wgmma_h100-sw128-f16f32
  via: blackbox
  drivers: [simx]
  xlen: [64]
  app: wgmma_h100
  configs: &h100_cfg -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_LMEM_LOG_SIZE=18 -DVX_CFG_EXT_DLMEM_ENABLE -DVX_CFG_EXT_A_ENABLE -DVX_CFG_EXT_ZACAS_ENABLE -DVX_CFG_EXT_MBAR_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_EXT_FPAMO_ENABLE -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_TCU_FP8_ENABLE -DVX_CFG_TCU_H100_ENABLE -DWGMMA_SS
  shape: &h100_w4 {cores: 1, warps: 4, threads: 32}
  touches: &h100_touches [hw/rtl/tcu, sim/simx/tcu, sw/kernel/include/vx_tensor.h, sw/kernel/include/vx_cuda.h,
            sw/common/tcu_desc_ref.h, sw/common/tcu_fedp_ref.h, sw/common/dxa_ref.h, hw/dpi/dpi_tcu.cpp,
            hw/dpi/dpi_tcu.vh, hw/rtl/VX_gpu_pkg.sv, hw/rtl/VX_define.vh, VX_config.toml, sim/simx/types.h,
            sim/simx/decode.cpp, hw/rtl/core/VX_execute.sv, hw/rtl/core/VX_core.sv, hw/rtl/core/VX_commit.sv,
            hw/rtl/dxa, sim/simx/dxa, tests/regression/wgmma_h100, sim/simx/mem/local_mem,
            sim/simx/core, sim/simx/cta_dispatcher, hw/rtl/core/VX_mem_unit.sv, hw/rtl/mem,
            hw/rtl/core/VX_cta_dispatch.sv, hw/rtl/core/VX_scheduler.sv]
  args: "-l 128 -t f16f32 -n 64 -c 2 -r 2"
