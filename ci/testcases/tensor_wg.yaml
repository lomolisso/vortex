# Illegal knob combinations stop the build with the RTL's and SimX's texts (SimX processor object and
# the RTL lint, as dlmem.yaml's reject cases; the kernel library #errors with the same
# texts). The run script is dlmem.yaml's `reject_run`, copied (anchors do not cross files), compiling
# the SimX TCU unit, where the SimX rules live, instead of the processor object; the
# 32-thread rule is an RTL STATIC_ASSERT that fires at simulation start, so that case
# checks the SimX build only (SIDES).
- id: reject-h100-rv32
  via: script
  driver: simx
  xlen: [32]
  configs: -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_LMEM_LOG_SIZE=18 -DVX_CFG_EXT_DLMEM_ENABLE -DVX_CFG_EXT_A_ENABLE -DVX_CFG_EXT_ZACAS_ENABLE -DVX_CFG_EXT_MBAR_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_TCU_FP8_ENABLE -DVX_CFG_TCU_H100_ENABLE -DVX_CFG_NUM_THREADS=32
  env: {EXPECT: "H100 WGMMA requires XLEN 64"}
  touches: *h100_touches
  run: &h100_reject_run |
    set -u
    read -r vh vl xl <<< "$(printf 'include config.mk\nall:\n\t@echo $(VORTEX_HOME) $(VERILATOR_PATH) $(XLEN)\n' | make -s -f -)"
    tmp=$(mktemp -d)
    make -C sim/simx DESTDIR="$tmp" "$tmp/obj/tcu/tcu_unit.o" > "$tmp/simx.log" 2>&1; simx_rc=$?
    r=$vh/hw/rtl
    "$vl/bin/verilator" --lint-only -Wno-lint -Wno-style -Wno-REDEFMACRO \
      -DVX_CFG_XLEN="$xl" -DVX_CFG_XLEN_"$xl" -DSIMULATION ${CONFIGS:-} \
      -Isw -Ihw -I"$r" -I"$r/libs" -I"$r/interfaces" -I"$r/core" -I"$r/mem" \
      -I"$r/vm" -I"$r/cache" -I"$r/fpu" -I"$r/dlmem" \
      "$r/VX_gpu_pkg.sv" "$r/fpu/VX_fpu_pkg.sv" "$r/dlmem/VX_dlmem_pkg.sv" \
      "$r/VX_trace_pkg.sv" "$r/Vortex.sv" \
      --top-module Vortex > "$tmp/rtl.log" 2>&1; rtl_rc=$?
    fail=0
    for side in ${SIDES:-simx rtl}; do
      rc=simx_rc; [ $side = rtl ] && rc=rtl_rc
      if [ "${!rc}" -eq 0 ]; then
        echo "FAIL: the $side build accepted CONFIGS=${CONFIGS:-}"; fail=1
      elif ! grep -qF "$EXPECT" "$tmp/$side.log"; then
        echo "FAIL: the $side build failed without '$EXPECT':"; tail -n 20 "$tmp/$side.log"; fail=1
      else
        echo "OK: the $side build rejects it: $(grep -F -m1 "$EXPECT" "$tmp/$side.log")"
      fi
    done
    rm -rf "$tmp"
    exit $fail
