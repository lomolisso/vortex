# Unit tests (host). Native catalog entries — replaces the legacy
# regression.sh --unittest delegation (sw + hw unit tests).
category: unittest
defaults:
  xlen: [32, 64]
  tier: smoke
tests:
  - id: sw
    via: script
    run: "make -C tests/unittest run"
  - id: hw
    via: script
    run: "make -C hw/unittest"
  # FPU arithmetic units (VX_fma/fdiv/fsqrt/fcvt/fdivsqrt): the `hw` lane above only
  # builds the unit tests; this lane executes them so a softfloat-divergent
  # regression actually fails CI (each driver checks bit-exact result+fflags over
  # millions of vectors across all RISC-V rounding modes, default + lean configs).
  - id: hw-fpu
    via: script
    run: "make -C hw/unittest run-fpu"
  # Local memory banks, built with A, A+Zacas and atomics off. With atomics, a
  # DMA access at every cycle offset of an atomic's bank occupancy and across an
  # LR/SC window; every build then runs a randomized golden-model stress (atomics
  # off: load/store/DMA only). The `hw` lane only builds local_mem without atomics.
  # Then the LSU's global/local switch at 1, 2 and 4 LSU lanes: every request
  # reaches each side it has lanes on exactly once, under independent back-pressure.
  # At XLEN 64 also the mbarrier banks and the mbarrier waiter table.
  - id: hw-lmem
    via: script
    run: "make -C hw/unittest run-lmem"
    touches: [hw/rtl/mem, hw/rtl/cache/VX_amo_unit.sv, hw/rtl/cache/VX_amo_alu.sv,
              hw/rtl/VX_gpu_pkg.sv, hw/rtl/VX_define.vh, hw/rtl/core/VX_mem_unit.sv,
              hw/unittest/local_mem, hw/unittest/lmem_switch, hw/unittest/mem_unit,
              hw/unittest/Makefile, sw/common/mbar_ref.h, hw/rtl/dlmem/VX_mbar_waiters.sv,
              hw/unittest/mbar_waiters]
  # CTA dispatcher and KMU: slot placement across launches, each launch opening
  # at slot 0 as SimX's does, with 4 and 8 CTA slots. In the xlen-64 tree the
  # same benches also run in DLMEM builds: the cluster rank on every launch beat
  # and through the dispatcher's CSR port. The `hw` lane only builds them.
  - id: hw-cta
    via: script
    run: "make -C hw/unittest run-cta"
    touches: [hw/rtl/core/VX_cta_dispatch.sv, hw/rtl/VX_kmu.sv, hw/rtl/VX_gpu_pkg.sv,
              hw/unittest/cta_dispatcher, hw/unittest/kmu, hw/unittest/Makefile]
  # Distributed local memory units (RV64 only): the cluster network at every
  # socket shape, checked packet for packet against the SimX model, then the
  # units the later steps add.
  - id: hw-dlmem
    via: script
    xlen: [64]
    run: "make -C hw/unittest run-dlmem"
    touches: [hw/rtl/dlmem, hw/rtl/VX_gpu_pkg.sv, hw/rtl/libs/VX_stream_xbar.sv,
              hw/rtl/core/VX_mem_unit.sv, hw/rtl/core/VX_core.sv, hw/rtl/VX_socket.sv,
              hw/rtl/VX_cluster.sv, hw/unittest/dlmem_noc, hw/unittest/dlmem_ep,
              hw/unittest/dlmem_xlate, hw/unittest/core, hw/unittest/Makefile,
              sim/simx/dlmem, sim/simx/types.h, sim/simx/cta_dispatcher,
              tests/unittest/dlmem_noc, tests/unittest/dlmem_ep,
              tests/unittest/dlmem_xlate, hw/rtl/VX_define.vh, sw/common/mbar_ref.h]
  # Last-level cache bank (VX_cache_top): a held fill released at every cycle
  # offset around a racing atomic, store or load (also with memory refusing
  # requests), loads replaying ahead of an atomic's writeback while responses
  # stall, then randomized loads, stores, atomics and LR/SC against a
  # reference memory, in nine parameter sets, two with atomics compiled out.
  # The `hw` lane only builds the cache testbench.
  - id: hw-cache
    via: script
    run: "make -C hw/unittest run-cache"
    touches: [hw/rtl/cache, hw/rtl/VX_gpu_pkg.sv, hw/unittest/cache, hw/unittest/Makefile]
  # TCU FEDP datapath: the `hw` lane only builds it; this lane executes tcu_fedp
  # per format (native TFR + DPI). touches gates it on tcu changes.
  - id: hw-tcu
    via: script
    run: "make -C hw/unittest run-tcu"
    touches: [hw/rtl/tcu, hw/unittest/tcu_fedp]
  # Same native-TFR formats with the multipliers mapped onto DSP48 (USE_DSP=1) —
  # the FPGA-synthesis path, off by default in sim. Bit-identical to LUT by
  # contract, so a mismatch is a DSP-packing bug.
  - id: hw-tcu-dsp
    via: script
    run: "make -C hw/unittest run-tcu-dsp"
    touches: [hw/rtl/tcu, hw/unittest/tcu_fedp]
  # DXA core: legacy multicast copies through VX_dxa_core with dense and
  # sparse cta masks; the receiver of bit r gets the tile at issuer + r x the
  # stride and its barrier release at barrier + r. The `hw` lane above only
  # builds this bench.
  - id: hw-dxa-core
    via: script
    run: "make -C hw/unittest/dxa_core clean && make -C hw/unittest/dxa_core run"
    touches: [hw/rtl/dxa, hw/rtl/VX_gpu_pkg.sv, hw/rtl/VX_define.vh, hw/unittest/dxa_core,
              hw/unittest/common.mk]
  # DXA completion (RV64, DXA with mbarriers): the RTL completion unit in both
  # modes, a barrier event per copy and an mbarrier complete_tx of the box
  # bytes into the local memory, under back-pressure and in bursts; then the
  # SimX twin, which must release only once every write of the copy has
  # committed at the bank.
  - id: hw-dxa-completion
    via: script
    xlen: [64]
    run: "make -C hw/unittest run-dxa-completion"
    touches: [hw/rtl/dxa, hw/rtl/VX_gpu_pkg.sv, hw/rtl/VX_define.vh, hw/rtl/dlmem/VX_dlmem_pkg.sv,
              hw/rtl/libs/VX_fifo_queue.sv, hw/unittest/dxa_completion, hw/unittest/Makefile,
              sw/common/mbar_ref.h]
  - id: sw-dxa-compl
    via: script
    xlen: [64]
    run: "make -C tests/unittest/dxa_compl run"
    touches: [sim/simx/dxa, sim/simx/mem/local_mem, sim/simx/types.h, sim/simx/Makefile,
              sim/simx/cta_dispatcher, sim/simx/barrier_unit, tests/unittest/dxa_compl,
              tests/unittest/Makefile, sw/common/mbar_ref.h]
