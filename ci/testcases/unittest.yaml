# Unit tests (host). Native catalog entries — replaces the legacy
# regression.sh --unittest delegation (sw + hw unit tests).
category: unittest
defaults:
  xlen: [32, 64]
  tier: smoke
tests:
  - id: sw
    via: script
    run: "make -C tests/unittest run"
  - id: hw
    via: script
    run: "make -C hw/unittest"
  # FPU arithmetic units (VX_fma/fdiv/fsqrt/fcvt/fdivsqrt): the `hw` lane above only
  # builds the unit tests; this lane executes them so a softfloat-divergent
  # regression actually fails CI (each driver checks bit-exact result+fflags over
  # millions of vectors across all RISC-V rounding modes, default + lean configs).
  - id: hw-fpu
    via: script
    run: "make -C hw/unittest run-fpu"
  # Local memory banks, built with A, A+Zacas and atomics off. With atomics, a
  # DMA access at every cycle offset of an atomic's bank occupancy and across an
  # LR/SC window; every build then runs a randomized golden-model stress (atomics
  # off: load/store/DMA only). The `hw` lane only builds local_mem without atomics.
  # Then the LSU's global/local switch at 1, 2 and 4 LSU lanes: every request
  # reaches each side it has lanes on exactly once, under independent back-pressure.
  # At XLEN 64 also the mbarrier banks (with the arrive_drop / noComplete
  # operand flags against mbar_ref and their asserts, and the cp.async inputs
  # sharing each bank round-robin) and the mbarrier waiter table.
  - id: hw-lmem
    via: script
    run: "make -C hw/unittest run-lmem"
    touches: [hw/rtl/mem, hw/rtl/cache/VX_amo_unit.sv, hw/rtl/cache/VX_amo_alu.sv,
              hw/rtl/VX_gpu_pkg.sv, hw/rtl/VX_define.vh, hw/rtl/core/VX_mem_unit.sv,
              hw/unittest/local_mem, hw/unittest/lmem_switch, hw/unittest/mem_unit,
              hw/unittest/Makefile, sw/common/mbar_ref.h, hw/rtl/dlmem/VX_mbar_waiters.sv,
              hw/unittest/mbar_waiters, hw/rtl/mem/VX_local_mem.sv, hw/rtl/core/VX_lsu_slice.sv]
  # The cp.async completion unit (RV64, mbarriers): per-warp completion FIFO
  # full, out-of-order store acks, group boundaries and wait_group, the
  # mbarrier arrive only after the data, and zero fill, over five warp,
  # thread and LSU-lane shapes and two seeds each.
  - id: hw-cpa-unit
    via: script
    xlen: [64]
    run: "make -C hw/unittest run-cpa-unit"
    touches: [hw/rtl/core/VX_cpa_unit.sv, hw/unittest/cpa_unit, hw/rtl/VX_gpu_pkg.sv, hw/unittest/Makefile]
  # The bulk async-group unit (RV64, DXA with mbarriers): directed timing of
  # the waits, commits, retirement and unlock pulses, the stalls at 8 committed
  # groups and 63 pending operations, and random operations, commits and waits
  # against out-of-order read and write completions, at 4, 8 and 16 warps.
  - id: hw-bg-unit
    via: script
    xlen: [64]
    run: "make -C hw/unittest run-bg-unit"
    touches: [hw/rtl/core/VX_bg_unit.sv, hw/unittest/bg_unit, hw/rtl/dxa/VX_dxa_pkg.sv, hw/rtl/VX_gpu_pkg.sv,
              hw/unittest/Makefile, hw/rtl/dlmem/VX_dlmem_pkg.sv, hw/rtl/libs, hw/unittest/common.mk]
  # CTA dispatcher and KMU: slot placement across launches, each launch opening
  # at slot 0 as SimX's does, with 4 and 8 CTA slots. In the xlen-64 tree the
  # same benches also run in DLMEM builds: the cluster rank on every launch beat
  # and through the dispatcher's CSR port. The `hw` lane only builds them.
  - id: hw-cta
    via: script
    run: "make -C hw/unittest run-cta"
    touches: [hw/rtl/core/VX_cta_dispatch.sv, hw/rtl/VX_kmu.sv, hw/rtl/VX_gpu_pkg.sv,
              hw/unittest/cta_dispatcher, hw/unittest/kmu, hw/unittest/Makefile]
  # Distributed local memory units (RV64 only): the cluster network at every
  # socket shape, checked packet for packet against the SimX model, then the
  # units the later steps add.
  - id: hw-dlmem
    via: script
    xlen: [64]
    run: "make -C hw/unittest run-dlmem"
    touches: [hw/rtl/dlmem, hw/rtl/VX_gpu_pkg.sv, hw/rtl/libs/VX_stream_xbar.sv,
              hw/rtl/core/VX_mem_unit.sv, hw/rtl/core/VX_core.sv, hw/rtl/VX_socket.sv,
              hw/rtl/VX_cluster.sv, hw/unittest/dlmem_noc, hw/unittest/dlmem_ep,
              hw/unittest/dlmem_xlate, hw/unittest/core, hw/unittest/Makefile,
              sim/simx/dlmem, sim/simx/types.h, sim/simx/cta_dispatcher,
              tests/unittest/dlmem_noc, tests/unittest/dlmem_ep,
              tests/unittest/dlmem_xlate, hw/rtl/VX_define.vh, sw/common/mbar_ref.h]
  # Last-level cache bank (VX_cache_top): a held fill released at every cycle
  # offset around a racing atomic, store or load (also with memory refusing
  # requests), loads replaying ahead of an atomic's writeback while responses
  # stall, then randomized loads, stores, atomics and LR/SC against a
  # reference memory, in nine parameter sets, two with atomics compiled out.
  # The `hw` lane only builds the cache testbench.
  - id: hw-cache
    via: script
    run: "make -C hw/unittest run-cache"
    touches: [hw/rtl/cache, hw/rtl/VX_gpu_pkg.sv, hw/unittest/cache, hw/unittest/Makefile]
  # TCU FEDP datapath: the `hw` lane only builds it; this lane executes tcu_fedp
  # per format (native TFR + DPI). touches gates it on tcu changes.
  - id: hw-tcu
    via: script
    run: "make -C hw/unittest run-tcu"
    touches: [hw/rtl/tcu, hw/unittest/tcu_fedp, sw/common/tcu_fedp_ref.h, hw/dpi/dpi_tcu.cpp,
              hw/dpi/dpi_tcu.vh, hw/rtl/VX_define.vh, hw/rtl/VX_gpu_pkg.sv, VX_config.toml]
  # Same native-TFR formats with the multipliers mapped onto DSP48 (USE_DSP=1) —
  # the FPGA-synthesis path, off by default in sim. Bit-identical to LUT by
  # contract, so a mismatch is a DSP-packing bug.
  - id: hw-tcu-dsp
    via: script
    run: "make -C hw/unittest run-tcu-dsp"
    touches: [hw/rtl/tcu, hw/unittest/tcu_fedp, sw/common/tcu_fedp_ref.h, hw/rtl/VX_define.vh,
              hw/rtl/VX_gpu_pkg.sv, VX_config.toml]
  # Tile buffers reading operands through H100 wgmma descriptors (RV64): four
  # blocks replay WGMMA micro-op sequences against a random local memory behind
  # a random-latency, back-pressured read port, with random descriptors (every
  # swizzle mode, K- and MN-major A and B, 16- and 8-bit elements, multi-atom
  # LBO/SBO, starts across 256 KB), random nonzero slot bases, warpgroups
  # drifting apart, pairs of blocks on different descriptors and memory
  # rewritten under unchanged descriptors; every operand word checked against
  # sw/common/tcu_desc_ref.h, with a coverage check per mode, major and size.
  - id: hw-tcu-tbuf
    via: script
    xlen: [64]
    run: "make -C hw/unittest run-tcu-tbuf"
    touches: [hw/rtl/tcu/VX_tcu_tbuf.sv, hw/rtl/tcu/VX_tcu_abuf.sv, hw/rtl/tcu/VX_tcu_bbuf.sv,
              hw/rtl/tcu/VX_tcu_smem_addr.sv, hw/rtl/tcu/VX_tcu_pkg.sv, hw/rtl/VX_gpu_pkg.sv,
              hw/rtl/VX_define.vh, hw/rtl/libs/VX_mem_bus_arb.sv, hw/rtl/libs/VX_dp_ram.sv,
              hw/unittest/tcu_tbuf, hw/unittest/common.mk, hw/unittest/Makefile,
              sw/common/tcu_desc_ref.h, sw/common/dxa_ref.h]
  # The WGMMA CTA gate of the shared tile buffers (VX_tcu_lockstep): four
  # blocks present WGMMAs of different CTAs; directed cases pin the fire
  # cycles of same-cycle starts (A,B), (A,B,A), (B,A,A,B), (A,A,A,A), a block
  # mid-expansion against a lower block that starts, a lower block that is
  # itself deferred and alternating CTAs, then 300 random runs with
  # downstream stalls; every run must make progress and never hold two
  # blocks inside WGMMAs of different CTAs. Without and, at XLEN 64, with the
  # H100 knob.
  - id: hw-tcu-lockstep
    via: script
    run: "make -C hw/unittest run-tcu-lockstep"
    touches: [hw/rtl/tcu/VX_tcu_lockstep.sv, hw/rtl/tcu/VX_tcu_pkg.sv, hw/rtl/VX_gpu_pkg.sv,
              hw/rtl/VX_define.vh, hw/unittest/tcu_lockstep, hw/unittest/common.mk,
              hw/unittest/Makefile]
  # DXA core: legacy multicast copies through VX_dxa_core with dense and
  # sparse cta masks; the receiver of bit r gets the tile at issuer + r x the
  # stride and its barrier release at barrier + r. The `hw` lane above only
  # builds this bench.
  - id: hw-dxa-core
    via: script
    run: "make -C hw/unittest/dxa_core clean && make -C hw/unittest/dxa_core run"
    touches: [hw/rtl/dxa, hw/rtl/VX_gpu_pkg.sv, hw/rtl/VX_define.vh, hw/unittest/dxa_core,
              hw/unittest/common.mk, sw/common/dxa_ref.h, sw/common/dxa_tmap.h, sw/common/dxa_meta.h,
              sw/common/amo_ref.h]
  # DXA bulk copy (RV64, DXA with mbarriers): the engine's LMEM line reader at
  # DMA words narrower than, equal to and wider than a line, under random
  # back-pressure and response delay; byte-exact memory and completion attr; then
  # the throughput of 4 KB copies, aligned and misaligned, at both read latencies.
  - id: hw-dxa-bulk
    via: script
    xlen: [64]
    run: "make -C hw/unittest run-dxa-bulk"
    touches: &dxa_bulk_bench_touches [hw/rtl/dxa, hw/rtl/VX_gpu_pkg.sv, hw/rtl/VX_define.vh,
              hw/rtl/dlmem/VX_dlmem_pkg.sv, hw/unittest/dxa_core, hw/unittest/Makefile,
              hw/unittest/common.mk, sw/common/dxa_ref.h, sw/common/dxa_tmap.h, sw/common/dxa_meta.h,
              hw/rtl/dlmem/VX_dlmem_row_egress.sv, sw/common/amo_ref.h]
  # The same bench with 4 cores, so a cluster holds 4 blocks and the cluster
  # multicast vectors (masks 0b11 and 0b1010, a multicast global bulk load) run.
  - id: hw-dxa-bulk-mc
    via: script
    xlen: [64]
    run: "make -C hw/unittest/dxa_core clean && make -C hw/unittest/dxa_core CONFIGS='-DVX_CFG_EXT_DLMEM_ENABLE -DVX_CFG_EXT_A_ENABLE -DVX_CFG_EXT_MBAR_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_NUM_CORES=4' && make -C hw/unittest/dxa_core run CONFIGS='-DVX_CFG_EXT_DLMEM_ENABLE -DVX_CFG_EXT_A_ENABLE -DVX_CFG_EXT_MBAR_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_NUM_CORES=4' && make -C hw/unittest/dxa_core clean"
    touches: *dxa_bulk_bench_touches
  # Float and inc/dec atomics (RV64 only): the float unit against amo_ref at
  # three latencies, the last-level cache bank and the local-memory banks with
  # the new ops (a float op at a bank aborts at the site assert), the DLMEM
  # endpoints and translation with the 5-bit op, then core and memory-unit lint.
  # The DXA bench at 32 lanes with the H100 knob: a 256-byte local-memory
  # word, every swizzle as two 128-byte rows per word, with a block base 128
  # bytes off a word.
  - id: hw-dxa-bulk-h100
    via: script
    xlen: [64]
    run: "make -C hw/unittest/dxa_core clean && make -C hw/unittest/dxa_core CONFIGS='-DVX_CFG_EXT_DLMEM_ENABLE -DVX_CFG_EXT_A_ENABLE -DVX_CFG_EXT_MBAR_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_NUM_CORES=4 -DVX_CFG_NUM_THREADS=32 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_TCU_H100_ENABLE' && make -C hw/unittest/dxa_core run CONFIGS='-DVX_CFG_EXT_DLMEM_ENABLE -DVX_CFG_EXT_A_ENABLE -DVX_CFG_EXT_MBAR_ENABLE -DVX_CFG_EXT_DXA_ENABLE -DVX_CFG_NUM_CORES=4 -DVX_CFG_NUM_THREADS=32 -DVX_CFG_ISSUE_WIDTH=4 -DVX_CFG_EXT_TCU_ENABLE -DVX_CFG_TCU_WGMMA_ENABLE -DVX_CFG_TCU_H100_ENABLE' && make -C hw/unittest/dxa_core clean"
    touches: *dxa_bulk_bench_touches
  - id: hw-fpamo
    via: script
    xlen: [64]
    run: "make -C hw/unittest run-fpamo"
    touches: [hw/rtl/cache, hw/rtl/mem, hw/rtl/dlmem, hw/rtl/core/VX_decode.sv,
              hw/rtl/VX_gpu_pkg.sv, hw/rtl/VX_define.vh, hw/syn/hardfloat.mk,
              third_party/hardfloat, sw/common/amo_ref.h, hw/unittest/amo_fpu,
              hw/unittest/cache, hw/unittest/local_mem, hw/unittest/dlmem_ep,
              hw/unittest/dlmem_xlate, hw/unittest/Makefile, hw/unittest/common.mk,
              tests/unittest/dlmem_ep]
  # The FPAMO golden model: hand vectors, then every row of the H100
  # measurements in tests/unittest/amo_ref/h100_atomics.csv.gz.
  - id: sw-amo-ref
    via: script
    run: "make -C tests/unittest/amo_ref run"
    touches: [sw/common/amo_ref.h, tests/unittest/amo_ref, tests/regression/atomic_fp/probe_csv.h]
  # The mbarrier golden model: the H100 scripts of the semantics probe
  # replayed through mbar_ref, every pending count and test_wait
  # result equal to the H100's; then arrive_drop and noComplete at their edges
  # and their two errors.
  - id: sw-mbar-ref
    via: script
    run: "make -C tests/unittest/mbar_ref run"
    touches: [sw/common/mbar_ref.h, tests/unittest/mbar_ref, tests/regression/mbar_ops/scripts.h,
              tests/regression/mbar_ops/common.h]
  # The DXA golden model: the PTX §5.5.7 swizzle tables cell for cell, the
  # three §5.5.4 im2col examples pixel for pixel, the complete_tx counts,
  # per-element fill with signed coordinates and element strides, the
  # encodings and the order of the asserts; the stores' byte map, the
  # reduction tables and semantics, the store and bulk-group encodings.
  - id: sw-dxa-ref
    via: script
    run: "make -C tests/unittest/dxa_ref run"
    touches: [sw/common/dxa_ref.h, sw/common/dxa_tmap.h, sw/common/dxa_meta.h, sw/common/amo_ref.h,
              tests/unittest/dxa_ref]
  # The tensor-map host API against the CUDA driver API rules: every
  # cuTensorMapEncodeTiled / Im2col / ReplaceAddress rule rejected with its
  # code and accepted at its bounds, the map words against a packer written
  # from the layout table, the slot decoder on map words, and the
  # tensormap.replace helpers (each field, and a zero buffer plus every field
  # equal to the encoder's map).
  - id: sw-dxa-tmap
    via: script
    xlen: [64]
    run: "make -C tests/unittest/dxa_tmap run"
    touches: [sw/common/dxa_tmap.h, sw/common/dxa_meta.h, sw/common/dxa_ref.h, sw/common/amo_ref.h,
              sw/runtime/include/dxa.h, tests/unittest/dxa_tmap]
  # CUDA's f16/bf16/e4m3 types and f32 intrinsics (vx_cuda_fp.h): every f16
  # and bf16 pattern widened and back, f32/f64/int narrowing around every
  # midpoint, the arithmetic on specials and random operands against softfloat
  # (bf16 through f128 round-to-odd), fma with far-apart addends, the e4m3
  # table, __frsqrt_rn exhaustive on [1, 4), the approx forms within bounds.
  - id: sw-cuda-fp
    via: script
    xlen: [64]
    run: "make -C tests/unittest/cuda_fp run"
    touches: [sw/common/vx_cuda_fp.h, tests/unittest/cuda_fp]
# The wgmma descriptor golden: the PTX descriptor fields and asserts, the descriptors
# and operand layouts of the DAK and DeepGEMM kernels, the accumulator fragment rows,
# and tiles written by the DXA tensor-load model for every swizzle mode, both majors
# and 1/2/4-byte elements read back through operand_addr (bases up to 256 KB).
  - id: sw-tcu-desc
    via: script
    run: "make -C tests/unittest/tcu_desc run"
    touches: [sw/common/tcu_desc_ref.h, sw/common/dxa_ref.h, tests/unittest/tcu_desc, tests/unittest/Makefile]
  # The SimX twin of the bulk async-group unit, with the same cycle rules.
  - id: sw-bg-unit
    via: script
    xlen: [64]
    run: "make -C tests/unittest/bg_unit run"
    touches: [sim/simx/bg_unit.h, sim/simx/bg_unit.cpp, sim/simx/dxa/dxa_bg.h, sim/simx/Makefile,
              tests/unittest/bg_unit, tests/unittest/Makefile]
  # The SimX twin of the DXA descriptor cache's map entries, with one and two workers.
  - id: sw-dxa-tmap-core
    via: script
    xlen: [64]
    run: "make -C tests/unittest/dxa_tmap_core run"
    touches: [sim/simx/dxa, sim/simx/socket.cpp, sim/simx/decode.cpp, sim/simx/types.h, sim/simx/Makefile,
              sw/common/dxa_tmap.h, sw/common/dxa_ref.h, sw/common/dxa_meta.h, tests/unittest/dxa_tmap_core,
              tests/unittest/Makefile]
  # The SimX twin of the line reader at 4, 8 and 16 banks.
  - id: sw-dxa-bulk
    via: script
    xlen: [64]
    run: "make -C tests/unittest/dxa_bulk run"
    touches: [sim/simx/dxa, sim/simx/types.h, sim/simx/Makefile, tests/unittest/dxa_bulk, tests/unittest/Makefile]
  # DXA completion (RV64, DXA with mbarriers): the RTL completion unit in both
  # modes, a barrier event per copy and an mbarrier complete_tx of the box
  # bytes into the local memory, under back-pressure and in bursts; then the
  # SimX twin, which must release only once every write of the copy has
  # committed at the bank.
  - id: hw-dxa-completion
    via: script
    xlen: [64]
    run: "make -C hw/unittest run-dxa-completion"
    touches: [hw/rtl/dxa, hw/rtl/VX_gpu_pkg.sv, hw/rtl/VX_define.vh, hw/rtl/dlmem/VX_dlmem_pkg.sv,
              hw/rtl/libs/VX_fifo_queue.sv, hw/unittest/dxa_completion, hw/unittest/Makefile,
              sw/common/mbar_ref.h]
  - id: sw-dxa-compl
    via: script
    xlen: [64]
    run: "make -C tests/unittest/dxa_compl run"
    touches: [sim/simx/dxa, sim/simx/mem/local_mem, sim/simx/types.h, sim/simx/Makefile,
              sim/simx/cta_dispatcher, sim/simx/barrier_unit, tests/unittest/dxa_compl,
              tests/unittest/Makefile, sw/common/mbar_ref.h]
