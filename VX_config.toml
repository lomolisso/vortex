# Each `VX_CFG_X_ENABLE` boolean auto-generates its integer mirror `VX_CFG_X_ENABLED` (0/1); author only the boolean.

[platform]
# The H100 level counts drive these in H100 builds; today's shapes override them instead.
VX_CFG_NUM_CLUSTERS = "expr: $VX_CFG_NUM_GPCS"
VX_CFG_NUM_CORES = "expr: $VX_CFG_SMS_PER_GPC"
VX_CFG_SOCKET_SIZE = "expr: $VX_CFG_SMS_PER_TPC"

VX_CFG_RESET_DELAY = 8

# lowercase = private helper, not emitted as a VX_CFG_ macro
dpi_is_enabled = "expr: $SV_DPI"

VX_CFG_ICACHE_ENABLE = true
VX_CFG_DCACHE_ENABLE = true
VX_CFG_LMEM_ENABLE = true
VX_CFG_L2_ENABLE = false
VX_CFG_L3_ENABLE = false

[hierarchy]
# H100 organization: levels, SM memory path, HBM3; presets turn it on.
VX_CFG_H100_ORG_ENABLE = false

# Compute tree: partition > GPC > CPC > TPC > SM.
VX_CFG_NUM_PARTITIONS = 1
VX_CFG_GPCS_PER_PARTITION = 1
VX_CFG_CPCS_PER_GPC = 1
VX_CFG_TPCS_PER_CPC = 1
VX_CFG_SMS_PER_TPC = 1

# Memory tree: partition > MP > LTC > L2 slice (one DRAM channel per slice).
VX_CFG_MPS_PER_PARTITION = 1
VX_CFG_LTCS_PER_MP = 1
VX_CFG_SLICES_PER_LTC = 1

VX_CFG_NUM_GPCS = "expr: $VX_CFG_NUM_PARTITIONS * $VX_CFG_GPCS_PER_PARTITION"
VX_CFG_SMS_PER_GPC = "expr: $VX_CFG_CPCS_PER_GPC * $VX_CFG_TPCS_PER_CPC * $VX_CFG_SMS_PER_TPC"
VX_CFG_NUM_SLICES = "expr: $VX_CFG_NUM_PARTITIONS * $VX_CFG_MPS_PER_PARTITION * $VX_CFG_LTCS_PER_MP * $VX_CFG_SLICES_PER_LTC"

[[check]]
NUM_PARTITIONS_POW2 = ["expr: is_pow2($VX_CFG_NUM_PARTITIONS)", "VX_CFG_NUM_PARTITIONS must be a power of two >= 1"]
GPCS_PER_PARTITION_POW2 = ["expr: is_pow2($VX_CFG_GPCS_PER_PARTITION)", "VX_CFG_GPCS_PER_PARTITION must be a power of two >= 1"]
CPCS_PER_GPC_POW2 = ["expr: is_pow2($VX_CFG_CPCS_PER_GPC)", "VX_CFG_CPCS_PER_GPC must be a power of two >= 1"]
TPCS_PER_CPC_POW2 = ["expr: is_pow2($VX_CFG_TPCS_PER_CPC)", "VX_CFG_TPCS_PER_CPC must be a power of two >= 1"]
SMS_PER_TPC_POW2 = ["expr: is_pow2($VX_CFG_SMS_PER_TPC)", "VX_CFG_SMS_PER_TPC must be a power of two >= 1"]
MPS_PER_PARTITION_POW2 = ["expr: is_pow2($VX_CFG_MPS_PER_PARTITION)", "VX_CFG_MPS_PER_PARTITION must be a power of two >= 1"]
LTCS_PER_MP_POW2 = ["expr: is_pow2($VX_CFG_LTCS_PER_MP)", "VX_CFG_LTCS_PER_MP must be a power of two >= 1"]
SLICES_PER_LTC_POW2 = ["expr: is_pow2($VX_CFG_SLICES_PER_LTC)", "VX_CFG_SLICES_PER_LTC must be a power of two >= 1"]
E12_SM_XLEN64 = ["expr: not $VX_CFG_H100_SM_ENABLE or $VX_CFG_XLEN == 64", "the H100 SM path requires XLEN 64"]
SM_LANES_SPAN_LINE = ["expr: not $VX_CFG_H100_SM_ENABLE or $VX_CFG_NUM_LSU_LANES * ($VX_CFG_XLEN / 8) >= $VX_CFG_DCACHE_LINE_SIZE", "the H100 SM path needs the LSU lanes to cover an L1 line (NUM_LSU_LANES x XLEN/8 >= DCACHE_LINE_SIZE)"]
SM_DATAPATH_POW2 = ["expr: not $VX_CFG_H100_SM_ENABLE or (is_pow2($VX_CFG_SM_DATAPATH_BYTES) and $VX_CFG_SM_DATAPATH_BYTES >= 4)", "VX_CFG_SM_DATAPATH_BYTES must be a power of two >= 4"]
LMEM_BANK_BYTES_OK = ["expr: not $VX_CFG_H100_SM_ENABLE or (is_pow2($VX_CFG_LMEM_BANK_BYTES) and $VX_CFG_LMEM_BANK_BYTES <= $VX_CFG_XLEN / 8)", "VX_CFG_LMEM_BANK_BYTES must be a power of two <= XLEN/8"]
LMEM_PORT_IS_DATAPATH = ["expr: not $VX_CFG_H100_SM_ENABLE or $VX_CFG_LMEM_NUM_BANKS * $VX_CFG_LMEM_BANK_BYTES == $VX_CFG_SM_DATAPATH_BYTES", "the shared-memory banks must span the SM datapath"]
LMEM_PORT_SWIZZLE = ["expr: not $VX_CFG_H100_SM_ENABLE or not ($VX_CFG_EXT_DXA_ENABLE or $VX_CFG_TCU_H100_ENABLE) or $VX_CFG_LMEM_PORT_BYTES >= $lmem_swizzle_span", "with DXA or TCU_H100 the shared-memory port must cover a 128-B swizzle row"]
SMEM_FITS_DESC = ["expr: not $VX_CFG_H100_SM_ENABLE or $VX_CFG_SMEM_PER_SM_MAX <= $VX_CFG_LMEM_DESC_REACH_BYTES", "VX_CFG_SMEM_PER_SM_MAX must fit the wgmma descriptor reach (256 KiB in the H100 descriptor format, 64 KiB in the 16-bit byte offset of the non-H100 format; WGMMA on the H100 SM path needs VX_CFG_TCU_H100_ENABLE)"]
SMEM_PER_CTA_POS = ["expr: not $VX_CFG_H100_SM_ENABLE or $VX_CFG_SMEM_PER_CTA_MAX > 0", "VX_CFG_SMEM_PER_CTA_MAX must be > 0"]
LMEM_SLOT_ALIGN_POW2 = ["expr: not $VX_CFG_H100_SM_ENABLE or is_pow2($VX_CFG_LMEM_SLOT_ALIGN)", "VX_CFG_LMEM_SLOT_ALIGN must be a power of two"]
LMEM_SLOT_ALIGN_MET = ["expr: not $VX_CFG_H100_SM_ENABLE or ($VX_CFG_LMEM_NUM_BANKS * ($VX_CFG_XLEN / 8)) % $VX_CFG_LMEM_SLOT_ALIGN == 0", "the CTA slot alignment must be a multiple of VX_CFG_LMEM_SLOT_ALIGN"]
L1_LINE_IS_DATAPATH = ["expr: not $VX_CFG_H100_SM_ENABLE or $VX_CFG_DCACHE_LINE_SIZE == $VX_CFG_SM_DATAPATH_BYTES", "the L1 line must equal the SM datapath"]
L1_SECTOR_OK = ["expr: not $VX_CFG_H100_SM_ENABLE or (is_pow2($VX_CFG_DCACHE_SECTOR_SIZE) and $VX_CFG_DCACHE_LINE_SIZE % $VX_CFG_DCACHE_SECTOR_SIZE == 0 and $VX_CFG_SM_EGRESS_BEAT == $VX_CFG_DCACHE_SECTOR_SIZE)", "the L1 sector must be a power of two dividing the line and equal to the egress beat"]
L1_PROTECT_LT_WAYS = ["expr: not $VX_CFG_H100_SM_ENABLE or ($VX_CFG_L1_REPL_PROTECT_PCT >= 0 and $VX_CFG_L1_REPL_PROTECT_PCT <= 99 and $VX_CFG_L1_REPL_PROTECTED >= 1 and $VX_CFG_L1_REPL_PROTECTED < $VX_CFG_DCACHE_NUM_WAYS)", "the protected newest ways must be >= 1 and fewer than the ways"]
L1_WRITE_THROUGH = ["expr: not $VX_CFG_H100_SM_ENABLE or $VX_CFG_DCACHE_WRITEBACK == 0", "the H100 L1 is write-through"]
SM_READ_LINES_POW2 = ["expr: not $VX_CFG_H100_SM_ENABLE or is_pow2($VX_CFG_SM_MAX_READ_LINES)", "VX_CFG_SM_MAX_READ_LINES must be a power of two"]
SM_EGRESS_BEATS = ["expr: not $VX_CFG_H100_SM_ENABLE or ($VX_CFG_SM_EGRESS_BYTES >= $VX_CFG_SM_EGRESS_BEAT and $VX_CFG_SM_EGRESS_BYTES % $VX_CFG_SM_EGRESS_BEAT == 0)", "VX_CFG_SM_EGRESS_BYTES must be a multiple of the beat"]
SM_HB_POSITIVE = ["expr: not $VX_CFG_H100_SM_ENABLE or ($VX_CFG_SM_HB_WRITE_SECTOR >= 1 and $VX_CFG_SM_HB_WRITE_MASKED >= 1 and $VX_CFG_SM_HB_READ_LINE >= 1 and $VX_CFG_SM_HB_PREFETCH_LINE >= 1 and $VX_CFG_SM_HB_ATOM_LANE >= 1 and $VX_CFG_SM_HB_DSMEM_SLOT >= 1 and $VX_CFG_SM_HB_DSMEM_LD_LINE >= 1 and $VX_CFG_SM_HB_TMA_ST_SECTOR >= 1 and $VX_CFG_SM_HB_MBAR >= 1)", "every egress item costs at least one half-beat"]
SM_REQ_FIFO_BEATS = ["expr: not $VX_CFG_H100_SM_ENABLE or ($VX_CFG_SM_REQ_FIFO_BYTES >= $VX_CFG_DCACHE_LINE_SIZE and $VX_CFG_SM_REQ_FIFO_BYTES % $VX_CFG_SM_EGRESS_BEAT == 0)", "VX_CFG_SM_REQ_FIFO_BYTES must hold a line and be a multiple of the beat"]
SM_RSP_SLOTS_POW2 = ["expr: not $VX_CFG_H100_SM_ENABLE or is_pow2($VX_CFG_SM_RSP_QUEUE_SLOTS)", "VX_CFG_SM_RSP_QUEUE_SLOTS must be a power of two"]
SM_ISSUE_PERMILLE = ["expr: not $VX_CFG_H100_SM_ENABLE or ($VX_CFG_SM_SECTOR_ISSUE_W_PERMILLE >= 1 and $VX_CFG_SM_SECTOR_ISSUE_W_PERMILLE <= 1000 and $VX_CFG_SM_SECTOR_ISSUE_R_PERMILLE >= 1 and $VX_CFG_SM_SECTOR_ISSUE_R_PERMILLE <= 1000)", "single-sector issue rates must be 1..1000 per mille"]
SM_INGRESS_BEATS = ["expr: not $VX_CFG_H100_SM_ENABLE or ($VX_CFG_SM_INGRESS_BYTES >= $VX_CFG_SM_EGRESS_BEAT and $VX_CFG_SM_INGRESS_BYTES % $VX_CFG_SM_EGRESS_BEAT == 0 and $VX_CFG_SM_INGRESS_FILL_WEIGHT >= 1 and $VX_CFG_SM_INGRESS_DSMEM_WEIGHT >= 1)", "the ingress must be whole beats and both weights >= 1"]
SM2SM_INJ_FITS = ["expr: not $VX_CFG_H100_SM_ENABLE or ($VX_CFG_SM2SM_INJ_CREDITS >= 1 and $VX_CFG_SM2SM_INJ_CREDITS <= $VX_CFG_SM2SM_INJ_RETURN and $VX_CFG_SM2SM_INJ_CREDITS * $VX_CFG_N5_SLOT_BYTES <= $VX_CFG_SM2SM_INJ_RETURN * $VX_CFG_SM_EGRESS_BYTES)", "SM-to-SM injection credits must be 1..return and not outrun the egress"]
SM2SM_EJECT_OK = ["expr: not $VX_CFG_H100_SM_ENABLE or ($VX_CFG_SM2SM_EJECT_BYTES <= $VX_CFG_SM_INGRESS_BYTES and $VX_CFG_SM2SM_EJECT_BYTES % $VX_CFG_N5_SLOT_BYTES == 0)", "VX_CFG_SM2SM_EJECT_BYTES must be whole slots within the ingress"]
N5_SLOT_DIVIDES_LINE = ["expr: not $VX_CFG_H100_SM_ENABLE or $VX_CFG_N5_LINE_BYTES % $VX_CFG_N5_SLOT_BYTES == 0", "the SM-to-SM slot must divide the line"]
N5_MIN_SLOTS_OK = ["expr: not $VX_CFG_H100_SM_ENABLE or ($VX_CFG_N5_MIN_SLOTS >= 1 and $VX_CFG_N5_MIN_SLOTS <= $VX_CFG_N5_LINE_BYTES / $VX_CFG_N5_SLOT_BYTES)", "VX_CFG_N5_MIN_SLOTS must be 1..slots per line"]
N5_EXTRAS_HALFBEAT = ["expr: not $VX_CFG_H100_SM_ENABLE or ($VX_CFG_N5_ASYNC_EXTRA_BYTES_V4 % ($VX_CFG_SM_EGRESS_BEAT / 2) == 0 and $VX_CFG_N5_ASYNC_EXTRA_BYTES_B32 % ($VX_CFG_SM_EGRESS_BEAT / 2) == 0 and $VX_CFG_N5_REDASYNC_EXTRA_BYTES % ($VX_CFG_SM_EGRESS_BEAT / 2) == 0)", "async extra bytes must be whole half-beats"]
DLMEM_INGRESS_SLOTS_POW2 = ["expr: not $VX_CFG_H100_SM_ENABLE or is_pow2($VX_CFG_DLMEM_INGRESS_SLOTS)", "VX_CFG_DLMEM_INGRESS_SLOTS must be a power of two"]
DLMEM_STORE_WINDOW_LINE = ["expr: not $VX_CFG_H100_SM_ENABLE or $VX_CFG_DLMEM_STORE_WINDOW_BYTES >= $VX_CFG_DCACHE_LINE_SIZE", "the remote-store window must hold a line"]
DXA_ONE_PER_SM = ["expr: not $VX_CFG_H100_SM_ENABLE or not $VX_CFG_EXT_DXA_ENABLE or $VX_CFG_NUM_DXA_CORES == $VX_CFG_SOCKET_SIZE", "the H100 SM path has one DXA engine per SM"]

[h100_ref]
# H100 NVL (GPU 3) constants for scaling formulas, not knobs; integers only (no floats in expr or #if).
VX_CFG_H100_NUM_SMS = 132                            # 01/spec.md §2 (chip.sms_enabled)
VX_CFG_H100_NUM_SLICES = 94                          # 01/spec.md §2 (L2 slices)
VX_CFG_H100_FB_USABLE_BYTES = 0x1745770000           # 07/spec.md §1 (org.framebuffer_usable, 93.09 GiB)
VX_CFG_H100_DRAM_CHANNEL_BITS = 64                   # 07/spec.md §1 (org.bus_bits_per_slice)
VX_CFG_H100_PEAK_MEM_BW_MBPS = 3938000               # 07/spec.md §1 (peak bandwidth, 3938 GB/s)
VX_CFG_H100_SM_CLOCK_MHZ = 1635                      # 19/spec.md §1 (clock.sm_lock)
VX_CFG_H100_DRAM_CLOCK_MHZ = 2619                    # 19/spec.md §0 (dram__cycles_elapsed; 18 noc.hbm.dram_clock)
VX_CFG_H100_L2_CLOCK_MHZ = 1559                      # 19/spec.md §0 (lts__cycles_elapsed)
VX_CFG_H100_CTA_DISPATCH_PS = 550                    # 03/spec.md §5 (launch.dispatch_per_cluster_of_1 note: plain CTA 0.55 ns)
VX_CFG_H100_CLUSTER_DISPATCH_PS = 2500               # 03/spec.md §5 (launch.dispatch_per_cluster_of_1, 2.5 ns)
VX_CFG_H100_CTA_REFILL_NS = 220                      # 03/spec.md §5 (launch.refill_gap.plain)
VX_CFG_H100_CTA_REFILL_CLUSTER1_NS = 260             # 03/spec.md §5 (launch.refill_gap, K = 1)
VX_CFG_H100_CTA_REFILL_CLUSTER_NS = 290              # 03/spec.md §5 (launch.refill_gap.cluster, K = 2-16)

[compute]
# Global SM index: gpc * NUM_CORES + (tpc_slot * CPCS_PER_GPC + cpc) * SOCKET_SIZE + sm (sw/common/vx_hier.h).
VX_CFG_NUM_SMS = "expr: $VX_CFG_NUM_CLUSTERS * $VX_CFG_NUM_CORES"
VX_CFG_SMS_PER_CPC = "expr: $VX_CFG_NUM_CORES // $VX_CFG_CPCS_PER_GPC"
# Cluster sizes 9-16 need the non-portable attribute; 16 is also the ctaMask width (03/spec.md §1, 14/spec.md §1).
VX_CFG_CLUSTER_MAX_NONPORTABLE = 16
# The CTAs of one cluster on distinct SMs (03/spec.md §2 item 3); off keeps a cluster on one core.
VX_CFG_CLUSTER_DISTINCT_SMS_ENABLE = "expr: $VX_CFG_H100_ORG_ENABLE"
# H100: least-occupied SM first, then the lowest in-GPC index; SPREAD: round-robin from the last placed core.
VX_CFG_CLUSTER_PLACEMENT = "expr: 'H100' if $VX_CFG_H100_ORG_ENABLE else 'SPREAD'"
# GPC the cluster round-robin starts from at every kernel start (03/spec.md §4: one cluster lands in GPC 0).
VX_CFG_CLUSTER_GPC_START = 0
# CTA slots per SM (01/spec.md §8, sm.max_blocks) and per SM for a cluster launch (03/spec.md §2 item 5).
VX_CFG_SM_MAX_BLOCKS = 32
VX_CFG_SM_MAX_CLUSTER_BLOCKS = 8
VX_CFG_MAX_CTAS_PER_SM = "expr: min($VX_CFG_SM_MAX_BLOCKS, $VX_CFG_NUM_WARPS) if $VX_CFG_H100_ORG_ENABLE else $VX_CFG_NUM_WARPS"
VX_CFG_MAX_CTAS_PER_SM_CLUSTER = "expr: min($VX_CFG_SM_MAX_CLUSTER_BLOCKS, $VX_CFG_MAX_CTAS_PER_SM) if $VX_CFG_H100_ORG_ENABLE else $VX_CFG_MAX_CTAS_PER_SM"
# Register stage on every channel between two SimX execution domains, carried by the RTL on the same edge;
# bounded by the shortest crossing edge, the launch and credit edges into a GPC (one register stage each).
VX_CFG_DOMAIN_BOUNDARY_DELAY = 1
# CTA-done path from the gbar unit to the admission mirror: its output register, one fan-in stage per
# level with several inputs (SMs of a TPC, TPCs of a GPC), and the GPC domain crossing.
VX_CFG_CTA_DONE_LINK_DELAY = "expr: 1 + ($VX_CFG_SOCKET_SIZE > 1) + ($VX_CFG_NUM_CORES > $VX_CFG_SOCKET_SIZE) + $VX_CFG_DOMAIN_BOUNDARY_DELAY * $VX_CFG_H100_ORG_ENABLED"

[[check]]
ORG_ALIASES = ["expr: ($VX_CFG_NUM_GPCS == 1 and $VX_CFG_SMS_PER_GPC == 1) or ($VX_CFG_NUM_CLUSTERS == $VX_CFG_NUM_GPCS and $VX_CFG_NUM_CORES == $VX_CFG_SMS_PER_GPC and $VX_CFG_SOCKET_SIZE == $VX_CFG_SMS_PER_TPC)", "set either the H100 level counts or NUM_CLUSTERS/NUM_CORES/SOCKET_SIZE, not both"]
MAX_NUM_SMS = ["expr: $VX_CFG_NUM_SMS <= 1024", "VX_CFG_NUM_SMS (NUM_CLUSTERS x NUM_CORES) must be at most 1024"]
CPC_DIVIDES = ["expr: $VX_CFG_CPCS_PER_GPC == 1 or $VX_CFG_NUM_CORES % ($VX_CFG_SOCKET_SIZE * $VX_CFG_CPCS_PER_GPC) == 0", "VX_CFG_CPCS_PER_GPC must divide the TPCs of a GPC (NUM_CORES / SOCKET_SIZE)"]
GPC_START_RANGE = ["expr: $VX_CFG_CLUSTER_GPC_START >= 0 and $VX_CFG_CLUSTER_GPC_START < $VX_CFG_NUM_CLUSTERS", "VX_CFG_CLUSTER_GPC_START must name a GPC (0 to NUM_CLUSTERS - 1)"]
CTAS_PER_SM_RANGE = ["expr: $VX_CFG_SM_MAX_BLOCKS >= 1 and $VX_CFG_SM_MAX_BLOCKS <= 64 and $VX_CFG_MAX_CTAS_PER_SM >= 1 and $VX_CFG_MAX_CTAS_PER_SM <= $VX_CFG_NUM_WARPS and $VX_CFG_MAX_CTAS_PER_SM <= 64", "VX_CFG_MAX_CTAS_PER_SM (from VX_CFG_SM_MAX_BLOCKS) must be between 1 and min(NUM_WARPS, 64)"]
CLUSTER_CTAS_RANGE = ["expr: $VX_CFG_SM_MAX_CLUSTER_BLOCKS >= 1 and $VX_CFG_MAX_CTAS_PER_SM_CLUSTER >= 1 and $VX_CFG_MAX_CTAS_PER_SM_CLUSTER <= $VX_CFG_MAX_CTAS_PER_SM", "VX_CFG_MAX_CTAS_PER_SM_CLUSTER (from VX_CFG_SM_MAX_CLUSTER_BLOCKS) must be between 1 and VX_CFG_MAX_CTAS_PER_SM"]
NONPORTABLE_RANGE = ["expr: is_pow2($VX_CFG_CLUSTER_MAX_NONPORTABLE) and $VX_CFG_CLUSTER_MAX_NONPORTABLE <= 16", "VX_CFG_CLUSTER_MAX_NONPORTABLE must be a power of two of at most 16"]
MAX_CLUSTER_RANGE = ["expr: $VX_CFG_DLMEM_MAX_CLUSTER >= 1 and $VX_CFG_DLMEM_MAX_CLUSTER <= min($VX_CFG_CLUSTER_MAX_NONPORTABLE, $VX_CFG_NUM_CORES)", "DLMEM_MAX_CLUSTER must be between 1 and the cores of a cluster"]
BOUNDARY_DELAY_MIN = ["expr: $VX_CFG_DOMAIN_BOUNDARY_DELAY >= 1", "VX_CFG_DOMAIN_BOUNDARY_DELAY must be at least 1"]
BOUNDARY_DELAY_MAX = ["expr: $VX_CFG_DOMAIN_BOUNDARY_DELAY <= 1", "VX_CFG_DOMAIN_BOUNDARY_DELAY must be at most 1, the one register stage of the launch and credit edges into a GPC"]


[sm]
# The H100 SM memory path (L1, shared-memory banks, SM ports); on with the organization.
VX_CFG_H100_SM_ENABLE = "expr: $VX_CFG_H100_ORG_ENABLE"
VX_CFG_SM_DATAPATH_BYTES = 128                   # 05/spec.md §3.4, §4.4, §9.1
VX_CFG_L1_REPL_PROTECT_PCT = 25                  # 05/spec.md §4.6
VX_CFG_L1_REPL_PROTECTED = "expr: max(1, $VX_CFG_DCACHE_NUM_WAYS * $VX_CFG_L1_REPL_PROTECT_PCT / 100)"
VX_CFG_SM_MAX_READ_LINES = 128                   # 18/spec.md §0.6 R2, §1.6
# Egress: one in-order request FIFO drained SM_EGRESS_BYTES per cycle; item costs in half-beats.
VX_CFG_SM_EGRESS_BYTES = 32                      # 05/spec.md §9.1
VX_CFG_SM_EGRESS_BEAT = "expr: $VX_CFG_DCACHE_SECTOR_SIZE"   # 05/spec.md §9.2
VX_CFG_SM_HB_WRITE_SECTOR = 2                    # 05/spec.md §9.2
VX_CFG_SM_HB_WRITE_MASKED = 4                    # 05/spec.md §9.2
VX_CFG_SM_HB_READ_LINE = 1                       # 05/spec.md §9.2
VX_CFG_SM_HB_PREFETCH_LINE = 2                   # 05/spec.md §9.2
VX_CFG_SM_HB_ATOM_LANE = 2                       # 05/spec.md §9.2
VX_CFG_SM_HB_DSMEM_SLOT = 2                      # 05/spec.md §9.2
VX_CFG_SM_HB_DSMEM_LD_LINE = 2                   # 05/spec.md §9.2
VX_CFG_SM_HB_TMA_ST_SECTOR = 2                   # 05/spec.md §9.2
VX_CFG_SM_HB_MBAR = 2                            # assumed: one DSMEM slot
VX_CFG_SM_REQ_FIFO_BYTES = 32768                 # 18/spec.md §A
VX_CFG_SM_RSP_QUEUE_SLOTS = 512                  # 18/spec.md §0.6 S1, §5.5
VX_CFG_SM_SECTOR_ISSUE_W_PERMILLE = 780          # 18/spec.md §1.3
VX_CFG_SM_SECTOR_ISSUE_R_PERMILLE = 670          # 18/spec.md §1.3
# Ingress: fills and DSMEM arrivals share one gate, weighted round robin.
VX_CFG_SM_INGRESS_BYTES = "expr: $VX_CFG_SM_DATAPATH_BYTES"  # 05/spec.md §9.1
VX_CFG_SM_INGRESS_FILL_WEIGHT = 5                # 05/spec.md §9.3
VX_CFG_SM_INGRESS_DSMEM_WEIGHT = 1               # 05/spec.md §9.3
VX_CFG_SM2SM_INJ_CREDITS = 4                     # 18/spec.md §5.2, §A
VX_CFG_SM2SM_INJ_RETURN = 6                      # 18/spec.md §5.2, §A
VX_CFG_SM2SM_EJECT_BYTES = 32                    # 05/spec.md §9.1

[sm_sram]
# One SRAM array per SM: shared memory from row 0 up, L1 data slots from the top row down.
VX_CFG_SM_SRAM_BYTES = 262144                    # 05/spec.md §1, §2
# Shared-memory configurations a launch may pick (KiB, ascending; repeats allowed).
VX_CFG_SMEM_CONFIG_KB_0 = 8                      # 05/spec.md §2
VX_CFG_SMEM_CONFIG_KB_1 = 16
VX_CFG_SMEM_CONFIG_KB_2 = 32
VX_CFG_SMEM_CONFIG_KB_3 = 64
VX_CFG_SMEM_CONFIG_KB_4 = 100
VX_CFG_SMEM_CONFIG_KB_5 = 132
VX_CFG_SMEM_CONFIG_KB_6 = 164
VX_CFG_SMEM_CONFIG_KB_7 = 196
VX_CFG_SMEM_CONFIG_KB_8 = 228
# Rows between the shared region and the L1 that neither uses (the H100 leaves 8192).
VX_CFG_L1_RESERVE_BYTES = 0
VX_CFG_L1_MAX_LINES = "expr: ($VX_CFG_SM_SRAM_BYTES - $VX_CFG_L1_RESERVE_BYTES - $VX_CFG_SMEM_CONFIG_KB_0 * 1024) / $VX_CFG_DCACHE_LINE_SIZE"
# L1 tags are decoupled from the data: each way points to a slot of the array.
VX_CFG_L1_TAG_BANKS = 4                          # US 10,459,861; lookups per cycle
VX_CFG_L1_TAG_WAYS = 16
VX_CFG_L1_TAG_SETS = "expr: 1 << clog2(($VX_CFG_L1_MAX_LINES + $VX_CFG_L1_TAG_WAYS - 1) / $VX_CFG_L1_TAG_WAYS)"
# 0: line mod sets; 1: XOR fold of every line-address bit.
VX_CFG_L1_INDEX_HASH = 1                         # 05/spec.md §4.6
VX_CFG_L1_VALID_BYTES = "expr: $VX_CFG_LMEM_BANK_BYTES"
# Widest tag-side SRAM macro; tag and valid macros are split by ways to stay within it.
VX_CFG_SRAM_MACRO_MAX_BITS = 256
# Port priority levels 0..3: the highest level wins, equal levels share round robin.
VX_CFG_SM_SRAM_RD_PRI_TCU = 1                    # 18/spec.md §1.2
VX_CFG_SM_SRAM_RD_PRI_DXA = 1
VX_CFG_SM_SRAM_RD_PRI_DSMEM = 1
VX_CFG_SM_SRAM_RD_PRI_AMO = 1
VX_CFG_SM_SRAM_RD_PRI_LSU = 0
VX_CFG_SM_SRAM_WR_PRI_L1FILL = 1
VX_CFG_SM_SRAM_WR_PRI_DXA = 1
VX_CFG_SM_SRAM_WR_PRI_DSMEM = 1
VX_CFG_SM_SRAM_WR_PRI_CPASYNC = 1
VX_CFG_SM_SRAM_WR_PRI_LSU = 0
VX_CFG_SM_SRAM_WF_PRI_SHARED = 0
VX_CFG_SM_SRAM_WF_PRI_GLOBAL = 0
VX_CFG_SM_SRAM_AMO_PRI_DXA = 0
VX_CFG_SM_SRAM_AMO_PRI_DSMEM = 0
VX_CFG_SM_SRAM_AMO_PRI_MBAR = 0
VX_CFG_SM_SRAM_AMO_PRI_LSU = 0
# DSMEM slots of one row merge into one row write.
VX_CFG_SM_SRAM_DSMEM_WR_BYTES = "expr: $VX_CFG_LMEM_PORT_BYTES"

[[check]]
SM_SRAM_ROWS_POW2 = ["expr: not $VX_CFG_H100_SM_ENABLE or is_pow2($VX_CFG_SM_SRAM_BYTES / $VX_CFG_SM_DATAPATH_BYTES)", "VX_CFG_SM_SRAM_BYTES must be a power-of-two number of datapath rows"]
SM_SRAM_IN_WINDOW = ["expr: not $VX_CFG_H100_SM_ENABLE or $VX_CFG_SM_SRAM_BYTES < 2 * $VX_CFG_SMEM_PER_SM_MAX", "the shared-memory window (VX_CFG_SMEM_PER_SM_MAX rounded up to a power of two) must cover the SM array (VX_CFG_SM_SRAM_BYTES)"]
SM_SRAM_FITS = ["expr: not $VX_CFG_H100_SM_ENABLE or ($VX_CFG_SM_SRAM_BYTES - $VX_CFG_L1_RESERVE_BYTES - $VX_CFG_SMEM_CONFIG_KB_8 * 1024) / $VX_CFG_DCACHE_LINE_SIZE > $VX_CFG_SM_MAX_READ_LINES", "the smallest L1 must hold more lines than can be in flight (VX_CFG_SM_SRAM_BYTES - VX_CFG_L1_RESERVE_BYTES - the largest shared config)"]
SMEM_CONFIGS_ASCENDING = ["expr: not $VX_CFG_H100_SM_ENABLE or ($VX_CFG_SMEM_CONFIG_KB_0 >= 1 and $VX_CFG_SMEM_CONFIG_KB_0 <= $VX_CFG_SMEM_CONFIG_KB_1 and $VX_CFG_SMEM_CONFIG_KB_1 <= $VX_CFG_SMEM_CONFIG_KB_2 and $VX_CFG_SMEM_CONFIG_KB_2 <= $VX_CFG_SMEM_CONFIG_KB_3 and $VX_CFG_SMEM_CONFIG_KB_3 <= $VX_CFG_SMEM_CONFIG_KB_4 and $VX_CFG_SMEM_CONFIG_KB_4 <= $VX_CFG_SMEM_CONFIG_KB_5 and $VX_CFG_SMEM_CONFIG_KB_5 <= $VX_CFG_SMEM_CONFIG_KB_6 and $VX_CFG_SMEM_CONFIG_KB_6 <= $VX_CFG_SMEM_CONFIG_KB_7 and $VX_CFG_SMEM_CONFIG_KB_7 <= $VX_CFG_SMEM_CONFIG_KB_8)", "VX_CFG_SMEM_CONFIG_KB_0..8 must be >= 1 and ascending"]
SMEM_CONFIG_MAX = ["expr: not $VX_CFG_H100_SM_ENABLE or $VX_CFG_SMEM_CONFIG_KB_8 * 1024 == $VX_CFG_SMEM_PER_SM_MAX", "VX_CFG_SMEM_CONFIG_KB_8 must equal VX_CFG_SMEM_PER_SM_MAX"]
SMEM_CONFIGS_ALIGNED = ["expr: not $VX_CFG_H100_SM_ENABLE or (($VX_CFG_SMEM_CONFIG_KB_0 * 1024) % $VX_CFG_LMEM_SLOT_ALIGN == 0 and ($VX_CFG_SMEM_CONFIG_KB_1 * 1024) % $VX_CFG_LMEM_SLOT_ALIGN == 0 and ($VX_CFG_SMEM_CONFIG_KB_2 * 1024) % $VX_CFG_LMEM_SLOT_ALIGN == 0 and ($VX_CFG_SMEM_CONFIG_KB_3 * 1024) % $VX_CFG_LMEM_SLOT_ALIGN == 0 and ($VX_CFG_SMEM_CONFIG_KB_4 * 1024) % $VX_CFG_LMEM_SLOT_ALIGN == 0 and ($VX_CFG_SMEM_CONFIG_KB_5 * 1024) % $VX_CFG_LMEM_SLOT_ALIGN == 0 and ($VX_CFG_SMEM_CONFIG_KB_6 * 1024) % $VX_CFG_LMEM_SLOT_ALIGN == 0 and ($VX_CFG_SMEM_CONFIG_KB_7 * 1024) % $VX_CFG_LMEM_SLOT_ALIGN == 0 and ($VX_CFG_SMEM_CONFIG_KB_8 * 1024) % $VX_CFG_LMEM_SLOT_ALIGN == 0)", "every shared-memory config must be a multiple of VX_CFG_LMEM_SLOT_ALIGN"]
L1_RESERVE_ROWS_OK = ["expr: not $VX_CFG_H100_SM_ENABLE or ($VX_CFG_L1_RESERVE_BYTES >= 0 and $VX_CFG_L1_RESERVE_BYTES % $VX_CFG_SM_DATAPATH_BYTES == 0)", "VX_CFG_L1_RESERVE_BYTES must be a multiple of VX_CFG_SM_DATAPATH_BYTES"]
L1_LFSR_RANGE = ["expr: not $VX_CFG_H100_SM_ENABLE or $VX_CFG_L1_MAX_LINES < 65536", "the L1 must hold fewer than 65536 lines (16-bit victim draw)"]
L1_TAG_BANKS_OK = ["expr: not $VX_CFG_H100_SM_ENABLE or (is_pow2($VX_CFG_L1_TAG_BANKS) and $VX_CFG_L1_TAG_BANKS < 2 * (($VX_CFG_L1_MAX_LINES + $VX_CFG_L1_TAG_WAYS - 1) / $VX_CFG_L1_TAG_WAYS))", "VX_CFG_L1_TAG_BANKS must be a power of two no larger than VX_CFG_L1_TAG_SETS"]
L1_TAG_WAYS_POW2 = ["expr: not $VX_CFG_H100_SM_ENABLE or is_pow2($VX_CFG_L1_TAG_WAYS)", "VX_CFG_L1_TAG_WAYS must be a power of two"]
L1_INDEX_HASH_OK = ["expr: not $VX_CFG_H100_SM_ENABLE or ($VX_CFG_L1_INDEX_HASH >= 0 and $VX_CFG_L1_INDEX_HASH <= 1)", "VX_CFG_L1_INDEX_HASH must be 0 or 1"]
L1_VALID_BYTES_OK = ["expr: not $VX_CFG_H100_SM_ENABLE or ($VX_CFG_L1_VALID_BYTES >= 1 and is_pow2($VX_CFG_L1_VALID_BYTES) and $VX_CFG_DCACHE_SECTOR_SIZE % $VX_CFG_L1_VALID_BYTES == 0)", "VX_CFG_L1_VALID_BYTES must be a power of two dividing the sector"]
SRAM_MACRO_BITS_OK = ["expr: not $VX_CFG_H100_SM_ENABLE or $VX_CFG_SRAM_MACRO_MAX_BITS >= $VX_CFG_DCACHE_LINE_SIZE / $VX_CFG_L1_VALID_BYTES", "VX_CFG_SRAM_MACRO_MAX_BITS must hold one way's valid bits"]
SM_SRAM_PRI_RANGE = ["expr: not $VX_CFG_H100_SM_ENABLE or ($VX_CFG_SM_SRAM_RD_PRI_TCU >= 0 and $VX_CFG_SM_SRAM_RD_PRI_TCU <= 3 and $VX_CFG_SM_SRAM_RD_PRI_DXA >= 0 and $VX_CFG_SM_SRAM_RD_PRI_DXA <= 3 and $VX_CFG_SM_SRAM_RD_PRI_DSMEM >= 0 and $VX_CFG_SM_SRAM_RD_PRI_DSMEM <= 3 and $VX_CFG_SM_SRAM_RD_PRI_AMO >= 0 and $VX_CFG_SM_SRAM_RD_PRI_AMO <= 3 and $VX_CFG_SM_SRAM_RD_PRI_LSU >= 0 and $VX_CFG_SM_SRAM_RD_PRI_LSU <= 3 and $VX_CFG_SM_SRAM_WR_PRI_L1FILL >= 0 and $VX_CFG_SM_SRAM_WR_PRI_L1FILL <= 3 and $VX_CFG_SM_SRAM_WR_PRI_DXA >= 0 and $VX_CFG_SM_SRAM_WR_PRI_DXA <= 3 and $VX_CFG_SM_SRAM_WR_PRI_DSMEM >= 0 and $VX_CFG_SM_SRAM_WR_PRI_DSMEM <= 3 and $VX_CFG_SM_SRAM_WR_PRI_CPASYNC >= 0 and $VX_CFG_SM_SRAM_WR_PRI_CPASYNC <= 3 and $VX_CFG_SM_SRAM_WR_PRI_LSU >= 0 and $VX_CFG_SM_SRAM_WR_PRI_LSU <= 3 and $VX_CFG_SM_SRAM_WF_PRI_SHARED >= 0 and $VX_CFG_SM_SRAM_WF_PRI_SHARED <= 3 and $VX_CFG_SM_SRAM_WF_PRI_GLOBAL >= 0 and $VX_CFG_SM_SRAM_WF_PRI_GLOBAL <= 3 and $VX_CFG_SM_SRAM_AMO_PRI_DXA >= 0 and $VX_CFG_SM_SRAM_AMO_PRI_DXA <= 3 and $VX_CFG_SM_SRAM_AMO_PRI_DSMEM >= 0 and $VX_CFG_SM_SRAM_AMO_PRI_DSMEM <= 3 and $VX_CFG_SM_SRAM_AMO_PRI_MBAR >= 0 and $VX_CFG_SM_SRAM_AMO_PRI_MBAR <= 3 and $VX_CFG_SM_SRAM_AMO_PRI_LSU >= 0 and $VX_CFG_SM_SRAM_AMO_PRI_LSU <= 3)", "every VX_CFG_SM_SRAM_*_PRI_* level must be 0..3"]
DSMEM_WR_BYTES_OK = ["expr: not $VX_CFG_H100_SM_ENABLE or ($VX_CFG_SM_SRAM_DSMEM_WR_BYTES >= $VX_CFG_N5_SLOT_BYTES and $VX_CFG_SM_SRAM_DSMEM_WR_BYTES % $VX_CFG_N5_SLOT_BYTES == 0 and $VX_CFG_SM_SRAM_DSMEM_WR_BYTES <= $VX_CFG_SM_DATAPATH_BYTES)", "VX_CFG_SM_SRAM_DSMEM_WR_BYTES must be whole SM-to-SM slots within the datapath"]
SM_SRAM_NO_VM = ["expr: not ($VX_CFG_H100_SM_ENABLE and $VX_CFG_VM_ENABLE)", "the H100 SM path keeps the L1 in the core, before the dMMU: VX_CFG_VM_ENABLE is not supported with it"]


[isa]

VX_CFG_VM_ENABLE = false

VX_CFG_EXT_D_ENABLE = "expr: $VX_CFG_XLEN_64"
VX_CFG_FLEN = "expr: 64 if $VX_CFG_EXT_D_ENABLE else 32"

VX_CFG_EXT_M_ENABLE = true
VX_CFG_EXT_F_ENABLE = true
VX_CFG_EXT_C_ENABLE = false
VX_CFG_EXT_A_ENABLE = false
# Zacas: native compare-and-swap (amocas). Requires the A extension -- it adds
# an atomic, it does not replace the set. Off by default because it widens the
# memory request with a comparand operand.
VX_CFG_EXT_ZACAS_ENABLE = false
# PTX atomics beyond RISC-V A (RV64 only): float add and packed min/max, inc/dec,
# executed where the H100 has a single instruction. Requires A and Zacas
# (the forms the H100 runs as CAS loops are CAS loops in the kernel headers).
VX_CFG_EXT_FPAMO_ENABLE = false
# Extra cycles a float atomic holds its execution site beyond an integer atomic.
VX_CFG_FPAMO_LATENCY = 3

VX_CFG_EXT_ZICOND_ENABLE = true
VX_CFG_EXT_TCU_ENABLE = false
VX_CFG_EXT_DMA_ENABLE = false
VX_CFG_EXT_DXA_ENABLE = false
# Distributed local memory (RV64 only): the warps of a thread-block cluster
# address every member block's local memory through one window.
VX_CFG_EXT_DLMEM_ENABLE = false
# mbarriers: 64-bit local-memory synchronization objects updated by the local
# memory banks' atomic unit. Requires DLMEM and the A extension.
VX_CFG_EXT_MBAR_ENABLE = false
VX_CFG_EXT_TEX_ENABLE = false
VX_CFG_EXT_RASTER_ENABLE = false
VX_CFG_EXT_OM_ENABLE = false
VX_CFG_EXT_RTU_ENABLE = false
VX_CFG_VLEN = "expr: $VX_CFG_XLEN * 4"

[pipeline]
VX_CFG_NUM_WARPS = 4
VX_CFG_NUM_THREADS = 4
VX_CFG_NUM_BARRIERS = 8
VX_CFG_MAX_BAR_EVENTS = 32

VX_CFG_IBUF_SIZE = 4
VX_CFG_DISPATCH_QUEUE_SIZE = 4
VX_CFG_ISSUE_WIDTH = "expr: up($VX_CFG_NUM_WARPS / 16)"
VX_CFG_SIMD_WIDTH = "expr: $VX_CFG_NUM_THREADS"
VX_CFG_NUM_OPCS = "expr: up($VX_CFG_NUM_WARPS / (4 * $VX_CFG_ISSUE_WIDTH))"

VX_CFG_NUM_GPR_BANKS = 4
VX_CFG_NUM_VGPR_BANKS = 2

[memory]
VX_CFG_MEM_BLOCK_SIZE = 64
VX_CFG_MEM_ADDR_WIDTH = "expr: 48 if $VX_CFG_XLEN_64 else 32"

# L1 block = memory bus (MEM_BLOCK), shared by icache/dcache/gfx + L2 input word.
# L2/L3 are sectored: a doubled line halves tags while the sector (= MEM_BLOCK)
# stays the fill/transaction granule. When a level is disabled it is a passthrough
# and forwards the upstream granule unchanged.
VX_CFG_L1_LINE_SIZE   = "expr: $VX_CFG_MEM_BLOCK_SIZE"
VX_CFG_L2_LINE_SIZE   = "expr: (2 * $VX_CFG_MEM_BLOCK_SIZE) if $VX_CFG_L2_ENABLE else $VX_CFG_L1_LINE_SIZE"
VX_CFG_L2_SECTOR_SIZE = "expr: $VX_CFG_MEM_BLOCK_SIZE if $VX_CFG_L2_ENABLE else $VX_CFG_L1_LINE_SIZE"
VX_CFG_L3_LINE_SIZE   = "expr: (2 * $VX_CFG_MEM_BLOCK_SIZE) if $VX_CFG_L3_ENABLE else $VX_CFG_L2_SECTOR_SIZE"
VX_CFG_L3_SECTOR_SIZE = "expr: $VX_CFG_MEM_BLOCK_SIZE if $VX_CFG_L3_ENABLE else $VX_CFG_L2_SECTOR_SIZE"

[dram]
# Global memory and its DRAM: the H100's HBM3 (07, 18 §9) or the HBM2 model of the single-cluster shapes.
VX_CFG_DRAM_MODEL = "expr: 'H100' if $VX_CFG_H100_ORG_ENABLE else 'HBM2'"
dram_h100 = "expr: $VX_CFG_DRAM_MODEL_H100"
# SMs sharing the memory side (E19's per-slice knobs replace it).
dram_num_sms = "expr: $VX_CFG_NUM_GPCS * $VX_CFG_SMS_PER_GPC"

# Clocks in MHz; DRAM time advances by the exact ratio DRAM_CLOCK_MHZ / SM_CLOCK_MHZ.
VX_CFG_SM_CLOCK_MHZ = "expr: $VX_CFG_H100_SM_CLOCK_MHZ if $dram_h100 else 400"
VX_CFG_DRAM_CLOCK_MHZ = "expr: $VX_CFG_H100_DRAM_CLOCK_MHZ if $dram_h100 else $VX_CFG_SM_CLOCK_MHZ"
VX_CFG_L2_CLOCK_MHZ = "expr: $VX_CFG_H100_L2_CLOCK_MHZ if $VX_CFG_H100_ORG_ENABLE else $VX_CFG_SM_CLOCK_MHZ"

# Capacity = the H100's usable framebuffer per SM x SMs, rounded up to a power of two (07 §1),
# at least the 4 GiB the device memory map below and the page table at 0xF0000000 need.
VX_CFG_GLOBAL_MEM_SIZE = "expr: max(0x0000000100000000, pow(0x0000000000000002, clog2($VX_CFG_H100_FB_USABLE_BYTES / $VX_CFG_H100_NUM_SMS * $dram_num_sms))) if $dram_h100 else (0x0000000200000000 if $VX_CFG_XLEN_64 else 0x0000000100000000)"
# Device memory map: stack and local memory at the top of global memory, the
# distributed local memory window right above it, aligned to the largest cluster.
VX_MEM_STACK_BASE_ADDR = "expr: ($VX_CFG_GLOBAL_MEM_SIZE - 0x0000000000040000) if $VX_CFG_XLEN_64 else ($VX_CFG_GLOBAL_MEM_SIZE - 0x0000000000010000)"
VX_MEM_LMEM_BASE_ADDR = "expr: $VX_MEM_STACK_BASE_ADDR"
dlmem_align = "expr: (1 << $VX_CFG_LMEM_LOG_SIZE) << clog2($VX_CFG_DLMEM_MAX_CLUSTER)"
VX_MEM_DLMEM_BASE_ADDR = "expr: (($VX_CFG_GLOBAL_MEM_SIZE + $dlmem_align - 1) / $dlmem_align * $dlmem_align) if $VX_CFG_XLEN_64 else 0"
# Program image base: 6 GiB from 8 GiB up, 2 GiB below the top of a 4 GiB memory (RV32, the 4 GiB H100 shapes).
VX_MEM_STARTUP_ADDR = "expr: min(0x0000000180000000, $VX_CFG_GLOBAL_MEM_SIZE - 0x0000000080000000)"

# One channel per L2 slice, no crossbar between slices and channels (07 §10.1).
VX_CFG_DRAM_CHANNELS = "expr: $VX_CFG_NUM_SLICES if $dram_h100 else 2"
VX_CFG_DRAM_ADDR_WIDTH = "expr: $VX_CFG_MEM_ADDR_WIDTH"
VX_CFG_DRAM_PORT_DATA_SIZE = "expr: $VX_CFG_MEM_BLOCK_SIZE"
VX_CFG_DRAM_INTERLEAVE = 1
# Rows of 8 lines of 128 B (07 §3), moved in 32-B sectors (18 §9.6).
VX_CFG_DRAM_LINE_BYTES = 128
VX_CFG_DRAM_ATOM_BYTES = 32
# Channel select on port blocks: a DRAM line's sectors stay in one channel.
VX_CFG_DRAM_INTERLEAVE_SHIFT = "expr: clog2($VX_CFG_DRAM_LINE_BYTES / $VX_CFG_DRAM_PORT_DATA_SIZE) if $dram_h100 else 0"
VX_CFG_DRAM_ROW_BYTES = 1024

# 64 bits per slice (07 §1), widened by whole 64-bit channels (JESD238 organisation, power of two) only
# when a slice serves more SMs than the H100's 132 / 94; a slice serving fewer keeps 64 bits, so the
# slice count sets the per-SM share. Bandwidth then follows from the width and the device timing.
dram_share_num = "expr: $dram_num_sms * $VX_CFG_H100_NUM_SLICES"
dram_share_den = "expr: $VX_CFG_NUM_SLICES * $VX_CFG_H100_NUM_SMS"
VX_CFG_DRAM_WIDTH_FACTOR = "expr: pow(2, clog2(($dram_share_num + $dram_share_den - 1) / $dram_share_den))"
VX_CFG_DRAM_CHANNEL_BITS = "expr: $VX_CFG_H100_DRAM_CHANNEL_BITS * $VX_CFG_DRAM_WIDTH_FACTOR"
# JESD238: two 32-bit pseudo-channels and 32 banks per 64 bits, four bank groups.
VX_CFG_DRAM_PCS_PER_64B = 2
VX_CFG_DRAM_PCS = "expr: $VX_CFG_DRAM_PCS_PER_64B * $VX_CFG_DRAM_WIDTH_FACTOR"
VX_CFG_DRAM_BANKS_PER_64B = 32
VX_CFG_DRAM_BANKS = "expr: $VX_CFG_DRAM_BANKS_PER_64B * $VX_CFG_DRAM_WIDTH_FACTOR"
VX_CFG_DRAM_BGS_MAX = 4
VX_CFG_DRAM_BGS = "expr: min($VX_CFG_DRAM_BGS_MAX, $VX_CFG_DRAM_BANKS / $VX_CFG_DRAM_PCS)"
VX_CFG_DRAM_BANKS_PER_BG = "expr: $VX_CFG_DRAM_BANKS / ($VX_CFG_DRAM_PCS * $VX_CFG_DRAM_BGS)"
VX_CFG_DRAM_ROWS_PER_BANK = "expr: $VX_CFG_GLOBAL_MEM_SIZE / ($VX_CFG_DRAM_CHANNELS * $VX_CFG_DRAM_BANKS * $VX_CFG_DRAM_ROW_BYTES)"
VX_CFG_DRAM_DATA_RATE_MTS = "expr: 2 * $VX_CFG_DRAM_CLOCK_MHZ"
# One memory controller per memory partition (07 §1).
VX_CFG_DRAM_NUM_MCS = "expr: $VX_CFG_NUM_PARTITIONS * $VX_CFG_MPS_PER_PARTITION"

# Controller policies: close the row unless a queued request hits it (07 §4, §8),
# age-based read/write switch (18 §9.8, §9.11); scheduler not in the spec; HBM3
# per-bank refresh (JESD238).
VX_CFG_DRAM_PAGE_POLICY = "expr: 'SHARED' if $dram_h100 else 'OPEN'"
VX_CFG_DRAM_RW_POLICY = "expr: 'AGE' if $dram_h100 else 'WATERMARK'"
VX_CFG_DRAM_SCHED = "FRFCFS"
VX_CFG_DRAM_REFRESH = "expr: 'PERBANK' if $dram_h100 else 'ALLBANK'"

# Device timings (H100 model): tRC measured (07 §4); the rest JESD238 / Ramulator's HBM3 preset.
VX_CFG_DRAM_T_RC_PS = 43000
VX_CFG_DRAM_T_RP_PS = 16250
VX_CFG_DRAM_T_RCDRD_PS = 19375
VX_CFG_DRAM_T_RCDWR_PS = 9375
VX_CFG_DRAM_T_CL_PS = 12500
VX_CFG_DRAM_T_CWL_PS = 6250
VX_CFG_DRAM_T_WR_PS = 20625
VX_CFG_DRAM_T_RTP_PS = 5625
# No bank-group effect is measured (07 §9): long = short.
VX_CFG_DRAM_T_RRDS_PS = 2500
VX_CFG_DRAM_T_RRDL_PS = "expr: $VX_CFG_DRAM_T_RRDS_PS"
VX_CFG_DRAM_T_FAW_PS = 15000
VX_CFG_DRAM_T_WTRS_PS = 4375
VX_CFG_DRAM_T_WTRL_PS = "expr: $VX_CFG_DRAM_T_WTRS_PS"
VX_CFG_DRAM_NCK_BL = 2
VX_CFG_DRAM_NCK_CCDS = 2
VX_CFG_DRAM_NCK_PPD = 2
VX_CFG_DRAM_T_REFI_PS = 3900000
VX_CFG_DRAM_T_RFC_PS = 350000
VX_CFG_DRAM_T_RFCPB_PS = 200000
VX_CFG_DRAM_T_RREFD_PS = 8000
# Age after which the waiting direction is served (18 §9.8); each switch is timed by the device's tWTR/tRTW.
VX_CFG_DRAM_T_AGE_PS = 600000

# Controller queue, requests per direction waiting for their row visit: one per bank of the channel
# (sized by the occupancy of the bank array), so a closed-page scheduler finds a request for every bank that frees.
VX_CFG_DRAM_QD_RD = "expr: $VX_CFG_DRAM_BANKS"
VX_CFG_DRAM_QD_WR = "expr: $VX_CFG_DRAM_QD_RD"
# SimX mirror of the rtlsim shim's registered response path, SM cycles.
VX_CFG_DRAM_RSP_BOUNDARY_DELAY = 3
# MB/s: the built channels' peak, channels x bytes per transfer x transfer rate.
VX_CFG_PEAK_MEM_BW = "expr: ($VX_CFG_DRAM_CHANNELS * $VX_CFG_DRAM_CHANNEL_BITS / 8 * $VX_CFG_DRAM_DATA_RATE_MTS) if $dram_h100 else 460000"

[[check]]
DRAM_MODEL_XLEN = ["expr: not $VX_CFG_DRAM_MODEL_H100 or $VX_CFG_XLEN_64", "VX_CFG_DRAM_MODEL H100 requires XLEN 64"]
SM_CLOCK_MHZ_POS = ["expr: $VX_CFG_SM_CLOCK_MHZ > 0", "VX_CFG_SM_CLOCK_MHZ must be > 0"]
DRAM_CLOCK_MHZ_POS = ["expr: $VX_CFG_DRAM_CLOCK_MHZ > 0", "VX_CFG_DRAM_CLOCK_MHZ must be > 0"]
L2_CLOCK_MHZ_POS = ["expr: $VX_CFG_L2_CLOCK_MHZ > 0", "VX_CFG_L2_CLOCK_MHZ must be > 0"]
DRAM_CHANNELS_POW2 = ["expr: is_pow2($VX_CFG_DRAM_CHANNELS) and $VX_CFG_DRAM_CHANNELS <= 128", "VX_CFG_DRAM_CHANNELS must be a power of two <= 128 (3-bit log2 caps field)"]
DRAM_CHANNELS_SLICES = ["expr: not $VX_CFG_DRAM_MODEL_H100 or ($VX_CFG_DRAM_CHANNELS == $VX_CFG_NUM_SLICES and $VX_CFG_DRAM_CHANNELS % $VX_CFG_NUM_PARTITIONS == 0 and $VX_CFG_DRAM_CHANNELS >= $VX_CFG_NUM_PARTITIONS)", "H100 DRAM: one channel per L2 slice, the same number in every partition"]
DRAM_PORT_DATA_SIZE_BLOCK = ["expr: $VX_CFG_DRAM_PORT_DATA_SIZE == $VX_CFG_MEM_BLOCK_SIZE", "VX_CFG_DRAM_PORT_DATA_SIZE must equal VX_CFG_MEM_BLOCK_SIZE"]
DRAM_INTERLEAVE_H100 = ["expr: not $VX_CFG_DRAM_MODEL_H100 or $VX_CFG_DRAM_INTERLEAVE == 1", "H100 DRAM: channels interleave on DRAM lines"]
DRAM_LINE_BYTES_SHAPE = ["expr: is_pow2($VX_CFG_DRAM_LINE_BYTES) and $VX_CFG_DRAM_LINE_BYTES >= $VX_CFG_DRAM_PORT_DATA_SIZE and $VX_CFG_DRAM_LINE_BYTES % $VX_CFG_DRAM_ATOM_BYTES == 0", "VX_CFG_DRAM_LINE_BYTES: power of two, >= the port, whole sectors"]
DRAM_ATOM_H100 = ["expr: not $VX_CFG_DRAM_MODEL_H100 or $VX_CFG_DRAM_ATOM_BYTES == 32", "H100 DRAM: 32-B sectors"]
DRAM_BANKS_POW2 = ["expr: is_pow2($VX_CFG_DRAM_BANKS_PER_64B) and $VX_CFG_DRAM_BANKS_PER_64B <= 32", "VX_CFG_DRAM_BANKS_PER_64B must be a power of two <= 32"]
DRAM_ROW_BYTES_SHAPE = ["expr: is_pow2($VX_CFG_DRAM_ROW_BYTES) and $VX_CFG_DRAM_ROW_BYTES >= $VX_CFG_DRAM_LINE_BYTES", "VX_CFG_DRAM_ROW_BYTES: power of two, >= one line"]
DRAM_T_RAS = ["expr: $VX_CFG_DRAM_T_RC_PS - $VX_CFG_DRAM_T_RP_PS >= $VX_CFG_DRAM_T_RCDRD_PS", "tRC - tRP must cover tRCDRD"]
DRAM_T_AGE_POS = ["expr: $VX_CFG_DRAM_T_AGE_PS > 0", "VX_CFG_DRAM_T_AGE_PS must be > 0"]
DRAM_RSP_BOUNDARY_DELAY_POS = ["expr: $VX_CFG_DRAM_RSP_BOUNDARY_DELAY >= 1", "VX_CFG_DRAM_RSP_BOUNDARY_DELAY must be >= 1"]
DRAM_RW_POLICY_AGE = ["expr: not $VX_CFG_DRAM_RW_POLICY_AGE or $VX_CFG_DRAM_MODEL_H100", "VX_CFG_DRAM_RW_POLICY AGE requires the H100 DRAM model"]

[alu]
VX_CFG_NUM_ALU_LANES = "expr: $VX_CFG_SIMD_WIDTH"
VX_CFG_NUM_ALU_BLOCKS = "expr: $VX_CFG_ISSUE_WIDTH"

[sfu]
VX_CFG_NUM_SFU_LANES = "expr: $VX_CFG_SIMD_WIDTH"
VX_CFG_NUM_SFU_BLOCKS = 1

[lsu]
VX_CFG_NUM_LSU_LANES = "expr: $VX_CFG_SIMD_WIDTH"
VX_CFG_NUM_LSU_BLOCKS = "expr: $VX_CFG_ISSUE_WIDTH"
# Interleave the per-thread stacks by word, so a warp-wide access to one frame
# slot fills a single line instead of one same-bank line per thread.
VX_CFG_LSU_STACK_INTERLEAVE_ENABLE = true

VX_CFG_LSU_LINE_SIZE = "expr: $VX_CFG_DCACHE_LINE_SIZE if $VX_CFG_H100_SM_ENABLE else min($VX_CFG_NUM_LSU_LANES * ($VX_CFG_XLEN / 8), $VX_CFG_L1_LINE_SIZE)"
VX_CFG_LSU_QUEUE_IN_SIZE = "expr: max(4, 2 * ($VX_CFG_SIMD_WIDTH // $VX_CFG_NUM_LSU_LANES))"
# Outstanding-load pool (MLP depth): decoupled from the input staging queue and
# provisioned for miss-latency hiding (~2 in-flight loads per warp), clamped so
# the slot id stays cheap in the dcache tag.
# H100 SM: one global tag per line the SM may have in flight when a warp reads a
# 4-B word per lane, so the tags never run out before the L1's read lines: a
# global load waiting for a tag holds the block's in-order queue, and the shared
# accesses behind it.
VX_CFG_LSU_PENDING_SIZE = "expr: max(1, $VX_CFG_SM_MAX_READ_LINES * $VX_CFG_DCACHE_LINE_SIZE / ($VX_CFG_NUM_LSU_LANES * 4) / $VX_CFG_NUM_LSU_BLOCKS) if $VX_CFG_H100_SM_ENABLE else min(32, max(8, 2 * $VX_CFG_NUM_WARPS * ($VX_CFG_SIMD_WIDTH // $VX_CFG_NUM_LSU_LANES)))"
# The mem-side queue depth is not a knob: it sets the dcache-facing tag-id
# width and must cover the outstanding pool, so each implementation derives
# it internally from the pool size.

[fpu]
# string enum: 'DPI'|'DSP'|'FPNEW'|'STD'; synth ASIC=>STD FPGA=>DSP, sim DPI/STD
VX_CFG_FPU_TYPE = "expr: ('STD' if $ASIC else 'DSP') if $SYNTHESIS else ('DPI' if $dpi_is_enabled else 'STD')"

VX_CFG_NUM_FPU_LANES = "expr: $VX_CFG_SIMD_WIDTH"
VX_CFG_NUM_FPU_BLOCKS = "expr: $VX_CFG_ISSUE_WIDTH"
VX_CFG_FPU_QUEUE_SIZE = "expr: 2 * ($VX_CFG_SIMD_WIDTH // $VX_CFG_NUM_FPU_LANES)"
# Map the soft FPU (STD) mantissa multipliers onto DSP48: on for FPGA synth, off
# for ASIC/sim (mirrors VX_CFG_TCU_USE_DSP). Single source of truth.
VX_CFG_FPU_USE_DSP = "expr: 1 if ($SYNTHESIS and not $ASIC) else 0"

fpu_dsp_quartus = "expr: $VX_CFG_FPU_TYPE_DSP and $QUARTUS"
fpu_dsp_vivado  = "expr: $VX_CFG_FPU_TYPE_DSP and $VIVADO"

# STD: FDIV_LATENCY must equal FSQRT_LATENCY (shared serializer in VX_fpu_std)
VX_CFG_FMA_LATENCY  = "expr: 16 if $fpu_dsp_vivado else (4 if $fpu_dsp_quartus else (12 if $VX_CFG_EXT_D_ENABLE else 8))"
VX_CFG_FDIV_LATENCY = "expr: 15 if $VX_CFG_FPU_TYPE_DPI else (16 if $VX_CFG_FPU_TYPE_FPNEW else ((32 if $VX_CFG_EXT_D_ENABLE else 17) if $VX_CFG_FPU_TYPE_STD else (15 if $fpu_dsp_quartus else (28 if $fpu_dsp_vivado else (32 if $VX_CFG_EXT_D_ENABLE else 17)))))"
VX_CFG_FSQRT_LATENCY= "expr: 10 if $VX_CFG_FPU_TYPE_DPI else (16 if $VX_CFG_FPU_TYPE_FPNEW else ((32 if $VX_CFG_EXT_D_ENABLE else 17) if $VX_CFG_FPU_TYPE_STD else (10 if $fpu_dsp_quartus else (28 if $fpu_dsp_vivado else (32 if $VX_CFG_EXT_D_ENABLE else 17)))))"
VX_CFG_FNCP_LATENCY = 2
VX_CFG_FCVT_LATENCY = 5

VX_CFG_FMA_PE_RATIO  = 1
VX_CFG_FDIV_PE_RATIO = 1
VX_CFG_FSQRT_PE_RATIO= 1
VX_CFG_FCVT_PE_RATIO = 1
VX_CFG_FNCP_PE_RATIO = 1

[amo]
# LR/SC reservation stations per LLC bank; line-indexed in BRAM, eviction yields legal spurious SC failures
VX_CFG_AMO_RS_SIZE = "expr: max($VX_CFG_NUM_WARPS, up($VX_CFG_NUM_CORES * $VX_CFG_NUM_WARPS / $VX_CFG_L2_NUM_BANKS))"

[vpu]
VX_CFG_NUM_VPU_LANES = "expr: $VX_CFG_SIMD_WIDTH"
VX_CFG_NUM_VPU_BLOCKS = 1

[vm]
# VM page-table format is a HW<->SW contract, moved to VX_types.toml [vm]; TLB depth stays here.
VX_CFG_TLB_SIZE = 32

# L1 TLB stage (per core): D-side / I-side entries and the per-instance
# miss station depth (distinct outstanding VPN misses).
VX_CFG_DTLB_SIZE        = 16
VX_CFG_ITLB_SIZE        = 8
VX_CFG_L1_TLB_MSHR_SIZE = 4

# Shared cluster TLB and page-table walker complex.
VX_CFG_L2_TLB_SIZE         = 512
VX_CFG_L2_TLB_NUM_WAYS     = 4
VX_CFG_L2_TLB_MEGA_SIZE    = 8
VX_CFG_L2_TLB_MSHR_SIZE    = 8
VX_CFG_L2_TLB_LATENCY      = 4
VX_CFG_PTW_NUM_WALKERS     = 2
VX_CFG_PTW_WALK_CACHE_SIZE = 16

VX_CFG_VM_PINNED_REGION_SIZE = 0x10000000   # 256 MB

[cache]
# Cache replacement-policy enums + LLC/topology helpers, consumed by the
# per-level cache sections below and by [amo].
__cache_repl_random = 0
__cache_repl_fifo   = 1
__cache_repl_plru   = 2
# Insertion-ordered random over the older ways (the newest are protected).
__cache_repl_h100   = 3

# Write-back only at a cache level that is BOTH the LLC AND the single coherence
# point for all cores. A private cache acting as the LLC across multiple
# cores/clusters has no shared coherence point, so its dirty data never becomes
# visible to the other cores and it must stay write-through (stores reach shared
# memory). The dcache is per-core and L2 is per-cluster, so each is a valid
# write-back LLC only when there is exactly one instance; L3 is always global.
l2_is_llc = "expr: $VX_CFG_L2_ENABLED == 1 and $VX_CFG_L3_ENABLED == 0"
dcache_is_llc = "expr: $VX_CFG_L2_ENABLED == 0 and $VX_CFG_L3_ENABLED == 0"
l3_is_llc = "expr: $VX_CFG_L3_ENABLED == 1"
single_core = "expr: $VX_CFG_NUM_CORES == 1 and $VX_CFG_NUM_CLUSTERS == 1"
single_cluster = "expr: $VX_CFG_NUM_CLUSTERS == 1"

[l1cache]
VX_CFG_ICACHE_SIZE = 16384
VX_CFG_ICACHE_NUM_WAYS = 4
VX_CFG_ICACHE_REPL_POLICY = "expr: $__cache_repl_fifo"
VX_CFG_ICACHE_MSHR_SIZE = 16
VX_CFG_ICACHE_MRSQ_SIZE = 0
# mem-request queue depth override; 0 = bank-derived minimum, raise to add slots
VX_CFG_ICACHE_MREQ_SIZE = 0
VX_CFG_ICACHE_CRSQ_SIZE = 0
VX_CFG_ICACHE_MEM_PORTS = 1
VX_CFG_ICACHE_LATENCY = "expr: 2 + max(0, clog2($VX_CFG_ICACHE_SIZE) - clog2(16384))"

VX_CFG_DCACHE_SIZE = "expr: $VX_CFG_L1_MAX_LINES * $VX_CFG_DCACHE_LINE_SIZE if $VX_CFG_H100_SM_ENABLE else 16384"
VX_CFG_DCACHE_NUM_WAYS = "expr: 16 if $VX_CFG_H100_SM_ENABLE else 4"
# Coalescer/bank granule (banks = footprint/word, NUM_BANKS = NUM_REQS). Word is
# reduced ~sqrt(lanes) below the block so banks scale for MLP while the word/bus
# stays moderate: NT 1/2/4/8/16/32/64 -> word 4/8/8/16/16/32/32, banks 1/1/2/2/4/4/8.
VX_CFG_DCACHE_WORD_SIZE = "expr: $VX_CFG_DCACHE_LINE_SIZE if $VX_CFG_H100_SM_ENABLE else min($VX_CFG_L1_LINE_SIZE, min($VX_CFG_MEM_BLOCK_SIZE, ($VX_CFG_XLEN / 8) * pow(2, (clog2($VX_CFG_NUM_LSU_LANES) + 1) / 2)))"
VX_CFG_DCACHE_WRITEBACK = "expr: 0 if $VX_CFG_H100_SM_ENABLE else int($dcache_is_llc and $single_core)"
# The DXA writes global memory around the dcache: a write-back dcache must write
# back only the bytes it dirtied, or it overwrites the DXA's bytes in the line.
VX_CFG_DCACHE_DIRTYBYTES = "expr: $VX_CFG_DCACHE_WRITEBACK if ($VX_CFG_EXT_DXA_ENABLE and $VX_CFG_EXT_MBAR_ENABLE) else 0"
VX_CFG_DCACHE_REPL_POLICY = "expr: $__cache_repl_h100 if $VX_CFG_H100_SM_ENABLE else $__cache_repl_fifo"
VX_CFG_DCACHE_MSHR_SIZE = "expr: $VX_CFG_SM_MAX_READ_LINES / $VX_CFG_DCACHE_NUM_BANKS if $VX_CFG_H100_SM_ENABLE else 16"
# dcache is unsectored: line = sector = mem transaction granule = L1_LINE (which
# defaults to MEM_BLOCK but can be configured smaller). Banking comes from the
# reduced WORD above (>= sector is clamped), not the line. Deriving from L1_LINE
# (rather than hardcoding MEM_BLOCK) keeps line/sector/word/mem-bus consistent
# when L1_LINE is overridden, so a sub-block line stays a valid sectored config.
VX_CFG_DCACHE_LINE_SIZE = "expr: $VX_CFG_SM_DATAPATH_BYTES if $VX_CFG_H100_SM_ENABLE else $VX_CFG_L1_LINE_SIZE"
VX_CFG_DCACHE_SECTOR_SIZE = "expr: 32 if $VX_CFG_H100_SM_ENABLE else $VX_CFG_L1_LINE_SIZE"
VX_CFG_DCACHE_LATENCY = "expr: 2 + max(0, clog2($VX_CFG_DCACHE_SIZE) - clog2(16384))"
VX_CFG_DCACHE_MRSQ_SIZE = 4
VX_CFG_DCACHE_MREQ_SIZE = 0
VX_CFG_DCACHE_CRSQ_SIZE = 0

VX_CFG_NUM_ICACHES = "expr: up($VX_CFG_SOCKET_SIZE / 4) if $VX_CFG_ICACHE_ENABLE else 0"
VX_CFG_NUM_DCACHES = "expr: ($VX_CFG_SOCKET_SIZE if $VX_CFG_DCACHE_ENABLE else 0) if $VX_CFG_H100_SM_ENABLE else up($VX_CFG_SOCKET_SIZE / 4) if $VX_CFG_DCACHE_ENABLE else 0"

VX_CFG_DCACHE_NUM_BANKS = "expr: 1 if $VX_CFG_H100_SM_ENABLE else pow(2, clog2(min($VX_CFG_DCACHE_NUM_REQS, 16)))"

VX_CFG_L1_MEM_PORTS = "expr: $VX_CFG_SOCKET_SIZE if $VX_CFG_H100_SM_ENABLE else min($VX_CFG_DCACHE_NUM_BANKS, $VX_CFG_DRAM_CHANNELS) if ($VX_CFG_ICACHE_ENABLE or $VX_CFG_DCACHE_ENABLE) else min($VX_CFG_DCACHE_NUM_REQS, $VX_CFG_DRAM_CHANNELS)"

[l2cache]
VX_CFG_L2_SIZE = 1048576
VX_CFG_L2_NUM_WAYS = 8
VX_CFG_L2_WRITEBACK = "expr: int($l2_is_llc and $single_cluster)"
VX_CFG_L2_DIRTYBYTES = 0
VX_CFG_L2_REPL_POLICY = "expr: $__cache_repl_fifo"
VX_CFG_L2_MSHR_SIZE = 16
VX_CFG_L2_LATENCY = "expr: 4 + max(0, clog2($VX_CFG_L2_SIZE) - clog2(1048576))"
VX_CFG_L2_MRSQ_SIZE = 4
VX_CFG_L2_MREQ_SIZE = 0
VX_CFG_L2_CRSQ_SIZE = 0

VX_CFG_L2_NUM_BANKS = "expr: pow(2, clog2(min($VX_CFG_L2_NUM_REQS, 16)))"
VX_CFG_L2_MEM_PORTS = "expr: min($VX_CFG_L2_NUM_BANKS, $VX_CFG_DRAM_CHANNELS) if $VX_CFG_L2_ENABLE else min($VX_CFG_L2_NUM_REQS, $VX_CFG_DRAM_CHANNELS)"

[l3cache]
VX_CFG_L3_SIZE = 2097152
VX_CFG_L3_NUM_WAYS = 8
VX_CFG_L3_WRITEBACK = "expr: int($l3_is_llc)"
VX_CFG_L3_DIRTYBYTES = 0
VX_CFG_L3_REPL_POLICY = "expr: $__cache_repl_fifo"
VX_CFG_L3_MSHR_SIZE = 16
VX_CFG_L3_LATENCY = "expr: 4 + max(0, clog2($VX_CFG_L3_SIZE) - clog2(2097152))"
VX_CFG_L3_MRSQ_SIZE = 4
VX_CFG_L3_MREQ_SIZE = 0
VX_CFG_L3_CRSQ_SIZE = 0

VX_CFG_L3_NUM_BANKS = "expr: pow(2, clog2(min($VX_CFG_L3_NUM_REQS, 16)))"
VX_CFG_L3_MEM_PORTS = "expr: min($VX_CFG_L3_NUM_BANKS, $VX_CFG_DRAM_CHANNELS) if $VX_CFG_L3_ENABLE else min($VX_CFG_L3_NUM_REQS, $VX_CFG_DRAM_CHANNELS)"

[lmem]
lmem_bytes_per_bank = 2048
# Narrow cores must keep a usable shared-memory window: scaling capacity with
# bank count alone drops NT=1 to 2KB, below what CTAs that fit every other
# configuration need. The floor holds a full warp-count group of co-resident
# CTAs: kernels that rendezvous across `NUM_WARPS` CTAs -- the DXA multicast
# pattern -- make no progress at all once fewer than the whole group fits.
lmem_min_bytes = 16384
VX_CFG_LMEM_NUM_BANKS = "expr: $VX_CFG_SM_DATAPATH_BYTES / $VX_CFG_LMEM_BANK_BYTES if $VX_CFG_H100_SM_ENABLE else $VX_CFG_NUM_LSU_LANES"
VX_CFG_LMEM_LOG_SIZE = "expr: clog2($VX_CFG_SMEM_PER_SM_MAX) if $VX_CFG_H100_SM_ENABLE else clog2(max($lmem_min_bytes, $VX_CFG_LMEM_NUM_BANKS * $lmem_bytes_per_bank))"

# SM shared memory (H100 SM path): 4-B banks across the SM datapath, one wavefront per cycle.
VX_CFG_LMEM_BANK_BYTES = "expr: 4 if $VX_CFG_H100_SM_ENABLE else ($VX_CFG_XLEN / 8)"     # 05/spec.md §3.2
VX_CFG_LMEM_PORT_BYTES = "expr: $VX_CFG_LMEM_NUM_BANKS * $VX_CFG_LMEM_BANK_BYTES"
VX_CFG_SMEM_PER_SM_MAX = 233472          # 05/spec.md §2 (228 KiB)
VX_CFG_SMEM_PER_CTA_MAX = "expr: $VX_CFG_SMEM_PER_SM_MAX"
# wgmma shared-memory descriptor reach: the H100 (PTX) format has a 14-bit start
# address of 16 B, the non-H100 format a 16-bit byte offset.
VX_CFG_LMEM_DESC_REACH_BYTES = "expr: 16384 * 16 if ($VX_CFG_TCU_H100_ENABLE or not $VX_CFG_TCU_WGMMA_ENABLE) else 65536"
VX_CFG_LMEM_SLOT_ALIGN = "expr: max($VX_CFG_DCACHE_LINE_SIZE, $VX_CFG_LMEM_PORT_BYTES, $VX_CFG_LMEM_NUM_BANKS * ($VX_CFG_XLEN / 8)) if $VX_CFG_H100_SM_ENABLE else max($VX_CFG_DCACHE_LINE_SIZE, $VX_CFG_LMEM_PORT_BYTES)"
# PTX shared-memory swizzle span (128B mode).
lmem_swizzle_span = 128
# mbarrier ops issued by instructions wait here for their AMO pass, so the
# wavefront stage passes them on in one cycle. One entry per cycle of the
# queue's push-to-pop turnaround (registered full flag) gives one op per cycle.
VX_CFG_MBAR_OP_QUEUE = 2

[[check]]
MBAR_OP_QUEUE_OK = ["expr: not $VX_CFG_H100_SM_ENABLE or $VX_CFG_MBAR_OP_QUEUE >= 2", "VX_CFG_MBAR_OP_QUEUE must be >= 2 (one op per cycle through the registered full flag)"]

[tcu]
# string enum: 'DPI'|'DSP'|'BHF'|'TFR'|'FPNEW'; TFR is the universal default. On
# FPGA its FEDP multipliers map onto DSP48 via VX_CFG_TCU_USE_DSP below.
VX_CFG_TCU_TYPE = "TFR"
VX_CFG_NUM_TCU_LANES = "expr: $VX_CFG_NUM_THREADS"
VX_CFG_NUM_TCU_BLOCKS = "expr: $VX_CFG_ISSUE_WIDTH"
# Map FEDP multipliers onto DSP48: on for FPGA synth, off for ASIC/sim.
VX_CFG_TCU_USE_DSP = "expr: 1 if ($SYNTHESIS and not $ASIC) else 0"
# Block-geometry K (mirrors VX_tcu_pkg's TCU_TC_K derivation).
tcu_tc_k = "expr: 1 << (clog2($VX_CFG_NUM_THREADS) // 2)"
# Per-type FEDP pipeline latency; each FEDP variant asserts the selected
# value against its internal stage structure at elaboration.
tcu_latency_dsp   = "expr: 1 + 8 + clog2(2 * $tcu_tc_k + 1) * 11"
tcu_latency_bhf   = "expr: 4 + clog2(2 * $tcu_tc_k + 1) * 3"
tcu_latency_fpnew = "expr: 14 + clog2(2 * $tcu_tc_k) * 7"
tcu_latency_dpi   = 4
# TFR = mul stages + align + accumulate + round: 5 = 2-stage multiply
# (DSP48 PREG on FPGA), 4 = single-cycle multiply used in simulation.
tcu_latency_tfr   = "expr: 5 if ($VIVADO or $QUARTUS) else 4"
VX_CFG_TCU_LATENCY = "expr: $tcu_latency_dsp if $VX_CFG_TCU_TYPE_DSP else ($tcu_latency_bhf if $VX_CFG_TCU_TYPE_BHF else ($tcu_latency_fpnew if $VX_CFG_TCU_TYPE_FPNEW else ($tcu_latency_dpi if $VX_CFG_TCU_TYPE_DPI else $tcu_latency_tfr)))"
VX_CFG_TCU_TF32_ENABLE = false
VX_CFG_TCU_FP16_ENABLE = true
VX_CFG_TCU_FP8_ENABLE = false
VX_CFG_TCU_FP4_ENABLE = false
VX_CFG_TCU_INT8_ENABLE = false
VX_CFG_TCU_INT4_ENABLE = false
VX_CFG_TCU_MX_ENABLE = false
VX_CFG_TCU_MXFP4_ENABLE = false
VX_CFG_TCU_NVFP4_ENABLE = false
VX_CFG_TCU_SPARSE_ENABLE = false
VX_CFG_TCU_DSM_ENABLE = false
VX_CFG_TCU_WGMMA_ENABLE = false
VX_CFG_TCU_FEDP2K = false
# WGMMA as on the H100: smem descriptors into the CTA's local memory, the
# H100 accumulator fragment layout, f16 accumulators packed two per register.
# Needs XLEN 64, 32 threads, ISSUE_WIDTH 4, TCU + WGMMA, DXA + MBAR and the
# TFR or DPI backend; refuses sparse, MX, FEDP2K and DSM.
VX_CFG_TCU_H100_ENABLE = false

[dxa]
# Cluster-level DXA engine count, decoupled from cores/socket size.
VX_CFG_NUM_DXA_CORES = "expr: $VX_CFG_SOCKET_SIZE if $VX_CFG_H100_SM_ENABLE else max(1, up($VX_CFG_NUM_CORES / 8))"
VX_CFG_DXA_MEM_PORTS = "expr: $VX_CFG_NUM_DXA_CORES if $VX_CFG_H100_SM_ENABLE else min($VX_CFG_NUM_DXA_CORES, up($VX_CFG_NUM_CORES / $VX_CFG_SOCKET_SIZE) * $VX_CFG_L1_MEM_PORTS)"
# TMA engine of the H100 front end (14/spec.md §3, §5, §10). Requests queued per SM (a lower bound).
VX_CFG_TMA_QUEUE = 128
# Store fences per DXA worker: bulk stores whose writes are not yet acknowledged.
VX_CFG_TMA_STORE_QUEUE_OPS = 8

[[check]]
TMA_QUEUE_MIN = ["expr: (not $VX_CFG_H100_FE_ENABLED) or (is_pow2($VX_CFG_TMA_QUEUE) and $VX_CFG_TMA_QUEUE >= 2)", "VX_CFG_TMA_QUEUE must be a power of two of at least 2"]
DXA_MAX_INFLIGHT_POW2 = ["expr: is_pow2($VX_CFG_DXA_MAX_INFLIGHT) and ((not $VX_CFG_H100_FE_ENABLED) or $VX_CFG_DXA_MAX_INFLIGHT <= 64)", "VX_CFG_DXA_MAX_INFLIGHT must be a power of two, at most 64 with the front end"]
BULK_GROUPS_POW2 = ["expr: is_pow2($VX_CFG_BULK_GROUPS) and $VX_CFG_BULK_GROUPS >= 2 and $VX_CFG_BULK_GROUPS <= 64", "VX_CFG_BULK_GROUPS must be a power of two from 2 to 64"]
TMA_STORE_QUEUE_MIN = ["expr: (not $VX_CFG_H100_FE_ENABLED) or $VX_CFG_TMA_STORE_QUEUE_OPS >= 1", "VX_CFG_TMA_STORE_QUEUE_OPS must be at least 1"]

[dlmem]
# Largest thread-block cluster a distributed launch may place across the
# cores of one hardware cluster. As on the H100, the runtime accepts more than
# 8 blocks (CUDA's portable limit) only with VX_CLUSTER_FLAG_NON_PORTABLE.
VX_CFG_DLMEM_MAX_CLUSTER = "expr: min($VX_CFG_CLUSTER_MAX_NONPORTABLE, $VX_CFG_NUM_CORES)"
# Gang-table entries of one GPC: its most co-resident clusters of K >= 2 (a K = 1 cluster takes none).
VX_CFG_DLMEM_NUM_GANGS = "expr: max(2, $VX_CFG_NUM_CORES * $VX_CFG_MAX_CTAS_PER_SM_CLUSTER // 2)"
# Remote stores a core may have unacknowledged; bounds the per-warp store counters.
VX_CFG_DLMEM_STORE_CREDITS = "expr: $VX_CFG_DLMEM_STORE_WINDOW_BYTES / $VX_CFG_DCACHE_LINE_SIZE if $VX_CFG_H100_SM_ENABLE else 8"
# Remote loads and AMOs a core may have outstanding; sizes the egress response table.
VX_CFG_DLMEM_PENDING_SIZE = 8
# Remote-store window per SM (H100 SM path), in bytes.
VX_CFG_DLMEM_STORE_WINDOW_BYTES = 8192           # 05/spec.md §9.5
# DLMEM ingress slots: today's depth (no H100 basis).
VX_CFG_DLMEM_INGRESS_SLOTS = 4
# SM-to-SM packets: 32-B slots per 128-B line.
VX_CFG_N5_SLOT_BYTES = "expr: $VX_CFG_DCACHE_SECTOR_SIZE"    # 13/spec.md §9.2
VX_CFG_N5_LINE_BYTES = "expr: $VX_CFG_DCACHE_LINE_SIZE"      # 13/spec.md §9.2
VX_CFG_N5_MIN_SLOTS = 2                          # 13/spec.md §9.2
VX_CFG_N5_ASYNC_EXTRA_BYTES_V4 = 16              # 13/spec.md §9.2
VX_CFG_N5_ASYNC_EXTRA_BYTES_B32 = 32             # 13/spec.md §9.2
VX_CFG_N5_REDASYNC_EXTRA_BYTES = 16              # 13/spec.md §9.2
VX_CFG_DSMEM_ATOM_EXTRA_SLOTS = 1                # 05/spec.md §9.2 (assumed rule)

[rtu]
# RTU (Ray-Tracing Unit)
VX_CFG_NUM_RTU_CORES       = "expr: up($VX_CFG_SOCKET_SIZE / 4)"
VX_CFG_RTU_BVH_WIDTH       = 4    # CW-BVH4
# Flat-walker (BVH_WIDTH=0) TLAS/instancing path. Off by default: the CW-BVH4
# walker descends LEAF_INST natively, so this is only needed in a flat (WIDTH=0)
# build. Made explicit so the ifdef has a defined producer instead of resolving
# to always-false.
VX_CFG_RTU_TLAS_ENABLE     = false
VX_CFG_RTU_STACK_DEPTH     = 16   # short-stack depth per context
VX_CFG_RTU_RECIP_DSP_SEED  = 0    # inv_d reciprocal backend: 0=LUT-NR, 1=BRAM seed + DSP Newton-Raphson
# Map the geometry-PE F32 FMAs/FDIVs onto the hardened vendor FP IP: on for FPGA
# synth, off for ASIC/sim (mirrors VX_CFG_FPU_USE_DSP).
VX_CFG_RTU_USE_DSP         = "expr: 1 if ($SYNTHESIS and not $ASIC) else 0"
# RTU divide latency. Unlike the flexible-latency soft FMA, VX_fdiv_unit has a FIXED
# depth per backend, so this is BACKEND-keyed like VX_CFG_FMA_LATENCY — NOT FPU-type
# keyed like VX_CFG_FDIV_LATENCY (which would hand the RTL divider the DPI/FPNEW
# model's 15/16 that the RTU never uses). Vendor xil_fdiv=28 on Vivado, altera=15 on
# Quartus, soft VX_fdiv_unit_rtl F32=17 in sim/ASIC. Matches VX_fdiv_unit's own
# USE_VENDOR_IP = USE_DSP(=RTU_USE_DSP) && (VIVADO||QUARTUS).
VX_CFG_RTU_FDIV_LATENCY    = "expr: 28 if $VIVADO else (15 if $QUARTUS else 17)"
# Slot pool: resident traces. A slot stages one vx_rt_wtrace (its rays, its
# control state and its result record) from issue to terminal; a context is one
# ray's live BVH walk. The two are independent axes: slots buy residency,
# contexts buy traversal parallelism. Slots partition statically across the
# cores an RTU serves (CORES_PER_RTU = SOCKET_SIZE / NUM_RTU_CORES), so the
# count must be a whole multiple of that — the expression below is one slot per
# core at every socket size. A kernel that keeps more traces in flight per warp
# than its core owns slots needs a larger pool (see tests/raytracing).
VX_CFG_RTU_NUM_SLOTS       = "expr: $VX_CFG_SOCKET_SIZE / $VX_CFG_NUM_RTU_CORES"
# In-flight ray contexts. DERIVED, not a free knob: a SLOT OWNS ITS CONTEXTS (one per
# thread of the warp it is tracing), so the two cannot be set independently. They used to
# be, and the "extra contexts idle" configuration that allowed was a machine in which
# slots bought residency but never traversal parallelism.
# Raising slots past 1 MEASURES WORSE (rt_raycast, rtlsim: 1 slot 197,404 cy; 2 slots
# +3.7%; 4 slots +28.5%) — more contexts spread a saturated front end across more
# claimants and lengthen every ray's serial chain. Widen the front end before revisiting.
VX_CFG_RTU_NUM_CTX         = "expr: $VX_CFG_RTU_NUM_SLOTS * $VX_CFG_NUM_THREADS"
# RTU MSHR file: distinct node fetches the traversal front end may keep in
# flight, and the table that merges duplicate ones. Near the BVH root every
# context wants the same node, so one entry can serve many. 0 disables merging
# (per-context tags — one request per context per fetch).
VX_CFG_RTU_MERGE_DEPTH     = 0
VX_CFG_NUM_RTU_BLOCKS      = 2    # parallel memory request ports per RtuCore

[tex]
VX_CFG_NUM_TEX_CORES = "expr: max(1, up($VX_CFG_NUM_CORES / 8))"
# Texture memory-level parallelism: the request queue is the hard limit on how
# many texture instructions a core can have in flight, so it must be sized by
# the latency to hide, not by the SIMD-group count (which was 1 in every
# graphics config, capping the unit at 2 outstanding requests).
VX_CFG_TEX_REQ_QUEUE_SIZE = "expr: max(8, 2 * up($VX_CFG_NUM_THREADS / $VX_CFG_NUM_SFU_LANES))"
VX_CFG_TEX_MEM_QUEUE_SIZE = "expr: $VX_CFG_TEX_REQ_QUEUE_SIZE"

[raster]
VX_CFG_NUM_RASTER_CORES       = "expr: max(1, up($VX_CFG_NUM_CORES / 16))"
VX_CFG_RASTER_NUM_SLICES      = 1
VX_CFG_RASTER_TILE_LOG_SIZE    = 5
# Coarse bin: on-device binning groups prims into 128 px bins and
# the RASTER front end descends bin -> block -> quad, re-evaluating edges. Far
# fewer coverage entries than 32 px tiles; identical pixel coverage.
VX_CFG_RASTER_BIN_LOG_SIZE     = 7
VX_CFG_RASTER_BLOCK_LOG_SIZE   = 2
VX_CFG_RASTER_MEM_FIFO_DEPTH  = 8
VX_CFG_RASTER_QUAD_FIFO_DEPTH = 32
VX_CFG_RASTER_MEM_QUEUE_SIZE  = 4
VX_CFG_RASTER_EARLYZ_ENABLE          = false

[om]
VX_CFG_NUM_OM_CORES       = "expr: max(1, up($VX_CFG_NUM_CORES / 8))"
VX_CFG_OM_MEM_QUEUE_SIZE  = 4

[tcache]
VX_CFG_TCACHE_SIZE      = 8192
VX_CFG_TCACHE_NUM_BANKS = 1
VX_CFG_TCACHE_NUM_WAYS  = 2
VX_CFG_TCACHE_CRSQ_SIZE = 0
VX_CFG_TCACHE_MSHR_SIZE = 16
VX_CFG_TCACHE_MRSQ_SIZE = 0
VX_CFG_TCACHE_MREQ_SIZE = 0
VX_CFG_NUM_TCACHES      = "expr: max(1, up($VX_CFG_NUM_TEX_CORES / 4))"

[rcache]
VX_CFG_RCACHE_SIZE      = 4096
VX_CFG_RCACHE_NUM_BANKS = 1
VX_CFG_RCACHE_NUM_WAYS  = 2
VX_CFG_RCACHE_CRSQ_SIZE = 0
VX_CFG_RCACHE_MSHR_SIZE = 16
VX_CFG_RCACHE_MRSQ_SIZE = 0
VX_CFG_RCACHE_MREQ_SIZE = 0
VX_CFG_NUM_RCACHES      = "expr: max(1, up($VX_CFG_NUM_RASTER_CORES / 4))"

[rtcache]
# RTU-private L1 BVH/scene cache. Mirrors the rcache shape
# (raster cache) — RtuCore goes direct to L2 today; this cache sits
# between them so cross-ray reuse of the same BVH nodes (root,
# upper-level internals) hits in L1 instead of thrashing L2.
# Sized larger than rcache because BVH walks touch many more lines
# per ray (root + a couple internals + leaf + tri data ≈ 5-8 lines
# per primary ray; secondary rays reuse the upper-level set).
VX_CFG_RTCACHE_SIZE      = 8192
VX_CFG_RTCACHE_NUM_BANKS = 1
VX_CFG_RTCACHE_NUM_WAYS  = 2
VX_CFG_RTCACHE_CRSQ_SIZE = 2
VX_CFG_RTCACHE_MSHR_SIZE = 16
VX_CFG_RTCACHE_MREQ_SIZE = 4
VX_CFG_RTCACHE_MRSQ_SIZE = 0
VX_CFG_NUM_RTCACHES      = "expr: max(1, up($VX_CFG_NUM_RTU_CORES / 4))"

[ocache]
VX_CFG_OCACHE_SIZE      = 16384
VX_CFG_OCACHE_NUM_BANKS = 1
VX_CFG_OCACHE_NUM_WAYS  = 2
VX_CFG_OCACHE_CRSQ_SIZE = 0
VX_CFG_OCACHE_MSHR_SIZE = 16
VX_CFG_OCACHE_MRSQ_SIZE = 0
VX_CFG_OCACHE_MREQ_SIZE = 0
VX_CFG_NUM_OCACHES      = "expr: max(1, up($VX_CFG_NUM_OM_CORES / 4))"

[frontend]
# SM front end as on the H100: per-warp uniform registers (URs) and UR operands, one-thread
# TMA issue from URs, ELECT/MATCH/REDUX in hardware. Every value is per warp or per SM.
VX_CFG_H100_FE_ENABLE = "expr: $VX_CFG_H100_ORG_ENABLE"

# mbarrier and TMA engine knobs that select on the switch: the unresolved headers
# test it with #ifdef, so they follow its definition.
# Longest an mbarrier try_wait keeps its warp suspended before returning false;
# must stay well below the scheduler's stall timeout. With the front end, a warp
# with an inactive lane is not suspended (12/spec.md §4.4).
VX_CFG_MBAR_SUSPEND_CYCLES = "expr: 7762 if $VX_CFG_H100_FE_ENABLE else 1024"
VX_CFG_DXA_QUEUE_SIZE = "expr: $VX_CFG_TMA_QUEUE if $VX_CFG_H100_FE_ENABLE else 16"
# Bulk async-groups pending per warp: a 6-bit counter, wait_group N clamped to BULK_GROUPS - 1.
VX_CFG_BULK_GROUPS = "expr: 64 if $VX_CFG_H100_FE_ENABLE else 8"
# Line slots per DXA worker, the line reader's memory window (a capacity; the H100 keeps ~50-60
# 16-B copies in flight per SM, 14 M7): a power of two, the response tag's slot field; at most 64
# with the front end, whose drain marks held slots in a 64-bit mask.
VX_CFG_DXA_MAX_INFLIGHT = "expr: 64 if $VX_CFG_H100_FE_ENABLE else 8"

# URs per warp, URZ = UR63, the last index of the 6-bit UR field.
VX_CFG_UREG_COUNT = 64
# A UR source takes no GPR bank port.
VX_CFG_UREG_BANK_EXEMPT = 1

# Warp-op unit (ELECT, MATCH, REDUX): 1 = one unit per core shared by the ALU blocks, 0 = one per
# ALU block (issue slice).
VX_CFG_WARP_OP_SHARED = 1

# Tensor-map cache: level 1 in each socket's DXA lookup, level 2 one per cluster (= GPC) shared
# by its SMs, in 128-B lines; both emptied at every launch. REPL: L1 0 = round robin, 1 = LRU;
# L2 0 = FIFO, 1 = tree-PLRU.
VX_CFG_TMAP_L1_ENTRIES = 8
VX_CFG_TMAP_L1_REPL = 1
VX_CFG_TMAP_L2_ENTRIES = 1024
VX_CFG_TMAP_L2_WAYS = 8
VX_CFG_TMAP_L2_REPL = 1
# The kernel argument bytes level 2 loads at launch (the CUDA parameter space).
VX_CFG_TMAP_PARAM_BYTES = 4096
# Parameter-window reads in flight per engine: a read carries its slot in the memory tag.
VX_CFG_TMAP_PARAM_READS = 8

[[check]]
FE_ONE_PACKET = ["expr: (not $VX_CFG_H100_FE_ENABLED) or $VX_CFG_NUM_ALU_LANES == $VX_CFG_NUM_THREADS", "the H100 front end needs one ALU packet per warp (NUM_ALU_LANES == NUM_THREADS)"]
FE_REG_FIELD = ["expr: (not $VX_CFG_H100_FE_ENABLED) or $VX_CFG_EXT_F_ENABLED", "the H100 front end carries a 6-bit UR index in the register field, which needs the F extension"]
UREG_COUNT_RANGE = ["expr: (not $VX_CFG_H100_FE_ENABLED) or $VX_CFG_UREG_COUNT == 64", "VX_CFG_UREG_COUNT must be 64: every 6-bit UR index names a register, URZ = UR63"]
UREG_BANK_EXEMPT_ONE = ["expr: (not $VX_CFG_H100_FE_ENABLED) or $VX_CFG_UREG_BANK_EXEMPT == 1", "VX_CFG_UREG_BANK_EXEMPT must be 1: a UR operand is not a vector-register read"]
WARP_OP_SHARED_RANGE = ["expr: (not $VX_CFG_H100_FE_ENABLED) or ($VX_CFG_WARP_OP_SHARED >= 0 and $VX_CFG_WARP_OP_SHARED <= 1)", "VX_CFG_WARP_OP_SHARED must be 0 (one warp-op unit per ALU block) or 1 (one per core)"]
WARP_OP_LANES_MIN = ["expr: (not $VX_CFG_H100_FE_ENABLED) or $VX_CFG_NUM_THREADS >= 2", "the warp-op reduction tree needs at least 2 threads"]
TMAP_L1_SHAPE = ["expr: (not $VX_CFG_H100_FE_ENABLED) or (is_pow2($VX_CFG_TMAP_L1_ENTRIES) and $VX_CFG_TMAP_L1_ENTRIES >= 2 and $VX_CFG_TMAP_L1_REPL >= 0 and $VX_CFG_TMAP_L1_REPL <= 1)", "VX_CFG_TMAP_L1_ENTRIES must be a power of two >= 2 and VX_CFG_TMAP_L1_REPL 0 (round robin) or 1 (LRU)"]
TMAP_L2_SHAPE = ["expr: (not $VX_CFG_H100_FE_ENABLED) or (is_pow2($VX_CFG_TMAP_L2_ENTRIES) and is_pow2($VX_CFG_TMAP_L2_WAYS) and $VX_CFG_TMAP_L2_WAYS >= 2 and $VX_CFG_TMAP_L2_WAYS <= $VX_CFG_TMAP_L2_ENTRIES and $VX_CFG_TMAP_L2_REPL >= 0 and $VX_CFG_TMAP_L2_REPL <= 1)", "VX_CFG_TMAP_L2_ENTRIES and VX_CFG_TMAP_L2_WAYS must be powers of two with 2 <= ways <= entries, VX_CFG_TMAP_L2_REPL 0 (FIFO) or 1 (tree-PLRU)"]
TMAP_PARAM_WINDOW = ["expr: (not $VX_CFG_H100_FE_ENABLED) or (is_pow2($VX_CFG_TMAP_PARAM_BYTES) and $VX_CFG_TMAP_PARAM_BYTES >= 128 and $VX_CFG_TMAP_PARAM_BYTES * 2 <= $VX_CFG_TMAP_L2_ENTRIES * 128)", "VX_CFG_TMAP_PARAM_BYTES must be a power of two >= 128 and at most half of level 2 (128-B lines)"]
TMAP_PARAM_READS = ["expr: (not $VX_CFG_H100_FE_ENABLED) or (is_pow2($VX_CFG_TMAP_PARAM_READS) and $VX_CFG_TMAP_PARAM_READS >= 2 and $VX_CFG_TMAP_PARAM_READS <= 64)", "VX_CFG_TMAP_PARAM_READS must be a power of two from 2 to 64"]

[isa_signatures]

# Standard extension signature
VX_CFG_MISA_STD = "expr: ($VX_CFG_EXT_A_ENABLED << 0) | (0 << 1) | ($VX_CFG_EXT_C_ENABLED << 2) | ($VX_CFG_EXT_D_ENABLED << 3) | (0 << 4) | ($VX_CFG_EXT_F_ENABLED << 5) | (0 << 6) | (0 << 7) | (1 << 8) | (0 << 9) | (0 << 10) | (0 << 11) | ($VX_CFG_EXT_M_ENABLED << 12) | (0 << 13) | (0 << 14) | (0 << 15) | (0 << 16) | (0 << 17) | (0 << 18) | (0 << 19) | (1 << 20) | (0 << 21) | (0 << 22) | (1 << 23) | (0 << 24) | (0 << 25)"

# Custom extensions signature
VX_CFG_MISA_EXT = "expr: ($VX_CFG_ICACHE_ENABLED << 0) | ($VX_CFG_DCACHE_ENABLED << 1) | ($VX_CFG_L2_ENABLED << 2) | ($VX_CFG_L3_ENABLED << 3) | ($VX_CFG_LMEM_ENABLED << 4) | ($VX_CFG_EXT_ZICOND_ENABLED << 5) | ($VX_CFG_EXT_TCU_ENABLED << 9) | ($VX_CFG_EXT_DXA_ENABLED << 10) | ($VX_CFG_EXT_TEX_ENABLED << 6) | ($VX_CFG_EXT_RASTER_ENABLED << 7) | ($VX_CFG_EXT_OM_ENABLED << 8) | ($VX_CFG_EXT_RTU_ENABLED << 11) | ($VX_CFG_EXT_DLMEM_ENABLED << 12)"

[toolchain]
ASIC = false
SYNTHESIS = false
VIVADO = false
QUARTUS = false
YOSYS = false
SYNOPSYS = false
SV_DPI = false

[debug]
VX_DBG_STALL_TIMEOUT = "expr: (100000 * (1 << ($VX_CFG_L2_ENABLED + $VX_CFG_L3_ENABLED)))"
VX_DBG_DEBUG_LEVEL = 3

[[enum]]
VX_CFG_XLEN = [32, 64]
VX_CFG_FLEN = [32, 64]
VX_CFG_FPU_TYPE = ["DPI", "DSP", "FPNEW", "STD"]
VX_CFG_TCU_TYPE = ["DPI", "DSP", "BHF", "TFR", "FPNEW"]
VX_CFG_DRAM_MODEL = ["HBM2", "H100"]
VX_CFG_DRAM_PAGE_POLICY = ["SHARED", "CAP", "OPEN"]
VX_CFG_DRAM_RW_POLICY = ["AGE", "WATERMARK"]
VX_CFG_DRAM_SCHED = ["FRFCFS", "ROWHIT"]
VX_CFG_DRAM_REFRESH = ["PERBANK", "ALLBANK", "OFF"]
VX_CFG_CLUSTER_PLACEMENT = ["H100", "SPREAD"]

[[param]]
VX_CFG_DCACHE_NUM_REQS = "int"
VX_CFG_L2_NUM_REQS = "int"
VX_CFG_L3_NUM_REQS = "int"

[[builtin]]
__FILE__ = "string"
__LINE__ = "int"
